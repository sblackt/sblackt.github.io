name: Build Planner

on:
  push:
    branches: [new]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_EVENT_PREVIEW_BASE_URL: ${{ secrets.REACT_APP_EVENT_PREVIEW_BASE_URL }}
        run: npm run build

      - name: Sync build to planner/
        run: |
          rsync -a --delete \
            --exclude='.gitkeep' \
            build/ planner/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add planner/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build planner [skip ci]"
            git push
          fi
