<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Family Secret Santa 2026 (Not Secret)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-size: 16px;

      /* The room */
      --night: #1d100b;
      --wall: #2a170f;
      --wood: #5a3420;
      --wood-light: #7a4a2c;

      /* The fire */
      --ember: #e8743b;
      --amber: #f2a950;
      --cranberry: #8f2a24;
      --cranberry-deep: #5e1b17;

      /* Wool and paper */
      --wool: #f6e8d2;
      --paper: #fbf3e4;
      --ink: #3a2114;
      --ink-soft: #6f4f3a;

      /* Text on the dark room */
      --text: #fbeedb;
      --text-muted: #e8d3b8;

      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--body);
      color: var(--text);
      background-color: var(--night);
      /* Faint cabin planks */
      background-image:
        repeating-linear-gradient(90deg, rgba(255, 220, 180, 0.03) 0 1px, transparent 1px 148px),
        linear-gradient(180deg, var(--night) 0%, var(--wall) 100%);
      overflow-x: hidden;
    }

    a {
      color: var(--amber);
    }

    :focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    /* Firelight washing up the wall, and a few sparks */
    .firelight {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 95% 60% at 50% 108%, rgba(232, 116, 59, 0.42), transparent 72%),
        radial-gradient(ellipse 60% 34% at 50% 104%, rgba(242, 169, 80, 0.3), transparent 70%);
      animation: flicker 7s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.86; }
      12% { opacity: 1; }
      21% { opacity: 0.8; }
      37% { opacity: 0.96; }
      48% { opacity: 0.84; }
      63% { opacity: 1; }
      78% { opacity: 0.78; }
      90% { opacity: 0.94; }
    }

    .embers {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .embers span {
      position: absolute;
      bottom: -12px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px 2px rgba(232, 116, 59, 0.8);
      opacity: 0;
      animation: rise 13s linear infinite;
    }

    .embers span:nth-child(1) { left: 34%; animation-delay: 0s; }
    .embers span:nth-child(2) { left: 46%; animation-delay: 3.4s; animation-duration: 11s; }
    .embers span:nth-child(3) { left: 58%; animation-delay: 6.1s; }
    .embers span:nth-child(4) { left: 41%; animation-delay: 8.7s; animation-duration: 15s; }
    .embers span:nth-child(5) { left: 66%; animation-delay: 1.9s; animation-duration: 16s; }
    .embers span:nth-child(6) { left: 52%; animation-delay: 10.3s; animation-duration: 10s; }
    .embers span:nth-child(7) { left: 27%; animation-delay: 5.2s; animation-duration: 17s; }

    @keyframes rise {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      8% { opacity: 0.95; }
      50% { transform: translate(26px, -42vh) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-18px, -82vh) scale(0.3); opacity: 0; }
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem) clamp(1rem, 4vw, 3rem) 0;
    }

    /* Hero */
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: clamp(1rem, 4vw, 3rem);
    }

    .intro {
      padding-bottom: clamp(1.25rem, 3vw, 2.5rem);
    }

    .eyebrow {
      margin: 0 0 0.9rem;
      color: var(--amber);
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(2.75rem, 8vw, 5.25rem);
      line-height: 1.02;
      letter-spacing: -0.015em;
      font-variation-settings: 'SOFT' 100, 'WONK' 1;
      text-wrap: balance;
    }

    h1 em {
      color: var(--amber);
      font-weight: 500;
    }

    .tagline {
      margin: 1.1rem 0 0;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--text-muted);
    }

    .scene {
      display: block;
      width: clamp(170px, 30vw, 310px);
      height: auto;
      overflow: visible;
    }

    .scene .flake {
      animation: fall linear infinite;
    }

    @keyframes fall {
      from { transform: translate(0, -30px); }
      to { transform: translate(14px, 330px); }
    }

    .scene .steam {
      fill: none;
      stroke: #fbeedb;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0;
      animation: steam 5s ease-in-out infinite;
    }

    .scene .steam.later {
      animation-delay: 2.2s;
    }

    @keyframes steam {
      0% { transform: translateY(8px); opacity: 0; }
      35% { opacity: 0.55; }
      100% { transform: translateY(-16px); opacity: 0; }
    }

    .scene .candle-flame,
    .hearth .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: lick 2.6s ease-in-out infinite;
    }

    @keyframes lick {
      0%, 100% { transform: scale(1, 1) skewX(0deg); }
      25% { transform: scale(0.95, 1.07) skewX(-2.5deg); }
      55% { transform: scale(1.04, 0.94) skewX(2deg); }
      80% { transform: scale(0.97, 1.04) skewX(-1deg); }
    }

    /* Knitted band, the page's signature */
    .knit {
      height: 44px;
      background: url('./img/knit.svg') center top repeat-x;
    }

    .hero-band {
      margin: 0 calc(50% - 50vw) clamp(2rem, 5vw, 3.5rem);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    /* Menu */
    .page-controls {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 10;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(251, 238, 219, 0.35);
      background: rgba(42, 23, 15, 0.85);
      color: var(--text);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease;
    }

    .menu-button:hover {
      background: var(--wood);
    }

    .menu-dropdown {
      position: absolute;
      top: 52px;
      right: 0;
      min-width: 190px;
      padding: 0.35rem;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    }

    .menu-dropdown[data-open="true"] {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-dropdown button {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      padding: 0.6rem 0.75rem;
      text-align: left;
      font: 600 0.95rem var(--body);
      cursor: pointer;
    }

    .menu-dropdown button:hover {
      background: rgba(143, 42, 36, 0.1);
    }

    /* Sections */
    section {
      margin-bottom: clamp(2.5rem, 6vw, 4rem);
    }

    .section-heading {
      margin-bottom: 1.25rem;
    }

    h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.15;
      font-variation-settings: 'SOFT' 100, 'WONK' 0;
    }

    .hint {
      margin: 0.4rem 0 0;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .sync-status::before {
      content: '';
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .sync-status[data-state="connected"]::before { background: #9bd094; }
    .sync-status[data-state="offline"]::before { background: var(--amber); }
    .sync-status[data-state="error"]::before { background: #f0695a; }

    /* Pairings: knitted-cuff gift tags */
    .pairings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1rem, 2.5vw, 1.75rem);
    }

    .pairings-grid > p {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--text-muted);
    }

    .pair-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 1.25rem;
      overflow: hidden;
      border-radius: 18px;
      background: var(--wool);
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .pair-card:nth-child(odd) { transform: rotate(-0.7deg); }
    .pair-card:nth-child(even) { transform: rotate(0.6deg); }

    .pair-card:hover {
      transform: rotate(0deg) translateY(-3px);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.48), 0 0 34px rgba(242, 169, 80, 0.16);
    }

    .pair-card .knit {
      align-self: stretch;
      flex: none;
    }

    .portrait {
      display: block;
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      background: var(--wool);
      box-shadow: 0 0 0 3px var(--wool), 0 0 0 5px var(--wood-light);
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      /* The drawings sit on white; this melts it into the wool */
      mix-blend-mode: multiply;
    }

    .pair-card .portrait {
      width: 92px;
      height: 92px;
      margin-top: -26px;
    }

    .pair-card .giver {
      margin-top: 0.8rem;
      color: var(--ink-soft);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .pair-card .receiver {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 3.5rem;
      padding: 0 0.5rem;
      font-family: var(--hand);
      font-weight: 600;
      font-size: 2.6rem;
      line-height: 1;
      color: var(--cranberry);
    }

    .pair-card .receiver[data-hidden="false"] {
      animation: unwrap 0.4s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .pair-card .receiver[data-hidden="true"] {
      font-size: 1.6rem;
      color: var(--ink-soft);
    }

    @keyframes unwrap {
      from { transform: scale(0.7) rotate(-4deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .reveal-button {
      min-height: 40px;
      margin-top: 0.35rem;
      padding: 0.4rem 1.05rem;
      border: none;
      border-radius: 999px;
      background: var(--cranberry);
      color: var(--paper);
      font: 700 0.9rem var(--body);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .reveal-button:hover {
      background: var(--cranberry-deep);
    }

    .reveal-button[aria-pressed="true"] {
      background: transparent;
      color: var(--ink-soft);
      box-shadow: inset 0 0 0 1.5px rgba(111, 79, 58, 0.5);
    }

    .reveal-button[aria-pressed="true"]:hover {
      background: rgba(111, 79, 58, 0.12);
    }

    /* Wish lists: letters on ruled paper */
    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1rem, 2.5vw, 1.75rem);
      margin-top: 1.25rem;
    }

    .suggestion-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
      padding: 1.25rem;
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
    }

    .suggestion-card .who {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .suggestion-card .portrait {
      width: 44px;
      height: 44px;
      background: var(--paper);
      box-shadow: 0 0 0 2px var(--wood-light);
    }

    .suggestion-card h3 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.35rem;
      font-variation-settings: 'SOFT' 100, 'WONK' 0;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 10.5rem;
      padding: 0 0.25rem;
      border: none;
      border-radius: 0;
      resize: vertical;
      overflow: auto;
      font-family: var(--body);
      font-size: 1rem;
      line-height: 1.75rem;
      color: var(--ink);
      background-color: transparent;
      background-image: repeating-linear-gradient(transparent 0 calc(1.75rem - 1px), rgba(122, 74, 44, 0.24) calc(1.75rem - 1px) 1.75rem);
      background-attachment: local;
    }

    textarea::placeholder {
      color: var(--ink-soft);
      opacity: 1;
    }

    textarea:focus {
      outline: 2px solid var(--ember);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .suggestion-preview {
      padding: 0.7rem 0.85rem;
      border-radius: 6px;
      background: rgba(143, 42, 36, 0.07);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .suggestion-preview[hidden] {
      display: none;
    }

    .suggestion-preview a {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--cranberry);
    }

    .suggestion-preview a:last-child {
      margin-bottom: 0;
    }

    .save-indicator {
      margin-top: auto;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .save-indicator[data-state="saved-online"] { color: #3f6140; }
    .save-indicator[data-state="saving"] { color: #85561b; }
    .save-indicator[data-state="saved-offline"] { color: #2f6275; }
    .save-indicator[data-state="error"] { color: #a32020; }

    /* The hearth */
    .hearth {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 1.5rem;
      text-align: center;
    }

    .hearth .past {
      margin: 0 0 1.5rem;
      color: var(--text-muted);
    }

    .hearth svg {
      display: block;
      width: min(420px, 100%);
      height: auto;
    }

    .hearth .flame.mid { animation-duration: 1.9s; animation-delay: -0.6s; }
    .hearth .flame.core { animation-duration: 1.4s; animation-delay: -1s; }

    @media (max-width: 860px) {
      .pairings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .suggestions-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .hero {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 0.5rem;
      }

      .intro {
        justify-self: stretch;
        padding: 0 3.25rem 0 0;
      }

      .tagline {
        margin-right: -3.25rem;
      }

      .scene {
        width: 190px;
      }

      .suggestions-grid {
        grid-template-columns: 1fr;
      }

      .pair-card .portrait {
        width: 72px;
        height: 72px;
      }

      .pair-card .receiver {
        font-size: 2.2rem;
      }

      .pair-card .receiver[data-hidden="true"] {
        font-size: 1.4rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .embers,
      .scene .flakes,
      .scene .steam {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="firelight" aria-hidden="true"></div>
  <div class="embers" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <main>
    <header class="hero">
      <div class="page-controls">
        <button class="menu-button" id="menuButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuDropdown" aria-label="Open menu">⋯</button>
        <div class="menu-dropdown" id="menuDropdown" role="menu" aria-hidden="true">
          <button type="button" role="menuitem" id="shuffleMenuItem">Shuffle pairings</button>
        </div>
      </div>
      <div class="intro">
        <p class="eyebrow">White Family · 2026</p>
        <h1>Not-so-Secret <em>Santa</em></h1>
        <p class="tagline">Merry Christmas. Pull up a chair, the fire's going.</p>
      </div>

      <svg class="scene" viewBox="0 0 320 360" role="img" aria-label="Snow falling outside a window, with a steaming mug and a lit candle on the sill">
        <defs>
          <clipPath id="glass"><path d="M56 326V150a104 104 0 0 1 208 0v176z"/></clipPath>
          <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#121d2c"/>
            <stop offset="1" stop-color="#34475c"/>
          </linearGradient>
          <radialGradient id="candleGlow">
            <stop offset="0" stop-color="#f2a950" stop-opacity="0.65"/>
            <stop offset="1" stop-color="#f2a950" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <path d="M40 340V150a120 120 0 0 1 240 0v190z" fill="#5a3420"/>
        <g clip-path="url(#glass)">
          <rect x="50" y="40" width="220" height="290" fill="url(#dusk)"/>
          <circle cx="212" cy="104" r="17" fill="#f3e9d4"/>
          <path d="M92 262l16-44 16 44zM74 276l18-54 18 54zM226 268l14-40 14 40zM202 280l19-58 19 58z" fill="#0e1823"/>
          <path d="M40 286c42-26 82-22 124-2s76 16 110-6v60H40z" fill="#d7e0e6"/>
          <path d="M40 308c52-14 104-10 150 0s64 4 84-4v34H40z" fill="#eef2f4"/>
          <g class="flakes" fill="#fff">
            <circle class="flake" cx="70" cy="30" r="2.6" style="animation-duration:9s;animation-delay:-1s"/>
            <circle class="flake" cx="92" cy="30" r="1.8" style="animation-duration:12s;animation-delay:-7s"/>
            <circle class="flake" cx="112" cy="30" r="3" style="animation-duration:8s;animation-delay:-4s"/>
            <circle class="flake" cx="134" cy="30" r="2" style="animation-duration:11s;animation-delay:-9s"/>
            <circle class="flake" cx="150" cy="30" r="2.6" style="animation-duration:10s;animation-delay:-2s"/>
            <circle class="flake" cx="172" cy="30" r="1.8" style="animation-duration:13s;animation-delay:-5s"/>
            <circle class="flake" cx="190" cy="30" r="3" style="animation-duration:9s;animation-delay:-6.5s"/>
            <circle class="flake" cx="208" cy="30" r="2.2" style="animation-duration:11s;animation-delay:-3s"/>
            <circle class="flake" cx="228" cy="30" r="2.6" style="animation-duration:8.5s;animation-delay:-7.5s"/>
            <circle class="flake" cx="246" cy="30" r="1.8" style="animation-duration:12s;animation-delay:-1.5s"/>
            <circle class="flake" cx="82" cy="30" r="2.2" style="animation-duration:10s;animation-delay:-5.5s"/>
            <circle class="flake" cx="160" cy="30" r="1.6" style="animation-duration:14s;animation-delay:-10s"/>
          </g>
        </g>
        <rect x="155" y="40" width="10" height="290" fill="#5a3420"/>
        <rect x="50" y="186" width="220" height="10" fill="#5a3420"/>

        <!-- Sill -->
        <rect x="16" y="334" width="288" height="20" rx="5" fill="#7a4a2c"/>
        <rect x="16" y="348" width="288" height="6" rx="3" fill="#4a2a18"/>

        <!-- Mug -->
        <path class="steam" d="M92 268c-7-9 7-15 0-25"/>
        <path class="steam later" d="M112 266c-7-9 7-15 0-25"/>
        <path d="M134 296h10a15 15 0 0 1 0 30h-10" fill="none" stroke="#8f2a24" stroke-width="7"/>
        <path d="M72 280h66v44a11 11 0 0 1-11 11H83a11 11 0 0 1-11-11z" fill="#8f2a24"/>
        <ellipse cx="105" cy="280" rx="33" ry="6.5" fill="#6b1f1a"/>
        <ellipse cx="105" cy="281" rx="27" ry="4.2" fill="#6b3a20"/>
        <rect x="72" y="298" width="66" height="19" fill="#f6e8d2"/>
        <path d="M78 307.500l5-5 5 5-5 5zM92 307.500l5-5 5 5-5 5zM106 307.500l5-5 5 5-5 5zM120 307.500l5-5 5 5-5 5z" fill="#8f2a24"/>

        <!-- Candle -->
        <circle cx="228" cy="262" r="44" fill="url(#candleGlow)"/>
        <rect x="216" y="280" width="24" height="54" rx="3" fill="#f6e8d2"/>

    <div class="knit hero-band" aria-hidden="true"></div>

    <section aria-labelledby="pairings-title">
      <div class="section-heading">
        <h2 id="pairings-title">Who's got who</h2>
        <p class="hint">Find your tag and unwrap it.</p>

      <div class="pairings-grid" id="pairingsGrid" aria-live="polite"></div>
      <p class="sync-status" id="pairingsStatus" data-state="syncing">Loading saved pairings…</p>

    <section aria-labelledby="suggestions-title">
      <div class="section-heading">
        <h2 id="suggestions-title">Wish lists</h2>
        <p class="hint">Drop in hints, links and sizes. Your list saves as you type.</p>
        <p class="sync-status" id="syncStatus" data-state="syncing">Connecting…</p>
      </div>
      <div class="suggestions-grid" id="suggestionsGrid"></div>
    </section>

  <footer class="hearth">
    <p class="past">Past years: <a href="./2025/">2025</a></p>
    <svg viewBox="0 0 300 170" aria-hidden="true">
      <path class="flame" d="M150 150c-52 0-74-34-58-72 6 12 14 17 22 17-8-32 8-64 40-84-4 26 10 38 24 54 6-6 8-14 8-22 22 22 30 48 22 70-8 24-30 37-58 37z" fill="#e8743b"/>
      <path class="flame mid" d="M150 150c-32 0-48-22-38-48 6 8 12 11 18 10-4-22 6-42 24-56-1 18 8 27 17 38 4-4 6-9 6-15 13 16 18 33 12 47-6 15-20 24-39 24z" fill="#f2a950"/>
      <path class="flame core" d="M150 150c-16 0-25-12-20-26 4 4 7 5 10 5-2-12 4-23 12-30 0 10 5 15 10 21 2-2 3-5 3-8 7 9 9 18 6 25-3 8-11 13-21 13z" fill="#fde3a7"/>

        <rect x="52" y="138" width="196" height="20" rx="10" transform="rotate(-6 150 148)"/>
        <rect x="52" y="138" width="196" height="20" rx="10" transform="rotate(6 150 148)"/>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD3giFeU-zkVUx36U4D2YGAM-_vtP15aho',
      authDomain: 'the-meeple-planner.firebaseapp.com',
      projectId: 'the-meeple-planner',
      storageBucket: 'the-meeple-planner.firebasestorage.app',
      messagingSenderId: '435277919251',
      appId: '1:435277919251:web:4cfb2ec26e5c55a5007be6',
      measurementId: 'G-9VPCFFFP7T'
    };

    const appCheckSiteKey = '6LfFryQsAAAAADqdLut-1om_HfsZYq1zYno5HRiq';

    const people = ['Michael', 'Diane', 'Sarah', 'Chris', 'Steve', 'Jess'];
    const displayOrder = people.reduce((acc, name, index) => {
      acc[name] = index;
      return acc;
    }, {});
    const giverAvatars = {
      Michael: './portraits/mike.webp',
      Diane: './portraits/diane.webp',
      Sarah: './portraits/sarah.webp',
      Chris: './portraits/chris.webp',
      Steve: './portraits/steve.webp',
      Jess: './portraits/jess.webp'
    };
    const disallowedPairs = new Set([
      'Chris|Sarah',
      'Sarah|Chris',
      'Michael|Diane',
      'Diane|Michael',
      'Steve|Jess',
      'Jess|Steve'
    ]);
    const wishlistStorageKey = 'whiteFamilySecretSantaSuggestions_2026';
    const pairingsStorageKey = 'whiteFamilySecretSantaPairings_2026';
    const revealStorageKey = 'whiteFamilySecretSantaReveals_2026';
    const adminPassword = 'eganville';
    const adminStorageKey = 'whiteFamilySantaAdmin';
    const urlPattern = /((https?:\/\/|www\.)[^\s]+)/gi;

    const pairingsGrid = document.getElementById('pairingsGrid');
    const pairingsStatus = document.getElementById('pairingsStatus');
    const suggestionsGrid = document.getElementById('suggestionsGrid');
    const menuButton = document.getElementById('menuButton');
    const menuDropdown = document.getElementById('menuDropdown');
    const shuffleMenuItem = document.getElementById('shuffleMenuItem');
    const syncStatus = document.getElementById('syncStatus');

    const indicators = new Map();
    const textareas = new Map();
    const previews = new Map();
    const pendingSaves = new Map();

    let wishlistDocRef = null;
    let pairingsDocRef = null;
    let firestoreUnavailable = false;
    let suggestionValues = readWishlistBackup();
    let latestPairings = readPairingsBackup();
    let revealedGivers = readRevealStates();
    let hasAdminAccess = sessionStorage.getItem(adminStorageKey) === 'true';

    function readWishlistBackup() {
      try {
        const raw = localStorage.getItem(wishlistStorageKey);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        console.warn('Unable to read local wishlist backup', error);
        return {};
      }
    }

    function writeWishlistBackup(data) {
      try {
        localStorage.setItem(wishlistStorageKey, JSON.stringify(data));
      } catch (error) {
        console.warn('Unable to write local wishlist backup', error);
      }
    }

    function readPairingsBackup() {
      try {
        const raw = localStorage.getItem(pairingsStorageKey);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        console.warn('Unable to read local pairings backup', error);
        return [];
      }
    }

    function writePairingsBackup(data) {
      try {
        localStorage.setItem(pairingsStorageKey, JSON.stringify(data));
      } catch (error) {
        console.warn('Unable to write local pairings backup', error);
      }
    }

    function readRevealStates() {
      try {
        const raw = localStorage.getItem(revealStorageKey);
        if (!raw) {
          return new Set();
        }
        const parsed = JSON.parse(raw);
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch (error) {
        console.warn('Unable to read reveal states', error);
        return new Set();
      }
    }

    function writeRevealStates(set) {
      try {
        localStorage.setItem(revealStorageKey, JSON.stringify(Array.from(set)));
      } catch (error) {
        console.warn('Unable to persist reveal states', error);
      }
    }

    function resetRevealStates() {
      revealedGivers = new Set();
      writeRevealStates(revealedGivers);
    }

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function isValidPair(giver, receiver) {
      return giver !== receiver && !disallowedPairs.has(`${giver}|${receiver}`);
    }

    function createDerangement(items, maxAttempts = 1000) {
      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        const givers = shuffle(items);
        const receivers = shuffle(items);

        if (givers.every((giver, idx) => isValidPair(giver, receivers[idx]))) {
          return givers.map((giver, idx) => ({
            giver,
            receiver: receivers[idx]
          }));
        }
      }
      throw new Error('Could not build pairings within the rules.');
    }

    function createPortrait(name) {
      const frame = document.createElement('span');
      frame.className = 'portrait';
      const image = document.createElement('img');
      image.src = giverAvatars[name];
      image.alt = '';
      image.width = 320;
      image.height = 320;
      frame.appendChild(image);
      return frame;
    }

    function renderPairingCards(pairings) {
      pairingsGrid.innerHTML = '';
      const ordered = [...pairings].sort((a, b) => {
        return (displayOrder[a.giver] ?? 0) - (displayOrder[b.giver] ?? 0);
      });
      ordered.forEach(({ giver, receiver }) => {
        const card = document.createElement('article');
        card.className = 'pair-card';

        const cuff = document.createElement('div');
        cuff.className = 'knit';

        const giverSpan = document.createElement('span');
        giverSpan.className = 'giver';
        giverSpan.textContent = `From ${giver}`;

        const receiverSpan = document.createElement('span');
        receiverSpan.className = 'receiver';

        const revealButton = document.createElement('button');
        revealButton.className = 'reveal-button';
        revealButton.type = 'button';

        const syncRevealState = () => {
          const isRevealed = revealedGivers.has(giver);
          receiverSpan.textContent = isRevealed ? receiver : 'Who could it be?';
          receiverSpan.dataset.hidden = isRevealed ? 'false' : 'true';
          revealButton.textContent = isRevealed ? 'Wrap it back up' : 'Unwrap';
          revealButton.setAttribute('aria-pressed', String(isRevealed));
        };

        const toggleReveal = () => {
          const isRevealed = revealedGivers.has(giver);
          if (isRevealed) {
            revealedGivers.delete(giver);
          } else {
            revealedGivers.add(giver);
          }
          writeRevealStates(revealedGivers);
          syncRevealState();
        };

        revealButton.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleReveal();
        });

        card.addEventListener('click', (event) => {
          if (event.target === revealButton) return;
          toggleReveal();
        });

        syncRevealState();

        card.append(cuff, createPortrait(giver), giverSpan, receiverSpan, revealButton);
        pairingsGrid.appendChild(card);
      });
    }

    function formatTimestamp(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '';
      }
      return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function updatePairingsStatus(message, state = 'idle') {
      if (!pairingsStatus) return;
      pairingsStatus.textContent = message;
      pairingsStatus.dataset.state = state;
    }

    function applyPairings(pairings, source = 'local', metadata = {}) {
      const pairingsChanged = !pairingsAreEqual(latestPairings, pairings);
      latestPairings = pairings;
      if (pairingsChanged) {
        resetRevealStates();
      }
      renderPairingCards(pairings);
      writePairingsBackup(pairings);

      if (source === 'cloud') {
        const formatted = metadata.updatedAt ? formatTimestamp(metadata.updatedAt) : '';
        updatePairingsStatus(formatted ? `Synced · updated ${formatted}` : 'Synced from cloud', 'connected');
      } else if (source === 'local-offline') {
        updatePairingsStatus('Using pairings saved on this device', 'offline');
      } else if (source === 'local-new') {
        updatePairingsStatus('Saving new pairings…', 'saving');
      }
    }

    function pairingsListToMap(pairings) {
      return pairings.reduce((acc, { giver, receiver }) => {
        acc[giver] = receiver;
        return acc;
      }, {});
    }

    function pairingsMapToList(map = {}) {
      return Object.entries(map)
        .map(([giver, receiver]) => ({ giver, receiver }))
        .sort((a, b) => (displayOrder[a.giver] ?? 0) - (displayOrder[b.giver] ?? 0));
    }

    function pairingsAreEqual(a = [], b = []) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) {
        return false;
      }
      for (let i = 0; i < a.length; i += 1) {
        if (a[i].giver !== b[i].giver || a[i].receiver !== b[i].receiver) {
          return false;
        }
      }
      return true;
    }

    async function savePairingsToCloud(pairings) {
      if (!pairingsDocRef) return null;
      const updatedAt = new Date().toISOString();
      await setDoc(pairingsDocRef, { pairs: pairingsListToMap(pairings), updatedAt }, { merge: true });
      return updatedAt;
    }

    async function loadPairingsFromCloud() {
      if (!pairingsDocRef) return;
      try {
        const snapshot = await getDoc(pairingsDocRef);
        if (snapshot.exists()) {
          const data = snapshot.data();
          const pairings = pairingsMapToList(data.pairs || {});
          if (pairings.length) {
            applyPairings(pairings, 'cloud', { updatedAt: data.updatedAt });
            return;
          }
        }
        const freshPairings = createDerangement(people);
        const updatedAt = await savePairingsToCloud(freshPairings);
        applyPairings(freshPairings, 'cloud', { updatedAt });
      } catch (error) {
        console.error('Unable to load pairings', error);
        if (latestPairings.length) {
          updatePairingsStatus('Could not load saved pairings · showing local copy', 'error');
        } else {
          pairingsGrid.innerHTML = '<p>The pairings aren\'t ready yet. Check back soon.</p>';
          updatePairingsStatus('Could not reach the saved pairings', 'error');
        }
      }
    }

    async function handleShuffleRequest() {
      if (!ensureAdminAccess()) {
        return;
      }

      if (firestoreUnavailable || !pairingsDocRef) {
        alert('Need a Firebase connection before shuffling so everyone sees the same matches.');
        return;
      }

      let nextPairings;
      try {
        nextPairings = createDerangement(people);
      } catch (error) {
        alert('Could not build a valid set of pairings. Try again.');
        return;
      }

      applyPairings(nextPairings, 'local-new');
      try {
        const updatedAt = await savePairingsToCloud(nextPairings);
        applyPairings(nextPairings, 'cloud', { updatedAt });
      } catch (error) {
        console.error('Unable to save new pairings', error);
        updatePairingsStatus('Could not save new pairings · showing local copy', 'error');
      }
    }

    function requestAdminAccess() {
      const attempt = window.prompt('Enter the family password to unlock pairings:');
      if (!attempt) {
        return false;
      }
      if (attempt.trim().toLowerCase() === adminPassword) {
        hasAdminAccess = true;
        sessionStorage.setItem(adminStorageKey, 'true');
        return true;
      }
      alert('That password did not match. Ask Steve for the latest password if you forgot it.');
      return false;
    }

    function ensureAdminAccess() {
      return hasAdminAccess || requestAdminAccess();
    }

    function extractLinks(text = '') {
      urlPattern.lastIndex = 0;
      let match;
      const links = [];
      while ((match = urlPattern.exec(text)) !== null) {
        const [raw] = match;
        links.push({
          raw,
          href: raw.startsWith('http') ? raw : `https://${raw}`
        });
      }
      return links;
    }

    function updatePreviewElement(preview, value) {
      preview.replaceChildren();
      const links = extractLinks(value);
      if (!links.length) {
        preview.hidden = true;
        return;
      }

      preview.hidden = false;
      links.forEach(({ raw, href }) => {
        const anchor = document.createElement('a');
        anchor.href = href;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        anchor.textContent = raw;
        preview.appendChild(anchor);
      });
    }

    function updatePreviewFor(name, value) {
      const preview = previews.get(name);
      if (!preview) return;
      updatePreviewElement(preview, value);
    }

    function renderSuggestions(initialValues = {}) {
      suggestionsGrid.innerHTML = '';
      people.forEach((name) => {
        const card = document.createElement('article');
        card.className = 'suggestion-card';

        const who = document.createElement('div');
        who.className = 'who';
        const title = document.createElement('h3');
        title.textContent = name;
        who.append(createPortrait(name), title);

        const textarea = document.createElement('textarea');
        textarea.placeholder = 'Gift ideas, sizes, links…';
        textarea.value = initialValues[name] || '';
        textarea.dataset.person = name;
        textarea.setAttribute('aria-label', `${name}'s wish list`);

        const indicator = document.createElement('span');
        indicator.className = 'save-indicator';
        const hasValue = Boolean(textarea.value);
        indicator.textContent = hasValue ? 'Saved locally' : 'Nothing saved yet';
        indicator.dataset.state = hasValue ? 'saved-offline' : 'idle';

        textarea.addEventListener('input', () => handleInput(name, textarea.value));

        const preview = document.createElement('div');
        preview.className = 'suggestion-preview';
        updatePreviewElement(preview, textarea.value);

        card.appendChild(who);
        card.appendChild(textarea);
        card.appendChild(preview);
        card.appendChild(indicator);
        suggestionsGrid.appendChild(card);

        textareas.set(name, textarea);
        indicators.set(name, indicator);
        previews.set(name, preview);
      });
    }

    function handleInput(name, value) {
      updatePreviewFor(name, value);
      suggestionValues[name] = value;
      writeWishlistBackup(suggestionValues);
      updateIndicator(name, value ? 'saving' : 'idle', value ? 'Saving…' : 'Nothing saved yet');

      if (firestoreUnavailable || !wishlistDocRef) {
        updateIndicator(name, value ? 'saved-offline' : 'idle', value ? 'Saved locally' : 'Nothing saved yet');
        return;
      }

      queueRemoteSave(name, value);
    }

    function updateIndicator(name, state, message) {
      const indicator = indicators.get(name);
      if (!indicator) return;
      indicator.dataset.state = state;
      indicator.textContent = message;
    }

    function queueRemoteSave(name, value) {
      if (pendingSaves.has(name)) {
        clearTimeout(pendingSaves.get(name));
      }

      const timeout = setTimeout(async () => {
        try {
          await setDoc(wishlistDocRef, { [name]: value }, { merge: true });
          updateIndicator(name, value ? 'saved-online' : 'idle', value ? 'Saved to cloud' : 'Nothing saved yet');
        } catch (error) {
          console.error('Unable to save suggestion', error);
          updateIndicator(name, 'error', 'Could not save (will stay local)');
          firestoreUnavailable = true;
          updateSyncStatus('Disconnected · edits stay on this device until connection returns', 'error');
        } finally {
          pendingSaves.delete(name);
        }
      }, 600);

      pendingSaves.set(name, timeout);
    }

    function applyRemoteValues(data) {
      suggestionValues = { ...suggestionValues, ...data };
      writeWishlistBackup(suggestionValues);

      Object.entries(suggestionValues).forEach(([name, value]) => {
        const textarea = textareas.get(name);
        if (!textarea) return;

        if (document.activeElement !== textarea) {
          textarea.value = value || '';
        }

        if (value) {
          updateIndicator(name, wishlistDocRef ? 'saved-online' : 'saved-offline', wishlistDocRef ? 'Saved to cloud' : 'Saved locally');
        } else {
          updateIndicator(name, 'idle', 'Nothing saved yet');
        }
        updatePreviewFor(name, value || '');
      });
    }

    function updateSyncStatus(message, state = 'idle') {
      if (!syncStatus) return;
      syncStatus.textContent = message;
      syncStatus.dataset.state = state;
    }

    async function loadWishlistsFromCloud() {
      if (!wishlistDocRef) return;
      try {
        const snapshot = await getDoc(wishlistDocRef);
        if (snapshot.exists()) {
          applyRemoteValues(snapshot.data());
        } else {
          await setDoc(wishlistDocRef, suggestionValues, { merge: true });
        }
      } catch (error) {
        console.error('Unable to load remote suggestions', error);
        updateSyncStatus('Could not load saved ideas · retrying later', 'error');
      }
    }

    async function bootstrapFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        initializeAppCheck(app, {
          provider: new ReCaptchaV3Provider(appCheckSiteKey),
          isTokenAutoRefreshEnabled: true
        });
        const db = getFirestore(app);
        wishlistDocRef = doc(db, 'secretSanta', 'wishlists2026');
        pairingsDocRef = doc(db, 'secretSanta', 'pairings2026');
        updateSyncStatus('Connected', 'connected');
        updatePairingsStatus('Connected · loading saved pairings…', 'syncing');
      } catch (error) {
        console.error('Firebase initialization failed', error);
        firestoreUnavailable = true;
        updateSyncStatus('Offline mode · ideas stay on this device', 'offline');
        updatePairingsStatus('Offline mode · showing local pairings', 'offline');
        if (!latestPairings.length) {
          try {
            const fallback = createDerangement(people);
            applyPairings(fallback, 'local-offline');
          } catch (err) {
            pairingsGrid.innerHTML = '<p>Unable to build pairings while offline.</p>';
          }
        }
        return;
      }

      await Promise.all([loadPairingsFromCloud(), loadWishlistsFromCloud()]);
    }

    function bindMenu() {
      function closeMenu() {
        menuDropdown.dataset.open = 'false';
        menuDropdown.setAttribute('aria-hidden', 'true');
        menuButton.setAttribute('aria-expanded', 'false');
      }

      function openMenu() {
        if (!ensureAdminAccess()) {
          return;
        }
        menuDropdown.dataset.open = 'true';
        menuDropdown.setAttribute('aria-hidden', 'false');
        menuButton.setAttribute('aria-expanded', 'true');
      }

      function toggleMenu() {
        const isOpen = menuDropdown.dataset.open === 'true';
        if (isOpen) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleMenu();
      });

      document.addEventListener('click', (event) => {
        if (!menuDropdown.contains(event.target) && event.target !== menuButton) {
          closeMenu();
        }
      });

      shuffleMenuItem.addEventListener('click', () => {
        closeMenu();
        handleShuffleRequest();
      });
    }

    function init() {
      if (latestPairings.length) {
        applyPairings(latestPairings, 'local-offline');
      } else {
        pairingsGrid.innerHTML = '<p>Loading pairings…</p>';
      }
      renderSuggestions(suggestionValues);
      bindMenu();
      bootstrapFirebase();
    }

    init();
  </script>
