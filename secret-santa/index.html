<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Family Secret Santa (Not Secret)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-size: 16px;
      --page-gradient: radial-gradient(circle at 20% 10%, rgba(74, 222, 128, 0.25), transparent 50%), radial-gradient(circle at 80% 0%, rgba(34, 197, 94, 0.2), transparent 55%), linear-gradient(180deg, #05140d 0%, #0c2315 55%, #0f2919 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --accent: #6ed8ac;
      --accent-secondary: #0aa974;
      --accent-soft: rgba(16, 185, 129, 0.18);
      --text: #ecfff5;
      --text-muted: rgba(224, 245, 235, 0.82);
      --card-text: #031f13;
      --border: rgba(255, 255, 255, 0.18);
      --menu-bg: rgba(7, 18, 15, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--page-gradient);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(1.5rem, 4vw, 3rem);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('https://media.easy-peasy.ai/8dbdb37e-9d0c-49e0-9b44-4dea16c58a19/9445c4c9-9ace-4de4-8f47-976747d1b9ad.webp') center/cover no-repeat;
      opacity: 0.32;
      z-index: -2;
    }

    main {
      width: min(1100px, 100%);
      background: transparent;
      border-radius: 0;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      box-shadow: none;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    header .intro {
      display: grid;
      gap: 0.6rem;
      flex: 1;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
      line-height: 1.2;
      color: #f6fff9;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 600;
    }

    header .tagline {
      margin: 0;
      color: rgba(236, 249, 244, 0.92);
      font-size: 1.05rem;
    }

    .page-controls {
      position: relative;
      margin-left: auto;
      align-self: flex-start;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: linear-gradient(135deg, #fff, #fef3f2);
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 30px rgba(4, 18, 29, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .menu-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(4, 18, 29, 0.25);
    }

    .menu-dropdown {
      position: absolute;
      top: 48px;
      right: 0;
      min-width: 180px;
      border-radius: 18px;
      background: var(--menu-bg);
      padding: 0.35rem;
      box-shadow: 0 25px 50px rgba(15, 23, 42, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 10;
    }

    .menu-dropdown[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .menu-dropdown button {
      width: 100%;
      border: none;
      background: transparent;
      color: #f8fafc;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      text-align: left;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .menu-dropdown button:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .winter-frame {
      position: relative;
      padding: 1.35rem;
      border-radius: 24px;
      background: rgba(11, 30, 21, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 40px rgba(5, 20, 13, 0.35);
    }

    section {
      margin-bottom: 3rem;
    }

    section:last-of-type {
      margin-bottom: 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .pairings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .pair-card {
      padding: 1.4rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(240, 249, 244, 0.95));
      box-shadow: 0 18px 35px rgba(2, 22, 15, 0.2);
      display: grid;
      gap: 0.35rem;
      position: relative;
      overflow: hidden;
      color: var(--card-text);
    }

    .pair-card span {
      display: block;
    }

    .pair-card .giver {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-secondary);
    }

    .pair-card .receiver {
      font-size: 1.6rem;
      font-weight: 600;
    }

    .pair-card .receiver[data-hidden="true"] {
      filter: blur(0.45rem);
      color: rgba(3, 31, 19, 0.35);
      letter-spacing: 0.08em;
    }

    .pair-card .arrow {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 600;
    }

    .reveal-button {
      margin-top: 0.65rem;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      padding: 0.35rem 0.95rem;
      background: linear-gradient(135deg, #0f766e, #10b981);
      color: #ecfff5;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      width: fit-content;
    }

    .reveal-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(2, 22, 15, 0.2);
    }

    @keyframes snow {
      from {
        transform: translateY(-10vh);
      }
      to {
        transform: translateY(10vh);
      }
    }

    .hint,
    .sync-status {
      margin: 0.75rem 0 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 5px;
    }

    .winter-frame .hint,
    .winter-frame .sync-status {
      color: rgba(241, 245, 249, 0.9);
    }

    .winter-frame > .hint:first-child {
      margin-top: 0;
    }

    .winter-frame > .sync-status:last-child {
      margin-bottom: 0;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sync-status::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .sync-status[data-state="connected"]::before {
      background: #22c55e;
    }

    .sync-status[data-state="offline"]::before {
      background: #f97316;
    }

    .sync-status[data-state="error"]::before {
      background: #ef4444;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .suggestion-card {
      border-radius: 22px;
      padding: 1.35rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(239, 250, 244, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 18px 30px rgba(5, 25, 17, 0.18);
      display: grid;
      gap: 0.75rem;
      color: var(--card-text);
    }

    .suggestion-card header {
      margin: 0;
    }

    .suggestion-card h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 1rem 1.1rem;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      background: rgba(248, 250, 252, 0.95);
      transition: border 0.2s ease, box-shadow 0.2s ease;
      color: var(--card-text);
      overflow: auto;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .save-indicator {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .save-indicator[data-state="saved-online"] {
      color: #16a34a;
      font-weight: 600;
    }

    .save-indicator[data-state="saving"] {
      color: #7c3aed;
    }

    .save-indicator[data-state="error"] {
      color: #dc2626;
      font-weight: 600;
    }

    .save-indicator[data-state="saved-offline"] {
      color: #0ea5e9;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      body {
        padding: 0rem;
      }

      main {
        padding: 0.5rem;
      }

      header {
        flex-direction: column;
      }

      .page-controls {
        align-self: flex-start;
      }

      .pairings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }

      .suggestions-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .pair-card,
      .suggestion-card,
      .winter-frame {
        padding: 0.5rem;
      }

      textarea {
        min-height: 140px;
      }
    }
  </style>
</head>
  <body>
  <main>
    <header>
         <div class="page-controls">
        <button class="menu-button" id="menuButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuDropdown" aria-label="Open menu">⋯</button>
        <div class="menu-dropdown" id="menuDropdown" role="menu" aria-hidden="true">
          <button type="button" role="menuitem" id="shuffleMenuItem">Shuffle pairings</button>
        </div>
      </div>
      <div class="intro">
        <p class="eyebrow">White Family · 2025</p>
        <h1>Not-so-Secret Santa</h1>
        <p class="tagline">Merry Christmas!</p>
      </div>
   
    </header>

    <section aria-labelledby="pairings-title">
      <div class="section-heading">
        <h2 id="pairings-title">Pairings</h2>
      </div>
      <div class="winter-frame">
        <div class="pairings-grid" id="pairingsGrid" aria-live="polite"></div>
        <p class="sync-status" id="pairingsStatus" data-state="syncing">Loading saved pairings…</p>
      </div>
    </section>

    <section aria-labelledby="suggestions-title">
      <div class="section-heading">
        <h2 id="suggestions-title">Wish List Notes</h2>
      </div>
      <div class="winter-frame">
        <p class="hint">Everyone can drop hints, links, and sizes here!</p>
        <p class="sync-status" id="syncStatus" data-state="syncing">Connecting to Firebase…</p>
        <div class="suggestions-grid" id="suggestionsGrid"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD3giFeU-zkVUx36U4D2YGAM-_vtP15aho',
      authDomain: 'the-meeple-planner.firebaseapp.com',
      projectId: 'the-meeple-planner',
      storageBucket: 'the-meeple-planner.firebasestorage.app',
      messagingSenderId: '435277919251',
      appId: '1:435277919251:web:4cfb2ec26e5c55a5007be6',
      measurementId: 'G-9VPCFFFP7T'
    };

    const people = ['Michael', 'Diane', 'Sarah', 'Chris', 'Steve', 'Jess'];
    const displayOrder = people.reduce((acc, name, index) => {
      acc[name] = index;
      return acc;
    }, {});
    const disallowedPairs = new Set([
      'Chris|Sarah',
      'Sarah|Chris',
      'Michael|Diane',
      'Diane|Michael',
      'Steve|Jess',
      'Jess|Steve'
    ]);
    const wishlistStorageKey = 'whiteFamilySecretSantaSuggestions_v2';
    const pairingsStorageKey = 'whiteFamilySecretSantaPairings_v1';
    const revealStorageKey = 'whiteFamilySecretSantaReveals_v1';
    const adminPassword = 'eganville';
    const adminStorageKey = 'whiteFamilySantaAdmin';

    const pairingsGrid = document.getElementById('pairingsGrid');
    const pairingsStatus = document.getElementById('pairingsStatus');
    const suggestionsGrid = document.getElementById('suggestionsGrid');
    const menuButton = document.getElementById('menuButton');
    const menuDropdown = document.getElementById('menuDropdown');
    const shuffleMenuItem = document.getElementById('shuffleMenuItem');
    const syncStatus = document.getElementById('syncStatus');

    const indicators = new Map();
    const textareas = new Map();
    const pendingSaves = new Map();

    let wishlistDocRef = null;
    let pairingsDocRef = null;
    let firestoreUnavailable = false;
    let suggestionValues = readWishlistBackup();
    let latestPairings = readPairingsBackup();
    let revealedGivers = readRevealStates();
    let hasAdminAccess = sessionStorage.getItem(adminStorageKey) === 'true';

    function readWishlistBackup() {
      try {
        const raw = localStorage.getItem(wishlistStorageKey);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        console.warn('Unable to read local wishlist backup', error);
        return {};
      }
    }

    function writeWishlistBackup(data) {
      try {
        localStorage.setItem(wishlistStorageKey, JSON.stringify(data));
      } catch (error) {
        console.warn('Unable to write local wishlist backup', error);
      }
    }

    function readPairingsBackup() {
      try {
        const raw = localStorage.getItem(pairingsStorageKey);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        console.warn('Unable to read local pairings backup', error);
        return [];
      }
    }

    function writePairingsBackup(data) {
      try {
        localStorage.setItem(pairingsStorageKey, JSON.stringify(data));
      } catch (error) {
        console.warn('Unable to write local pairings backup', error);
      }
    }

    function readRevealStates() {
      try {
        const raw = localStorage.getItem(revealStorageKey);
        if (!raw) {
          return new Set();
        }
        const parsed = JSON.parse(raw);
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch (error) {
        console.warn('Unable to read reveal states', error);
        return new Set();
      }
    }

    function writeRevealStates(set) {
      try {
        localStorage.setItem(revealStorageKey, JSON.stringify(Array.from(set)));
      } catch (error) {
        console.warn('Unable to persist reveal states', error);
      }
    }

    function resetRevealStates() {
      revealedGivers = new Set();
      writeRevealStates(revealedGivers);
    }

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function isValidPair(giver, receiver) {
      return giver !== receiver && !disallowedPairs.has(`${giver}|${receiver}`);
    }

    function createDerangement(items, maxAttempts = 1000) {
      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        const givers = shuffle(items);
        const receivers = shuffle(items);

        if (givers.every((giver, idx) => isValidPair(giver, receivers[idx]))) {
          return givers.map((giver, idx) => ({
            giver,
            receiver: receivers[idx]
          }));
        }
      }
      throw new Error('Could not build pairings within the rules.');
    }

    function renderPairingCards(pairings) {
      pairingsGrid.innerHTML = '';
      const ordered = [...pairings].sort((a, b) => {
        return (displayOrder[a.giver] ?? 0) - (displayOrder[b.giver] ?? 0);
      });
      ordered.forEach(({ giver, receiver }) => {
        const card = document.createElement('article');
        card.className = 'pair-card';

        const giverSpan = document.createElement('span');
        giverSpan.className = 'giver';
        giverSpan.textContent = `From ${giver}`;

        const arrowSpan = document.createElement('span');
        arrowSpan.className = 'arrow';
        arrowSpan.textContent = '→';

        const receiverSpan = document.createElement('span');
        receiverSpan.className = 'receiver';

        const revealButton = document.createElement('button');
        revealButton.className = 'reveal-button';
        revealButton.type = 'button';

        const syncRevealState = () => {
          const isRevealed = revealedGivers.has(giver);
          receiverSpan.textContent = isRevealed ? receiver : 'Tap to reveal';
          receiverSpan.dataset.hidden = isRevealed ? 'false' : 'true';
          revealButton.textContent = isRevealed ? 'Hide' : 'Reveal';
          revealButton.setAttribute('aria-pressed', String(isRevealed));
        };

        const toggleReveal = () => {
          const isRevealed = revealedGivers.has(giver);
          if (isRevealed) {
            revealedGivers.delete(giver);
          } else {
            revealedGivers.add(giver);
          }
          writeRevealStates(revealedGivers);
          syncRevealState();
        };

        revealButton.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleReveal();
        });

        card.addEventListener('click', (event) => {
          if (event.target === revealButton) return;
          toggleReveal();
        });

        syncRevealState();

        card.append(giverSpan, arrowSpan, receiverSpan, revealButton);
        pairingsGrid.appendChild(card);
      });
    }

    function formatTimestamp(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return '';
      }
      return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function updatePairingsStatus(message, state = 'idle') {
      if (!pairingsStatus) return;
      pairingsStatus.textContent = message;
      pairingsStatus.dataset.state = state;
    }

    function applyPairings(pairings, source = 'local', metadata = {}) {
      const pairingsChanged = !pairingsAreEqual(latestPairings, pairings);
      latestPairings = pairings;
      if (pairingsChanged) {
        resetRevealStates();
      }
      renderPairingCards(pairings);
      writePairingsBackup(pairings);

      if (source === 'cloud') {
        const formatted = metadata.updatedAt ? formatTimestamp(metadata.updatedAt) : '';
        updatePairingsStatus(formatted ? `Synced · updated ${formatted}` : 'Synced from cloud', 'connected');
      } else if (source === 'local-offline') {
        updatePairingsStatus('Using pairings saved on this device', 'offline');
      } else if (source === 'local-new') {
        updatePairingsStatus('Saving new pairings…', 'saving');
      }
    }

    function pairingsListToMap(pairings) {
      return pairings.reduce((acc, { giver, receiver }) => {
        acc[giver] = receiver;
        return acc;
      }, {});
    }

    function pairingsMapToList(map = {}) {
      return Object.entries(map)
        .map(([giver, receiver]) => ({ giver, receiver }))
        .sort((a, b) => (displayOrder[a.giver] ?? 0) - (displayOrder[b.giver] ?? 0));
    }

    function pairingsAreEqual(a = [], b = []) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) {
        return false;
      }
      for (let i = 0; i < a.length; i += 1) {
        if (a[i].giver !== b[i].giver || a[i].receiver !== b[i].receiver) {
          return false;
        }
      }
      return true;
    }

    async function savePairingsToCloud(pairings) {
      if (!pairingsDocRef) return null;
      const updatedAt = new Date().toISOString();
      await setDoc(pairingsDocRef, { pairs: pairingsListToMap(pairings), updatedAt }, { merge: true });
      return updatedAt;
    }

    async function loadPairingsFromCloud() {
      if (!pairingsDocRef) return;
      try {
        const snapshot = await getDoc(pairingsDocRef);
        if (snapshot.exists()) {
          const data = snapshot.data();
          const pairings = pairingsMapToList(data.pairs || {});
          if (pairings.length) {
            applyPairings(pairings, 'cloud', { updatedAt: data.updatedAt });
            return;
          }
        }
        const freshPairings = createDerangement(people);
        const updatedAt = await savePairingsToCloud(freshPairings);
        applyPairings(freshPairings, 'cloud', { updatedAt });
      } catch (error) {
        console.error('Unable to load pairings', error);
        updatePairingsStatus('Could not load saved pairings · showing local copy', 'error');
      }
    }

    async function handleShuffleRequest() {
      if (!ensureAdminAccess()) {
        return;
      }

      if (firestoreUnavailable || !pairingsDocRef) {
        alert('Need a Firebase connection before shuffling so everyone sees the same matches.');
        return;
      }

      let nextPairings;
      try {
        nextPairings = createDerangement(people);
      } catch (error) {
        alert('Could not build a valid set of pairings. Try again.');
        return;
      }

      applyPairings(nextPairings, 'local-new');
      try {
        const updatedAt = await savePairingsToCloud(nextPairings);
        applyPairings(nextPairings, 'cloud', { updatedAt });
      } catch (error) {
        console.error('Unable to save new pairings', error);
        updatePairingsStatus('Could not save new pairings · showing local copy', 'error');
      }
    }

    function requestAdminAccess() {
      const attempt = window.prompt('Enter the family password to unlock pairings:');
      if (!attempt) {
        return false;
      }
      if (attempt.trim().toLowerCase() === adminPassword) {
        hasAdminAccess = true;
        sessionStorage.setItem(adminStorageKey, 'true');
        return true;
      }
      alert('That password did not match. Ask Steve for the latest password if you forgot it.');
      return false;
    }

    function ensureAdminAccess() {
      return hasAdminAccess || requestAdminAccess();
    }

    function renderSuggestions(initialValues = {}) {
      suggestionsGrid.innerHTML = '';
      people.forEach((name) => {
        const card = document.createElement('article');
        card.className = 'suggestion-card';

        const title = document.createElement('h3');
        title.textContent = name;

        const textarea = document.createElement('textarea');
        textarea.placeholder = 'Gift ideas, sizes, links…';
        textarea.value = initialValues[name] || '';
        textarea.dataset.person = name;

        const indicator = document.createElement('span');
        indicator.className = 'save-indicator';
        const hasValue = Boolean(textarea.value);
        indicator.textContent = hasValue ? 'Saved locally' : 'Nothing saved yet';
        indicator.dataset.state = hasValue ? 'saved-offline' : 'idle';

        textarea.addEventListener('input', () => handleInput(name, textarea.value));

        card.appendChild(title);
        card.appendChild(textarea);
        card.appendChild(indicator);
        suggestionsGrid.appendChild(card);

        textareas.set(name, textarea);
        indicators.set(name, indicator);
      });
    }

    function handleInput(name, value) {
      suggestionValues[name] = value;
      writeWishlistBackup(suggestionValues);
      updateIndicator(name, value ? 'saving' : 'idle', value ? 'Saving…' : 'Nothing saved yet');

      if (firestoreUnavailable || !wishlistDocRef) {
        updateIndicator(name, value ? 'saved-offline' : 'idle', value ? 'Saved locally' : 'Nothing saved yet');
        return;
      }

      queueRemoteSave(name, value);
    }

    function updateIndicator(name, state, message) {
      const indicator = indicators.get(name);
      if (!indicator) return;
      indicator.dataset.state = state;
      indicator.textContent = message;
    }

    function queueRemoteSave(name, value) {
      if (pendingSaves.has(name)) {
        clearTimeout(pendingSaves.get(name));
      }

      const timeout = setTimeout(async () => {
        try {
          await setDoc(wishlistDocRef, { [name]: value }, { merge: true });
          updateIndicator(name, value ? 'saved-online' : 'idle', value ? 'Saved to cloud' : 'Nothing saved yet');
        } catch (error) {
          console.error('Unable to save suggestion', error);
          updateIndicator(name, 'error', 'Could not save (will stay local)');
          firestoreUnavailable = true;
          updateSyncStatus('Disconnected · edits stay on this device until connection returns', 'error');
        } finally {
          pendingSaves.delete(name);
        }
      }, 600);

      pendingSaves.set(name, timeout);
    }

    function applyRemoteValues(data) {
      suggestionValues = { ...suggestionValues, ...data };
      writeWishlistBackup(suggestionValues);

      Object.entries(suggestionValues).forEach(([name, value]) => {
        const textarea = textareas.get(name);
        if (!textarea) return;

        if (document.activeElement !== textarea) {
          textarea.value = value || '';
        }

        if (value) {
          updateIndicator(name, wishlistDocRef ? 'saved-online' : 'saved-offline', wishlistDocRef ? 'Saved to cloud' : 'Saved locally');
        } else {
          updateIndicator(name, 'idle', 'Nothing saved yet');
        }
      });
    }

    function updateSyncStatus(message, state = 'idle') {
      if (!syncStatus) return;
      syncStatus.textContent = message;
      syncStatus.dataset.state = state;
    }

    async function loadWishlistsFromCloud() {
      if (!wishlistDocRef) return;
      try {
        const snapshot = await getDoc(wishlistDocRef);
        if (snapshot.exists()) {
          applyRemoteValues(snapshot.data());
        } else {
          await setDoc(wishlistDocRef, suggestionValues, { merge: true });
        }
      } catch (error) {
        console.error('Unable to load remote suggestions', error);
        updateSyncStatus('Could not load saved ideas · retrying later', 'error');
      }
    }

    async function bootstrapFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        wishlistDocRef = doc(db, 'secretSanta', 'wishlists');
        pairingsDocRef = doc(db, 'secretSanta', 'pairings');
        updateSyncStatus('Connected', 'connected');
        updatePairingsStatus('Connected · loading saved pairings…', 'syncing');
      } catch (error) {
        console.error('Firebase initialization failed', error);
        firestoreUnavailable = true;
        updateSyncStatus('Offline mode · ideas stay on this device', 'offline');
        updatePairingsStatus('Offline mode · showing local pairings', 'offline');
        if (!latestPairings.length) {
          try {
            const fallback = createDerangement(people);
            applyPairings(fallback, 'local-offline');
          } catch (err) {
            pairingsGrid.innerHTML = '<p>Unable to build pairings while offline.</p>';
          }
        }
        return;
      }

      await Promise.all([loadPairingsFromCloud(), loadWishlistsFromCloud()]);
    }

    function bindMenu() {
      function closeMenu() {
        menuDropdown.dataset.open = 'false';
        menuDropdown.setAttribute('aria-hidden', 'true');
        menuButton.setAttribute('aria-expanded', 'false');
      }

      function openMenu() {
        if (!ensureAdminAccess()) {
          return;
        }
        menuDropdown.dataset.open = 'true';
        menuDropdown.setAttribute('aria-hidden', 'false');
        menuButton.setAttribute('aria-expanded', 'true');
      }

      function toggleMenu() {
        const isOpen = menuDropdown.dataset.open === 'true';
        if (isOpen) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      menuButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleMenu();
      });

      document.addEventListener('click', (event) => {
        if (!menuDropdown.contains(event.target) && event.target !== menuButton) {
          closeMenu();
        }
      });

      shuffleMenuItem.addEventListener('click', () => {
        closeMenu();
        handleShuffleRequest();
      });
    }

    function init() {
      if (latestPairings.length) {
        applyPairings(latestPairings, 'local-offline');
      } else {
        pairingsGrid.innerHTML = '<p>Loading pairings…</p>';
      }
      renderSuggestions(suggestionValues);
      bindMenu();
      bootstrapFirebase();
    }

    init();
  </script>
</body>
</html>
