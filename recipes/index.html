    const normalizeRecipe = (raw = {}) => {
      const derivedName =
        raw.name ||
        raw.title ||
        raw.recipeName ||
        raw.displayName ||
        raw.label ||
        '';
      const baseName = derivedName || `Untitled Recipe ${recipes.length + 1}`;
      const slugBase = slugify(baseName);
      const uniqueId = raw.id || `${slugBase}-${Date.now()}`;
      const makeComponentId = (component, index) =>
        component.id || `${uniqueId}-component-${index + 1}`;

      const rawComponents = resolveComponentSource(raw);
      const normalizedComponents = rawComponents.map((component, index) => {
        const componentName =
          component?.name || component?.title || component?.label || `Component ${index + 1}`;
        const ingredientSource =
          component?.ingredients ||
          component?.ingredientSections ||
          component?.ingredient_sections ||
          component?.ingredientGroups ||
          component?.sections;
        const normalizedIngredients = normalizeIngredientSections(ingredientSource, 'Ingredients');
        const rawSteps =
          component?.steps ||
          component?.instructions ||
          component?.directions ||
          component?.method ||
          component?.stepsList;
        const normalizedSteps = normalizeStepEntries(rawSteps, componentName, index);

        const hasContent =
          normalizedIngredients.some((section) => section.items.length) || normalizedSteps.length;

        if (!hasContent) {
          return null;
        }

        return {
          ...component,
          name: componentName,
          id: makeComponentId(component || {}, index),
          ingredients: normalizedIngredients,
          steps: normalizedSteps.length
            ? normalizedSteps
            : [
                {
                  order: 1,
                  title: componentName || `Step ${index + 1}`,
                  instructions: ['Add instructions for this component.']
                }
              ]
        };
      }).filter(Boolean);

      const workflowFromComponents = normalizedComponents
        .map((component, index) => {
          if (!component.steps?.length) return null;
          return {
            order: index + 1,
            label: component.name || `Component ${index + 1}`,
            items: component.steps.map((step) => ({
              component: component.id,
              step: step.order
            }))
          };
        })
        .filter(Boolean);

      const workflowFromRaw = Array.isArray(raw.workflow)
        ? raw.workflow
            .map((entry, index) => {
              if (!entry) return null;
              const candidateItemsSets = [
                normalizeWorkflowItems(entry.items),
                normalizeWorkflowItems(entry.tasks),
                normalizeWorkflowItems(entry.steps),
                normalizeWorkflowItems(entry.actions)
              ];
              const phaseItems = candidateItemsSets.find((items) => items.length) || [];
              return {
                order: entry.order ?? entry.step ?? index + 1,
                label: entry.label || entry.phase || entry.name || `Phase ${index + 1}`,
                items: phaseItems,
                description: entry.description || '',
                notes: entry.notes || entry.note || ''
              };
            })
            .filter(Boolean)
        : [];

      const normalizedWorkflow =
        workflowFromRaw.length ? workflowFromRaw : workflowFromComponents;

      const componentsWithDerivedSteps = normalizedComponents.map((component) => {
        if (component.steps?.length) {
          return component;
        }
        const derivedSteps = deriveStepsFromWorkflow(component, workflowFromRaw);
        if (derivedSteps.length) {
          return {
            ...component,
            steps: derivedSteps
          };
        }
        return component;
      });

      return {
        id: uniqueId,
        name: baseName,
        version: raw.version ?? 1,
        servings:
          typeof raw.servings === 'number'
            ? { count: raw.servings, note: raw.servingsNote || '' }
            : typeof raw.servings === 'string'
              ? { count: raw.servings, note: '' }
              : raw.servings || { count: raw.yield || '—', note: raw.servingsNote || '' },
        metadata: {
          style: raw.metadata?.style || raw.style || '',
          diet: {
            vegetarian: Boolean(raw.metadata?.diet?.vegetarian ?? raw.diet?.vegetarian),
            vegan: Boolean(raw.metadata?.diet?.vegan ?? raw.diet?.vegan),
            gluten_free: Boolean(raw.metadata?.diet?.gluten_free ?? raw.diet?.gluten_free),
            contains_dairy: Boolean(
              raw.metadata?.diet?.contains_dairy ?? raw.diet?.contains_dairy
            ),
            contains_lentils: Boolean(
              raw.metadata?.diet?.contains_lentils ?? raw.diet?.contains_lentils
            )
          },
          context: raw.metadata?.context || raw.context || ''
        },
        components: componentsWithDerivedSteps,
        workflow: normalizedWorkflow,
        substitution_summary:
          raw.substitution_summary ||
          raw.substitutionSummary ||
          raw.substitutions ||
          {}
      };
    };

    function parseFraction(value) {
      if (!value) return null;
      if (value.includes('/')) {
        const [numerator, denominator] = value.split('/').map((part) => parseFloat(part));
        if (Number.isFinite(numerator) && Number.isFinite(denominator) && denominator !== 0) {
          return numerator / denominator;
        }
      }
      const numeric = parseFloat(value);
      return Number.isFinite(numeric) ? numeric : null;
    }

    function parseIngredientLine(line) {
      const cleaned = line.replace(/^[-•\s]+/, '').trim();
      if (!cleaned) return null;
      const [main, ...noteParts] = cleaned.split(' - ');
      const notes = noteParts.join(' - ').trim();
      const parts = main.split(/\s+/);
      let amount = null;
      let unit = null;

      if (parts.length && /^(\d+\/\d+|\d+\.\d+|\d+)$/.test(parts[0])) {
        amount = parseFraction(parts.shift());
      }

      if (parts.length && amount !== null && /^[^\d]+$/.test(parts[0])) {
        unit = parts.shift();
      }

      const remaining = parts.join(' ').trim();
      if (!remaining) {
        return null;
      }

      let name = remaining;
      let prep = '';
      if (remaining.includes(';')) {
        const [primary, ...prepParts] = remaining.split(';');
        name = primary.trim();
        prep = prepParts.join(';').trim();
      }

      const optional = /optional/i.test(notes) || /optional/i.test(remaining);

      return {
        name,
        amount,
        unit: unit || null,
        prep,
        notes,
        optional
      };
    }

    const buildIngredientsFromText = (input = '') => {
      const items = input
        .split('\n')
        .map((line) => line.trim())
        .map(parseIngredientLine)
        .filter(Boolean);

      return items.length
        ? [
            {
              section: 'Ingredients',
              items
            }
          ]
        : [];
    };

    const buildStepsFromText = (input = '') => {
      const blocks = input
        .split(/\n{2,}/)
        .map((block) => block.trim())
        .filter(Boolean);

      return blocks.map((block, index) => {
        const lines = block
          .split('\n')
          .map((line) => line.replace(/^[-•\s]+/, '').trim())
          .filter(Boolean);
        if (!lines.length) {
          return null;
        }
        let title = `Step ${index + 1}`;
        let firstLine = lines[0];
        if (firstLine.includes(':')) {
          const [maybeTitle, ...rest] = firstLine.split(':');
          const candidateTitle = maybeTitle.trim();
          const remainder = rest.join(':').trim();
          if (candidateTitle) {
            title = candidateTitle;
          }
          if (remainder) {
            lines[0] = remainder;
          } else {
            lines.shift();
          }
        } else {
          title = firstLine;
          lines.shift();
        }
        if (!lines.length) {
          lines.push(title);
        }
        return {
          order: index + 1,
          title,
          instructions: lines
        };
      }).filter(Boolean);
    };

    const buildSubstitutionSummary = (input = '') => {
      return input
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .reduce((summary, line, index) => {
          const [label, ...details] = line.split(':');
          const key = label ? slugify(label).replace(/-/g, '_') : `note_${index + 1}`;
          summary[key || `note_${index + 1}`] = details.join(':').trim() || label.trim();
          return summary;
        }, {});
    };

    const buildWorkflowFromComponents = (components = []) =>
      components.map((component, index) => ({
        order: index + 1,
        label: component.name || `Phase ${index + 1}`,
        items: (component.steps || []).map((step) => ({
          component: component.id,
          step: step.order
        }))
      })).filter((phase) => phase.items?.length);

    const buildWorkflowFromLabels = (labels = [], components = []) => {
      const byName = new Map();
      components.forEach((component) => {
        if (component.name) {
          byName.set(component.name.toLowerCase(), component);
        }
      });
      const phases = labels.map((entry, index) => {
        const component = entry.componentName
          ? byName.get(entry.componentName.toLowerCase())
          : null;
        const items = component
          ? (component.steps || []).map((step) => ({
              component: component.id,
              step: step.order
            }))
          : [];
        return {
          order: index + 1,
          label: entry.label || `Phase ${index + 1}`,
          items
        };
      }).filter((phase) => phase.items.length);
      return phases.length ? phases : buildWorkflowFromComponents(components);
    };

    const buildRecipeFromSmartText = (blob, defaults) => {
      const recipe = {
        name: '',
        metadata: {
          style: defaults.style,
          diet: { ...defaults.diet },
          context: defaults.context
        },
        servings: {
          count: defaults.servingsCount || '—',
          note: defaults.servingsNote
        },
        components: [],
        workflow: [],
        substitution_summary: {}
      };

      const workflowDraft = [];
      const lines = blob.split(/\r?\n/);

      const createComponent = (name, kind = '') => {
        const safeName = name || `Component ${recipe.components.length + 1}`;
        const componentId = `${slugify(safeName) || 'component'}-${Date.now().toString(36)}-${recipe.components.length + 1}`;
        const component = {
          id: componentId,
          name: safeName,
          kind,
          ingredients: [{ section: 'Ingredients', items: [] }],
          steps: []
        };
        recipe.components.push(component);
        return component;
      };

      let currentComponent = createComponent(defaults.componentName || 'Main Dish');
      let currentIngredientSection = currentComponent.ingredients[0];
      let mode = 'ingredients';

      const startIngredientSection = (label = 'Ingredients') => {
        const section = { section: label, items: [] };
        currentComponent.ingredients.push(section);
        currentIngredientSection = section;
      };

      const pushIngredientLine = (line) => {
        const parsed = parseIngredientLine(line);
        const targetSection = currentIngredientSection || currentComponent.ingredients[0] || { section: 'Ingredients', items: [] };
        if (!currentComponent.ingredients.includes(targetSection)) {
          currentComponent.ingredients.push(targetSection);
        }
        if (parsed) {
          targetSection.items.push(parsed);
        } else {
          targetSection.items.push({
            name: line.replace(/^[-•\s]+/, '').trim(),
            amount: null,
            unit: null,
            prep: '',
            notes: ''
          });
        }
      };

      const pushStepLine = (line) => {
        const normalized = line.replace(/^\d+[\).\s-]*/, '').trim();
        const colonIndex = normalized.indexOf(':');
        const looksLikeNewStep =
          /^\d+/.test(line) ||
          /^step\s+\d+/i.test(line) ||
          (colonIndex > 0 && colonIndex < normalized.length - 1);
        if (!currentComponent.steps.length || looksLikeNewStep) {
          let title = `Step ${String(currentComponent.steps.length + 1).padStart(2, '0')}`;
          let body = normalized;
          if (colonIndex > 0) {
            title = normalized.slice(0, colonIndex).trim() || title;
            body = normalized.slice(colonIndex + 1).trim();
          }
          currentComponent.steps.push({
            order: currentComponent.steps.length + 1,
            title,
            instructions: body ? [body] : []
          });
        } else {
          currentComponent.steps[currentComponent.steps.length - 1].instructions.push(line.trim());
        }
      };

      const pushSubstitutionLine = (line) => {
        const [label, ...details] = line.split(':');
        const key = label ? slugify(label).replace(/-/g, '_') : `note_${Object.keys(recipe.substitution_summary).length + 1}`;
        recipe.substitution_summary[key || `note_${Object.keys(recipe.substitution_summary).length + 1}`] =
          details.join(':').trim() || label.trim();
      };

      const pushWorkflowLine = (line) => {
        const cleaned = line.replace(/^\d+[\).\s-]*/, '').trim();
        if (!cleaned) return;
        const [labelPart, componentPart] = cleaned.split(' - ');
        workflowDraft.push({
          label: (labelPart || '').trim(),
          componentName: (componentPart || '').trim()
        });
      };

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) {
          return;
        }

        if (/^title\s*:/i.test(line)) {
          recipe.name = line.split(':').slice(1).join(':').trim();
          return;
        }
        if (/^style\s*:/i.test(line)) {
          recipe.metadata.style = line.split(':').slice(1).join(':').trim();
          return;
        }
        if (/^context\s*:/i.test(line)) {
          recipe.metadata.context = line.split(':').slice(1).join(':').trim();
          return;
        }
        if (/^diet\s*:/i.test(line)) {
          const tokens = line.split(':').slice(1).join(':').split(/[,/]/);
          tokens.forEach((token) => {
            const normalized = token.trim().toLowerCase();
            if (!normalized) return;
            if (normalized.includes('vegan')) recipe.metadata.diet.vegan = true;
            if (normalized.includes('vegetarian')) recipe.metadata.diet.vegetarian = true;
            if (normalized.includes('gluten')) recipe.metadata.diet.gluten_free = true;
            if (normalized.includes('dairy')) recipe.metadata.diet.contains_dairy = true;
            if (normalized.includes('lentil')) recipe.metadata.diet.contains_lentils = true;
          });
          return;
        }
        if (/^serv(es|ings)\s*:/i.test(line)) {
          const value = line.split(':').slice(1).join(':').trim();
          const countMatch = value.match(/(\d+([./]\d+)?)/);
          if (countMatch) {
            recipe.servings.count = countMatch[1];
          }
          const note = value.replace(countMatch?.[0] || '', '').replace(/[()]/g, '').trim();
          if (note) {
            recipe.servings.note = note;
          }
          return;
        }
        const componentMatch = line.match(/^(?:component|##)\s*:?\s*(.+)$/i);
        if (componentMatch) {
          const descriptor = componentMatch[1].trim();
          const kindMatch = descriptor.match(/\(kind:\s*([^)]+)\)/i);
          const componentName = kindMatch ? descriptor.replace(kindMatch[0], '').trim() : descriptor;
          currentComponent = createComponent(componentName || `Component ${recipe.components.length + 1}`, kindMatch ? kindMatch[1].trim() : '');
          currentIngredientSection = currentComponent.ingredients[0];
          mode = 'ingredients';
          return;
        }
        if (/^kind\s*:/i.test(line) && currentComponent) {
          currentComponent.kind = line.split(':').slice(1).join(':').trim();
          return;
        }
        const ingredientsMatch = line.match(/^ingredients?(?:\s*[-:]\s*(.+))?/i);
        if (ingredientsMatch) {
          const label = (ingredientsMatch[1] || 'Ingredients').trim();
          if (!currentComponent.ingredients.length) {
            currentComponent.ingredients.push({ section: label, items: [] });
          } else {
            startIngredientSection(label);
          }
          currentIngredientSection = currentComponent.ingredients[currentComponent.ingredients.length - 1];
          mode = 'ingredients';
          return;
        }
        const sectionMatch = line.match(/^\[(.+)\]$/);
        if (sectionMatch) {
          startIngredientSection(sectionMatch[1].trim());
          mode = 'ingredients';
          return;
        }
        if (/^steps?|^directions?/i.test(line)) {
          mode = 'steps';
          return;
        }
        if (/^workflow/i.test(line)) {
          mode = 'workflow';
          return;
        }
        if (/^(substitutions?|substitution summary|summary)/i.test(line)) {
          mode = 'substitutions';
          return;
        }

        if (mode === 'workflow') {
          pushWorkflowLine(line);
          return;
        }
        if (mode === 'substitutions') {
          pushSubstitutionLine(line);
          return;
        }
        if (mode === 'steps') {
          pushStepLine(line);
          return;
        }
        pushIngredientLine(line);
      });

      if (!recipe.name) {
        recipe.name = defaults.name;
      }
      if (!recipe.name) {
        throw new Error('Include a Title line or fill the recipe title field.');
      }

      recipe.components = recipe.components.filter((component) => {
        const hasIngredients = (component.ingredients || []).some((section) => section.items.length);
        const hasSteps = (component.steps || []).length;
        return hasIngredients || hasSteps;
      }).map((component) => ({
        ...component,
        steps: component.steps.length
          ? component.steps
          : [
              {
                order: 1,
                title: component.name || 'Step 1',
                instructions: ['Add instructions for this component.']
              }
            ]
      }));

      if (!recipe.components.length) {
        throw new Error('Add at least one line of ingredients or steps so we can build the recipe.');
      }

      recipe.workflow = workflowDraft.length
        ? buildWorkflowFromLabels(workflowDraft, recipe.components)
        : buildWorkflowFromComponents(recipe.components);

      if (!Object.keys(recipe.substitution_summary).length && defaults.substitutionsText.trim()) {
        recipe.substitution_summary = buildSubstitutionSummary(defaults.substitutionsText);
      }

      return recipe;
    };
    const parseRecipeJsonInput = (jsonText = '') => {
      let parsed;
      try {
        parsed = JSON.parse(jsonText);
      } catch (error) {
        throw new Error(`That JSON doesn't look right: ${error.message}`);
      }

      const pickRecipeObject = (value) =>
        Array.isArray(value) ? value.find((entry) => entry && typeof entry === 'object') : null;

      if (Array.isArray(parsed)) {
        const candidate = pickRecipeObject(parsed);
        if (candidate) {
          return candidate;
        }
        throw new Error('JSON array must contain at least one recipe object.');
      }

      if (parsed && typeof parsed === 'object') {
        if (parsed.recipe && typeof parsed.recipe === 'object') {
          return parsed.recipe;
        }
        if (Array.isArray(parsed.recipes)) {
          const candidate = pickRecipeObject(parsed.recipes);
          if (candidate) {
            return candidate;
          }
          throw new Error('`recipes` must contain at least one recipe object.');
        }
        return parsed;
      }

      throw new Error('JSON recipe must describe an object.');
    };

    const parseRecipeInput = (rawInput = '') => {
      const payload = rawInput.trim();
      if (!payload) {
        throw new Error('Paste a recipe first.');
      }
      if (payload.startsWith('{') || payload.startsWith('[')) {
        return parseRecipeJsonInput(payload);
      }
      const defaults = {
        name: '',
        style: '',
        context: '',
        servingsCount: '',
        servingsNote: '',
        componentName: 'Main Dish',
        componentKind: '',
        ingredientsText: '',
        stepsText: '',
        substitutionsText: '',
        diet: {
          vegetarian: false,
          vegan: false,
          gluten_free: false,
          contains_dairy: false,
          contains_lentils: false
        }
      };
      return buildRecipeFromSmartText(payload, defaults);
    };

    const addRecipeToLibrary = (recipeInput) => {
      const newRecipe = normalizeRecipe(recipeInput);
      const existingIndex = recipes.findIndex((entry) => entry.id === newRecipe.id);
      if (existingIndex >= 0) {
        recipes.splice(existingIndex, 1, newRecipe);
      } else {
        recipes.unshift(newRecipe);
      }
      refreshRecipeViews({ highlightId: newRecipe.id });
      selectRecipe(newRecipe.id, { scrollToCard: true, closeDrawer: true });
      return newRecipe;
    };

    const setMobileDrawerState = (isOpen) => {
      if (!mobileDrawerEl) return;
      isMobileDrawerOpen = isOpen;
      mobileDrawerEl.dataset.open = String(isOpen);
      mobileDrawerEl.setAttribute('aria-hidden', String(!isOpen));
      mobileToggleButton?.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    };

    const selectRecipe = (recipeId, { scrollToCard = true, closeDrawer = false } = {}) => {
      const recipe = recipes.find((entry) => entry.id === recipeId);
      if (!recipe) return;
      activeRecipe = recipe;
      activeTab = 'ingredients';
      activeComponentId = null;
      renderRecipeList();
      renderRecipeDetails();
      if (scrollToCard) {
        const targetCard = recipeListEl?.querySelector(`[data-recipe-id="${recipeId}"]`);
        targetCard?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      if (closeDrawer) {
        setMobileDrawerState(false);
      }
    };

    const renderRecipeList = () => {
      const markup = filteredRecipes.length
        ? filteredRecipes.map((recipe) => {
            const chips = [];
            if (recipe.metadata?.diet?.vegan) chips.push('Vegan');
            if (recipe.metadata?.diet?.gluten_free) chips.push('Gluten-free');
            if (!recipe.metadata?.diet?.contains_dairy) chips.push('Dairy-free');
            return `
          <article class="recipe-card ${recipe.id === activeRecipe?.id ? 'active' : ''}" data-recipe-id="${recipe.id}">
            <h3>${recipe.name}</h3>
            <p>${recipe.metadata?.context || ''}</p>
            <div class="chip-row">
              ${chips.map((chip) => `<span class="chip">${chip}</span>`).join('')}
            </div>
          </article>
        `;
          }).join('')
        : '<div class="empty-state">No recipes match that search yet.</div>';

      if (recipeListEl) {
        recipeListEl.innerHTML = markup;
      }
      if (mobileDrawerListEl) {
        mobileDrawerListEl.innerHTML = markup;
      }
    };

    const renderIngredients = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No components added yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          ${(component.ingredients || []).map((section) => `
            <div class="ingredient-section">
              <h4>${section.section}</h4>
              <ul class="ingredient-list">
                ${(section.items || []).map((item, itemIndex) => {
                  const hasSubs = item.substitutions && item.substitutions.length;
                  const substitutionsList = hasSubs ? `
                    <button class="sub-toggle" type="button" aria-expanded="false" data-sub-toggle>
                      Substitutions
                      <span class="chevron">⌄</span>
                    </button>
                    <div class="ingredient-substitutions" data-sub-panel hidden>
                      <ul>
                        ${item.substitutions.map((sub) => `
                          <li><strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}</li>
                        `).join('')}
                      </ul>
                    </div>
                  ` : '';

                  return `
                    <li class="ingredient-item ${hasSubs ? 'has-subs' : ''}" data-ingredient-index="${component.id}-${section.section}-${itemIndex}">
                      <div class="ingredient-main">
                        <strong>${item.name}${item.optional ? ' (optional)' : ''}</strong>
                        <div class="ingredient-meta">
                          ${formatAmount(item)}${item.prep ? ` · ${item.prep}` : ''}
                          ${item.notes ? `<br>${item.notes}` : ''}
                        </div>
                      </div>
                      ${substitutionsList}
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </section>
      `;
      }).join('');
    };

    const renderSteps = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No steps documented yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          <div class="steps">
            ${(component.steps || []).map((step) => `
              <article class="step-card">
                <h3>${step.order.toString().padStart(2, '0')} · ${step.title}</h3>
                <ol>
                  ${step.instructions.map((line) => `<li>${line}</li>`).join('')}
                </ol>
              </article>
            `).join('')}
          </div>
        </section>
      `;
      }).join('');
    };

    const buildSubstitutionResults = (recipe, filter = '') => {
      const normalized = filter.trim().toLowerCase();
      const items = (recipe.components || []).flatMap((component) =>
        (component.ingredients || []).flatMap((section) =>
          (section.items || []).map((item) => ({
            componentName: component.name,
            componentId: component.id,
            name: item.name,
            substitutions: item.substitutions || []
          }))
        )
      ).filter((item) => item.substitutions.length);

      const scopedItems = activeComponentId
        ? items.filter((item) => item.componentId === activeComponentId)
        : items;

      const filteredItems = normalized
        ? scopedItems.filter((item) => {
            const haystack = `${item.name} ${item.substitutions.map((s) => `${s.name} ${s.notes || ''}`).join(' ')}`.toLowerCase();
            return haystack.includes(normalized);
          })
        : scopedItems;

      if (!filteredItems.length) {
        return '<div class="empty-state">No substitutions match that search.</div>';
      }

      return filteredItems.map((item) => `
        <article class="substitution-card">
          <h4>${item.name}${item.componentName ? ` · <span class="ingredient-meta">${item.componentName}</span>` : ''}</h4>
          <ul>
            ${item.substitutions.map((sub) => `
              <li>
                <strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}
              </li>
            `).join('')}
          </ul>
        </article>
      `).join('');
    };
    const renderSubstitutions = (recipe) => {
      const summaryEntries = Object.entries(recipe.substitution_summary || {});
      return `
        <div class="substitution-search">
          <label for="substitutionSearch">Look up ingredient swaps</label>
          <input type="search" id="substitutionSearch" placeholder="Try &ldquo;squash&rdquo;, &ldquo;coconut milk&rdquo;, ...">
        </div>
        <div id="substitutionResults" class="substitution-results">
          ${buildSubstitutionResults(recipe)}
        </div>
        ${summaryEntries.length ? `
          <div class="summary-grid">
            ${summaryEntries.map(([key, value]) => `
              <div>
                <span class="chip">${key.replace(/_/g, ' ')}</span>
                <p class="ingredient-meta">${value}</p>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    };

    const renderWorkflow = (recipe) => {
      if (!Array.isArray(recipe.workflow) || !recipe.workflow.length) {
        return '<div class="empty-state">No workflow defined for this recipe.</div>';
      }

      const stepLookup = new Map();
      (recipe.components || []).forEach((component = {}) => {
        const safeSteps = Array.isArray(component.steps) ? component.steps.filter(Boolean) : [];
        safeSteps.forEach((step, index) => {
          const stepOrder = Number.isFinite(step?.order) ? step.order : index + 1;
          const key = `${component.id}-${stepOrder}`;
          stepLookup.set(key, {
            component,
            step: {
              ...step,
              order: stepOrder,
              title: step?.title || `Step ${stepOrder}`
            }
          });
        });
      });

      const workflowMarkup = recipe.workflow
        .map((phase, phaseIndex) => {
          if (!phase) return '';
          const phaseOrder = Number.isFinite(phase.order) ? phase.order : phaseIndex + 1;
          const phaseItems = Array.isArray(phase.items) ? phase.items.filter(Boolean) : [];
          return `
            <li class="workflow-phase">
              <div class="phase-badge">${phaseOrder.toString().padStart(2, '0')}</div>
              <div>
                <h3>${phase.label || `Phase ${phaseOrder}`}</h3>
                ${
                  phaseItems.length
                    ? `
                        <ul>
                          ${phaseItems
                            .map((item, taskIndex) => {
                              const lookupKey = `${item.component}-${item.step}`;
                              const reference = stepLookup.get(lookupKey);
                              const componentName =
                                reference?.component?.name ||
                                item.component ||
                                '';
                              let detail = '';
                              if (reference?.step) {
                                detail = ` · Step ${reference.step.order
                                  .toString()
                                  .padStart(2, '0')}: ${reference.step.title}`;
                              } else if (item.step) {
                                detail = ` · Step ${item.step}`;
                              }
                              const descriptionText = item.description ? item.description.trim() : '';
                              if (componentName) {
                                return `<li><strong>${componentName}</strong>${
                                  detail || (descriptionText ? ` · ${descriptionText}` : '')
                                }</li>`;
                              }
                              const fallbackLabel =
                                descriptionText ||
                                (detail ? detail.replace(/^ · /, '') : '') ||
                                `Task ${taskIndex + 1}`;
                              return `<li>${fallbackLabel}</li>`;
                            })
                            .join('')}
                        </ul>
                      `
                    : '<p class="empty-state">Add items to this workflow phase.</p>'
                }
              </div>
            </li>
          `;
        })
        .filter(Boolean)
        .join('');

      return `
        <ol class="workflow-list">
          ${workflowMarkup || '<li class="workflow-phase"><div class="empty-state">No workflow steps documented yet.</div></li>'}
        </ol>
      `;
    };

    const contentGridEl = document.querySelector('.content-grid');

    const updateRecipeActionState = () => {
      if (activeRecipe) {
        contentGridEl?.classList.add('has-active');
      } else {
        contentGridEl?.classList.remove('has-active');
      }
    };

    const renderRecipeDetails = () => {
      if (!activeRecipe) {
        recipeDetailsEl.dataset.componentFiltering = 'false';
        pendingScrollComponentId = null;
        updateRecipeActionState();
        const chips = (recipe) => {
          const tags = [];
          if (recipe.metadata?.diet?.vegan) tags.push('Vegan');
          if (recipe.metadata?.diet?.vegetarian && !recipe.metadata?.diet?.vegan) tags.push('Vegetarian');
          if (recipe.metadata?.diet?.gluten_free) tags.push('Gluten-free');
          if (!recipe.metadata?.diet?.contains_dairy) tags.push('Dairy-free');
          return tags.map((t) => `<span class="chip">${t}</span>`).join('');
        };
        recipeDetailsEl.innerHTML = filteredRecipes.length
          ? `<div class="recipe-browser">${filteredRecipes.map((recipe) => `
              <article class="recipe-browser-card" data-recipe-id="${recipe.id}">
                <h3>${recipe.name}</h3>
                ${recipe.metadata?.style ? `<p class="style-tag">${recipe.metadata.style}</p>` : ''}
                <div class="chip-row">${chips(recipe)}</div>
              </article>`).join('')}</div>`
          : '<div class="empty-state">No recipes match that search.</div>';
        return;
      }

      const componentChips = activeRecipe.components?.length
        ? [
            { id: 'all', label: 'All' },
            ...(activeRecipe.components || []).map((component, index) => ({
              id: component.id,
              label: component.name || `Component ${index + 1}`
            }))
          ]
        : [];

      recipeDetailsEl.innerHTML = `
        <div class="detail-header">
          <h2>${activeRecipe.name}</h2>
          <div class="meta-grid">
            <span>Serves ${activeRecipe.servings?.count || '—'}${activeRecipe.servings?.note ? ` (${activeRecipe.servings.note})` : ''}</span>
            ${activeRecipe.metadata?.style ? `<span>${activeRecipe.metadata.style}</span>` : ''}
            ${activeRecipe.metadata?.context ? `<span>${activeRecipe.metadata.context}</span>` : ''}
          </div>
          ${componentChips.length ? `
            <div class="component-filters" aria-label="Focus on a dish">
              ${componentChips.map((chip) => {
                const isActiveSelection = activeComponentId === chip.id || (!activeComponentId && chip.id === 'all');
                return `
                <button
                  class="component-chip"
                  type="button"
                  data-component-chip="${chip.id}"
                  data-active="${isActiveSelection}"
                  aria-pressed="${isActiveSelection}"
                >
                  ${chip.label}
                </button>
              `;
              }).join('')}
            </div>
          ` : ''}
        </div>
        <div class="tabs">
          <button class="tab-button ${activeTab === 'ingredients' ? 'active' : ''}" data-tab="ingredients">Ingredients</button>
          <button class="tab-button ${activeTab === 'instructions' ? 'active' : ''}" data-tab="instructions">Instructions</button>
          <button class="tab-button ${activeTab === 'substitutions' ? 'active' : ''}" data-tab="substitutions">Substitutions</button>
          <button class="tab-button ${activeTab === 'workflow' ? 'active' : ''}" data-tab="workflow">Workflow</button>
        </div>
        <div class="tab-panel ${activeTab === 'ingredients' ? 'active' : ''}" data-panel="ingredients">
          ${renderIngredients(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'instructions' ? 'active' : ''}" data-panel="instructions">
          ${renderSteps(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'substitutions' ? 'active' : ''}" data-panel="substitutions">
          ${renderSubstitutions(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'workflow' ? 'active' : ''}" data-panel="workflow">
          ${renderWorkflow(activeRecipe)}
        </div>
      `;

      recipeDetailsEl.dataset.componentFiltering = activeComponentId ? 'true' : 'false';

      recipeDetailsEl.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', () => {
          activeTab = button.dataset.tab;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-component-chip]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const componentId = chip.dataset.componentChip;
          activeComponentId = componentId === 'all' ? null : componentId;
          pendingScrollComponentId = activeComponentId || null;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-sub-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.nextElementSibling;
          if (!panel) return;
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          panel.hidden = expanded;
          button.closest('.ingredient-item')?.classList.toggle('open', !expanded);
        });
      });

      const substitutionInput = recipeDetailsEl.querySelector('#substitutionSearch');
      if (substitutionInput) {
        substitutionInput.addEventListener('input', (event) => {
          const container = recipeDetailsEl.querySelector('#substitutionResults');
          container.innerHTML = buildSubstitutionResults(activeRecipe, event.target.value);
        });
      }

      if (pendingScrollComponentId) {
        requestAnimationFrame(() => {
          const activePanel = recipeDetailsEl.querySelector('.tab-panel.active');
          const target = activePanel?.querySelector(`[data-component-block="${pendingScrollComponentId}"]`);
          target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        pendingScrollComponentId = null;
      }
      updateRecipeActionState();
    };

    recipeDetailsEl.addEventListener('click', (event) => {
      const card = event.target.closest('.recipe-browser-card[data-recipe-id]');
      if (!card) return;
      selectRecipe(card.dataset.recipeId);
    });

    recipeListEl.addEventListener('click', (event) => {
      const card = event.target.closest('[data-recipe-id]');
      if (!card) return;
      selectRecipe(card.dataset.recipeId);
    });

    mobileDrawerListEl?.addEventListener('click', (event) => {
      const card = event.target.closest('[data-recipe-id]');
      if (!card) return;
      selectRecipe(card.dataset.recipeId, { scrollToCard: false, closeDrawer: true });
    });

    recipeSearchEl.addEventListener('input', () => {
      refreshRecipeViews();
    });

    mobileToggleButton?.addEventListener('click', () => {
      setMobileDrawerState(!isMobileDrawerOpen);
    });

    mobileCloseButton?.addEventListener('click', () => {
      setMobileDrawerState(false);
    });

    mobileDrawerEl?.addEventListener('click', (event) => {
      if (event.target === mobileDrawerEl) {
        setMobileDrawerState(false);
      }
    });

    refreshRecipeViews();
    setMobileDrawerState(false);
  </script>
</body>
</html>
