<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library | stevemwhite.com</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322110c'/%3E%3Cpath d='M9 21c3.5-3.5 5.6-5.6 7-10 1.4 4.4 3.5 6.5 7 10-2.1 1.4-5 2-7 2s-4.9-.6-7-2z' fill='%23f6a23a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #140906;
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(255, 196, 125, 0.18), transparent 55%), radial-gradient(circle at 80% 0%, rgba(207, 115, 31, 0.12), transparent 45%), linear-gradient(180deg, #0d0503 0%, #1b0a05 65%, #140906 100%);
      --panel: rgba(42, 18, 11, 0.88);
      --panel-border: rgba(255, 198, 150, 0.24);
      --panel-highlight: rgba(246, 162, 58, 0.18);
      --text: #fff5eb;
      --text-muted: rgba(255, 230, 207, 0.82);
      --accent: #f6a23a;
      --accent-strong: #ff8a3c;
      --chip-bg: rgba(255, 255, 255, 0.05);
      --chip-border: rgba(255, 198, 150, 0.32);
      --tab-border: rgba(255, 180, 120, 0.4);
      color: var(--text);
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      padding: clamp(1.25rem, 3vw, 2.75rem);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      max-width: 100vw;
    }

    main {
      width: min(1200px, 100%);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: grid;
      gap: 0.35rem;
      width: 100%;
    }

    header .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 3.4rem);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      max-width: 70ch;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
    }

    .mobile-nav-button {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: var(--panel-highlight);
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.6rem 1rem;
      cursor: pointer;
    }

    .search-field {
      flex: 1;
      min-width: 260px;
      display: grid;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    input[type="search"] {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--text);
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: rgba(246, 162, 58, 0.7);
      box-shadow: 0 0 0 3px rgba(246, 162, 58, 0.25);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      align-items: start;
    }

    .content-grid.has-active {
      grid-template-columns: minmax(250px, 320px) 1fr;
    }

    .content-grid:not(.has-active) .recipe-index-panel {
      display: none;
    }

    .recipe-browser {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .recipe-browser-card {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .recipe-browser-card:hover {
      background: var(--panel-highlight);
      border-color: rgba(246, 162, 58, 0.4);
    }

    .recipe-browser-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .recipe-browser-card .style-tag {
      margin: 0 0 0.65rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }


    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.35rem;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 100%;
    }

    .panel h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .recipe-index-panel {
      position: sticky;
      top: 1.25rem;
      max-height: calc(100vh - 2.5rem);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow: visible;
      padding-right: 0.5rem;
    }

    .recipe-card {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .recipe-card.active {
      border-color: rgba(246, 162, 58, 0.6);
      background: var(--panel-highlight);
    }

    .recipe-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .recipe-card p {
      margin: 0.3rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }

    .chip {
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--text);
    }

    .component-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }

    .component-chip {
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .component-chip[data-active="true"] {
      border-color: rgba(246, 162, 58, 0.6);
      color: var(--accent);
      background: rgba(246, 162, 58, 0.15);
    }

    .detail-header {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .detail-header h2 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--tab-border);
      margin-bottom: 1rem;
      flex-wrap: wrap;
      overflow-x: visible;
      width: 100%;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
    }

    .tab-button.active {
      color: var(--accent);
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 3px;
      border-radius: 99px 99px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab-panel.active {
      display: block;
    }

    .component-block {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s ease, opacity 0.2s ease;
      width: 100%;
      max-width: 100%;
    }

    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .component-kind {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .component-header h3 {
      margin: 0.15rem 0 0;
      font-size: 1.1rem;
    }

    .component-pill {
      border-radius: 10px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid rgba(246, 162, 58, 0.4);
      color: var(--accent);
      background: rgba(246, 162, 58, 0.1);
      align-self: flex-start;
    }

    .component-block[data-focused="true"] {
      border-color: rgba(246, 162, 58, 0.5);
    }

    [data-component-filtering="true"] .component-block[data-focused="false"] {
      display: none;
    }

    .ingredient-section {
      margin-bottom: 1.4rem;
    }

    .ingredient-section h4 {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ingredient-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .ingredient-item {
      padding: 0.65rem 0.8rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      display: grid;
      gap: 0.55rem;
    }

    .ingredient-item strong {
      display: block;
      font-size: 1rem;
    }

    .ingredient-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .ingredient-main {
      display: grid;
      gap: 0.25rem;
    }

    .sub-toggle {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.35rem 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .sub-toggle .chevron {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .ingredient-item.open .sub-toggle .chevron {
      transform: rotate(180deg);
    }

    .ingredient-substitutions {
      border-left: 2px solid rgba(255, 255, 255, 0.12);
      margin-left: 0.4rem;
      padding-left: 0.8rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .ingredient-substitutions ul {
      margin: 0.4rem 0 0;
      padding-left: 1rem;
    }

    .ingredient-substitutions li {
      margin-bottom: 0.25rem;
    }

    .steps {
      display: grid;
      gap: 1rem;
    }

    .step-card {
      border-radius: 18px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .step-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .step-card ol {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .substitution-search {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .substitution-results {
      display: grid;
      gap: 0.8rem;
    }

    .substitution-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .substitution-card h4 {
      margin: 0 0 0.4rem;
      font-size: 1rem;
    }

    .substitution-card ul {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .summary-grid {
      margin-top: 1.2rem;
      display: grid;
      gap: 0.6rem;
    }

    .summary-grid .chip {
      width: fit-content;
      border-color: rgba(246, 162, 58, 0.4);
      background: rgba(246, 162, 58, 0.1);
      color: var(--text);
    }

    .workflow-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }

    .workflow-phase {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.8rem;
      align-items: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .phase-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(246, 162, 58, 0.15);
      border: 1px solid rgba(246, 162, 58, 0.35);
      display: grid;
      place-items: center;
      font-weight: 600;
      color: var(--accent);
    }

    .workflow-phase h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--text);
    }

    .workflow-phase ul {
      margin: 0.35rem 0 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .mobile-drawer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: flex-end;
      transition: opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }

    .mobile-drawer[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-drawer__panel {
      width: min(420px, 100%);
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mobile-drawer__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .mobile-drawer__close {
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
    }

    .mobile-drawer__panel .recipe-list {
      max-height: none;
      padding-right: 0;
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
    }

    @media (max-width: 960px) {
      .content-grid.has-active {
        grid-template-columns: 1fr;
      }

      .recipe-list {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      :root {
        font-size: 15px;
      }

      body {
        padding: 0.6rem;
        display: block;
      }

      .mobile-nav-button {
        display: inline-flex;
        width: 100%;
      }

      .recipe-index-panel {
        display: none;
      }

      main {
        gap: 0.9rem;
        width: 100%;
      }

      header {
        width: 100%;
      }

      header h1 {
        font-size: 1.85rem;
      }

      header p {
        font-size: 0.95rem;
      }

      .controls {
        flex-direction: column;
        width: 100%;
        gap: 0.6rem;
      }

      .search-field {
        width: 100%;
        min-width: 0;
      }

      .content-grid {
        width: 100%;
      }

      .panel {
        padding: 0.85rem;
        border-radius: 18px;
        width: 100%;
      }

      .recipe-list {
        max-height: none;
      }

      .meta-grid {
        flex-direction: column;
        gap: 0.3rem;
      }

      .component-filters {
        margin-top: 0.25rem;
      }

      .component-block {
        padding: 0.75rem;
        border-radius: 16px;
        width: 100%;
      }

      .workflow-phase {
        grid-template-columns: 1fr;
        width: 100%;
      }

      .phase-badge {
        width: 32px;
        height: 32px;
      }

      .recipe-card,
      .tabs {
        width: 100%;
      }

      .tabs {
        gap: 0.35rem;
        padding-bottom: 0.2rem;
      }

      .tab-button {
        padding: 0.5rem 0.65rem;
        font-size: 0.85rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Recipe library</p>
      <h1>Field Notes From the Bonfire Kitchen</h1>
      <p>
        Keep the cabin pantry organized: search what you’ve already perfected and share easy swaps with whoever is cooking next.
      </p>
    </header>

    <section class="controls">
      <div class="search-field">
        <label for="recipeSearch">Search recipes</label>
        <input type="search" id="recipeSearch" placeholder="Try &ldquo;bonfire soup&rdquo; or &ldquo;vegan&rdquo;">
      </div>
    </section>

    <button class="mobile-nav-button" id="mobileRecipeToggle" type="button" aria-expanded="false">
      Browse recipes
      <span aria-hidden="true">☰</span>
    </button>

    <section class="content-grid">
      <aside class="panel recipe-index-panel" aria-label="Recipe index">
        <h2>Recipe index</h2>
        <div id="recipeList" class="recipe-list"></div>
      </aside>

      <section class="panel">
        <div id="recipeDetails"></div>
      </section>
    </section>

    <div id="mobileRecipeDrawer" class="mobile-drawer" aria-hidden="true">
      <div class="mobile-drawer__panel">
        <div class="mobile-drawer__header">
          <h2>Recipes</h2>
          <button type="button" class="mobile-drawer__close" id="mobileRecipeClose" aria-label="Close recipe list">✕</button>
        </div>
        <div id="mobileRecipeList" class="recipe-list"></div>
      </div>
    </div>
  </main>

  <script>
    const defaultRecipes = [
      {
        id: 'roasted-musquee-dhiver-bonfire-soup',
        name: 'Roasted Musquée d’Hiver Bonfire Soup',
        version: 1,
        servings: {
          count: 8,
          note: 'Easily stretches to 10 smaller mugs.'
        },
        metadata: {
          style: 'smooth mug-friendly squash soup',
          diet: {
            vegetarian: true,
            vegan: true,
            gluten_free: true,
            contains_dairy: false,
            contains_lentils: false
          },
          context: 'Made for an outdoor bonfire potluck, served in mugs.'
        },
        components: [
          {
            id: 'bonfire-soup-core',
            name: 'Bonfire Soup Base',
            kind: 'soup',
            ingredients: [
              {
                section: 'Roasted squash',
                items: [
                  {
                    name: 'Musquée d’Hiver de Provence squash',
                    amount: 1,
                    unit: 'large',
                    prep: 'cut into wedges, seeds removed',
                    notes: 'Basketball-sized; expect ~7–9 cups roasted flesh.',
                    substitutions: [
                      {
                        name: 'Butternut squash',
                        ratio: '1:1 by weight',
                        notes: 'Flavour slightly less complex, still great.'
                      },
                      {
                        name: 'Kabocha squash',
                        ratio: '1:1 by weight',
                        notes: 'Denser; you may need 1–2 extra cups stock.'
                      }
                    ]
                  },
                  {
                    name: 'Olive oil',
                    amount: 2,
                    unit: 'tbsp',
                    prep: 'for roasting',
                    substitutions: [
                      {
                        name: 'Neutral oil (canola, sunflower, etc.)',
                        ratio: '1:1'
                      },
                      {
                        name: 'Melted butter',
                        ratio: '1:1',
                        notes: 'Adds richness, not vegan.'
                      }
                    ]
                  },
                  {
                    name: 'Salt',
                    amount: 0.5,
                    unit: 'tsp',
                    prep: 'for roasting squash',
                    substitutions: []
                  },
                  {
                    name: 'Black pepper',
                    amount: 0.25,
                    unit: 'tsp',
                    prep: 'for roasting squash',
                    substitutions: []
                  }
                ]
              },
              {
                section: 'Soup base',
                items: [
                  {
                    name: 'Olive oil',
                    amount: 2,
                    unit: 'tbsp',
                    prep: 'for sautéing',
                    substitutions: [
                      {
                        name: 'Butter',
                        ratio: '1:1',
                        notes: 'Richer flavour, not vegan.'
                      },
                      {
                        name: 'Neutral oil',
                        ratio: '1:1'
                      }
                    ]
                  },
                  {
                    name: 'Onions',
                    amount: 2,
                    unit: 'medium',
                    prep: 'roughly chopped',
                    substitutions: [
                      {
                        name: 'Leeks',
                        ratio: '2 medium onions ≈ 3 leeks (white + light green parts)',
                        notes: 'Sweeter, milder flavour.'
                      },
                      {
                        name: 'Shallots',
                        ratio: '2 medium onions ≈ 4–5 large shallots'
                      }
                    ]
                  },
                  {
                    name: 'Garlic cloves',
                    amount: 4,

                order: 1,
                title: 'Prepare dried chile paste',
                instructions: [
                  'Remove stems and most seeds from the dried ancho and guajillo chiles (and any additional hot dried chile if using).',
                  'Lightly toast the dried chiles in a dry skillet over medium heat, 20–30 seconds per side, until fragrant but not burnt.',
                  'Transfer the toasted chiles to a bowl and cover with very hot water. Soak for about 20 minutes until very pliable.',
                  'Reserve about 1 cup of the soaking liquid, then drain the rest.',
                  'Blend the softened chiles with 1/2 cup of the soaking liquid, 1 clove of the garlic (taken from the total), a pinch of salt, and a splash of the brewed coffee until you have a smooth, thick red paste. Add more soaking liquid as needed to blend.',
                  'Set the chile paste aside; this will be the flavour backbone of the chili.'
                ]
              },
              {
                order: 2,
                title: 'Brown the beef and build fond',
                instructions: [
                  'Pat the beef shoulder cubes dry with paper towels and season them lightly with salt.',
                  'Heat a large heavy pot or Dutch oven over medium-high heat and add the neutral oil or tallow.',
                  'Working in batches to avoid overcrowding, sear the beef cubes until deeply browned on at least 2 sides. Transfer browned cubes to a bowl.',
                  'Add the ground beef to the pot and cook, breaking it up with a spoon, until well browned and most of the moisture has evaporated. Season lightly with salt and pepper.',
                  'Transfer the browned ground beef to the bowl with the beef cubes. Leave the rendered fat and browned bits (fond) in the pot.'
                ]
              },
              {
                order: 3,
                title: 'Cook aromatics and fresh chiles',
                instructions: [
                  'Reduce heat to medium. If the pot looks dry, add a little more oil.',
                  'Add the diced onion and carrots. Cook, stirring occasionally, until softened and lightly golden, about 5–7 minutes.',
                  'Stir in the diced jalapeño and Fresno chiles and cook for another 1–2 minutes until slightly softened.',
                  'Add the remaining minced garlic and cook for 30–60 seconds until fragrant, taking care not to burn it.'
                ]
              },
              {
                order: 4,
                title: 'Bloom chile paste and spices',
                instructions: [
                  'Add the prepared dried chile paste to the pot with the vegetables.',
                  'Cook the paste, stirring, for 1–2 minutes until it darkens slightly and smells deeply aromatic.',
                  'Sprinkle in the ground cumin, smoked paprika, ground coriander, dried oregano, ground cinnamon, cayenne (if using), and a pinch of salt.',
                  'Stir and cook for another 1–2 minutes to bloom the spices in the fat, which intensifies their flavour.'
                ]
              },
              {
                order: 5,
                title: 'Deglaze and add liquids',
                instructions: [
                  'Pour in the brewed coffee to deglaze the pot, scraping up any browned bits from the bottom with a wooden spoon.',
                  'Add the beef stock or water and stir to combine.',
                  'Add the canned crushed or diced tomatoes and Worcestershire sauce (if using), stirring well.',
                  'Return the browned beef cubes and ground beef (and any accumulated juices) to the pot. Stir to incorporate everything evenly.'
                ]
              },
              {
                order: 6,
                title: 'Add chocolate and simmer low and slow',
                instructions: [
                  'Bring the mixture just up to a simmer over medium heat.',
                  'Stir in the chopped baker’s chocolate until fully melted and incorporated.',
                  'Reduce the heat to low so the chili is at a very gentle simmer. Partially cover the pot with a lid.',
                  'Simmer for 2.5 to 3 hours, stirring every 20–30 minutes, until the beef shoulder cubes are very tender and the chili has thickened. Add small splashes of water or stock if it gets too thick or starts to catch on the bottom.',
                  'Taste and adjust seasoning with salt and pepper as it cooks.'
                ]
              },
              {
                order: 7,
                title: 'Finish with beans, corn, and vinegar',
                instructions: [
                  'When the beef is tender and the chili has thickened to your liking, stir in the drained black beans and corn.',
                  'Simmer for another 10–15 minutes to warm the beans and corn through and let them absorb some flavour.',
                  'Stir in the apple cider vinegar. Taste and adjust salt, pepper, and acidity (add more vinegar or a squeeze of lime if you want more brightness).',
                  'Turn off the heat, cover the pot, and let the chili rest for 15–20 minutes before serving to allow the flavours to fully meld.',
                  'Serve hot with your preferred toppings such as cheese, sour cream, green onions, and lime wedges (toppings not included in nutrition/diet flags).'
                ]
              }

    let recipes = [...defaultRecipes];

    const formatComponentKind = (kind = '') =>
      kind
        .replace(/_/g, ' ')
        .replace(/\b\w/g, (char) => char.toUpperCase());

    const formatAmount = (item) => {
      if (item.amount == null) {
        return 'As desired';
      }

      const rounded = Number.isInteger(item.amount) ? item.amount : item.amount.toString();
      return [rounded, item.unit].filter(Boolean).join(' ');
    };

    const slugify = (text) => {
      const normalized = (text || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
      const slug = normalized.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return slug || `recipe-${Date.now()}`;
    };

    const slugsShareToken = (slugA, slugB) => {
      if (!slugA || !slugB) return false;
      const tokensA = slugA.split('-').filter((token) => token.length > 2);
      if (!tokensA.length) return false;
      const tokenSet = new Set(tokensA);
      return slugB.split('-').some((token) => token.length > 2 && tokenSet.has(token));
    };

    const matchesSearchQuery = (recipe, normalizedQuery = '') => {
      if (!normalizedQuery) return true;
      const haystack = [
        recipe.name || '',
        recipe.metadata?.style || '',
        recipe.metadata?.context || ''
      ].join(' ').toLowerCase();
      return haystack.includes(normalizedQuery);
    };

    const applySearchFilter = (queryText = recipeSearchEl?.value || '') => {
      const normalizedQuery = (queryText || '').toLowerCase();
      filteredRecipes = normalizedQuery
        ? recipes.filter((recipe) => matchesSearchQuery(recipe, normalizedQuery))
        : [...recipes];
      return filteredRecipes;
    };

    const coerceArray = (value) => (Array.isArray(value) ? value : value != null ? [value] : []);

    const normalizeSubstitution = (entry) => {
      if (!entry) return null;
      if (typeof entry === 'string') {
        return { name: entry, ratio: '', notes: '' };
      }
      if (typeof entry === 'object') {
        return {
          name: entry.name || entry.title || entry.ingredient || entry.item || '',
          ratio: entry.ratio || entry.quantity || entry.amount || '',
          notes: entry.notes || entry.note || ''
        };
      }
      return null;
    };

    const normalizeIngredientEntry = (entry) => {
      if (!entry) return null;
      if (typeof entry === 'string') {
        return parseIngredientLine(entry) || {
          name: entry,
          amount: null,
          unit: null,
          prep: '',
          notes: ''
        };
      }
      if (typeof entry === 'object') {
        if (Array.isArray(entry.items)) {
          return null;
        }
        const substitutions = Array.isArray(entry.substitutions)
          ? entry.substitutions.map(normalizeSubstitution).filter(Boolean)
          : [];
        const optional = Boolean(entry.optional ?? entry.isOptional);
        const prep = entry.prep || entry.preparation || entry.prep_method || '';
        const notes = entry.notes || entry.note || entry.description || '';
        const rawText = entry.text || entry.line || entry.raw;
        if (typeof rawText === 'string' && rawText.trim()) {
          const parsed = parseIngredientLine(rawText);
          if (parsed) {
            return {
              ...parsed,
              notes: notes || parsed.notes,
              prep: prep || parsed.prep,
              optional,
              substitutions
            };
          }
        }
        const name =
          entry.name ||
          entry.title ||
          entry.ingredient ||
          entry.item ||
          entry.label ||
          '';
        const amountValue = entry.amount ?? entry.quantity ?? entry.qty ?? null;
        const unitValue = entry.unit || entry.units || entry.measure || entry.measurement || null;
        const compositeText = [amountValue, unitValue, name].filter(Boolean).join(' ');
        if (compositeText.trim().length) {
          const parsed = parseIngredientLine(compositeText);
          if (parsed) {
            return {
              ...parsed,
              notes: notes || parsed.notes,
              prep: prep || parsed.prep,
              optional,
              substitutions
            };
          }
        }

        let numericAmount = null;
        if (typeof amountValue === 'number') {
          numericAmount = amountValue;
        } else if (typeof amountValue === 'string') {
          const parsedAmount = parseFraction(amountValue);
          if (Number.isFinite(parsedAmount)) {
            numericAmount = parsedAmount;
          }
        }

        return {
          name: name || notes || 'Ingredient',
          amount: Number.isFinite(numericAmount) ? numericAmount : null,
          unit: unitValue || null,
          prep,
          notes,
          optional,
          substitutions
        };
      }
      return null;
    };

    const normalizeIngredientItems = (rawItems) =>
      coerceArray(rawItems)
        .map((entry) => normalizeIngredientEntry(entry))
        .filter(Boolean);

    const normalizeIngredientSections = (rawValue, defaultLabel = 'Ingredients') => {
      if (!rawValue) {
        return [];
      }
      if (Array.isArray(rawValue)) {
        const looksLikeSections = rawValue.every(
          (entry) => entry && typeof entry === 'object' && Array.isArray(entry.items)
        );
        if (looksLikeSections) {
          return rawValue
            .map((section, index) => ({
              section: section.section || section.title || section.label || `${defaultLabel} ${index + 1}`,
              items: normalizeIngredientItems(section.items || [])
            }))
            .filter((section) => section.items.length);
        }
        return [
          {
            section: defaultLabel,
            items: normalizeIngredientItems(rawValue)
          }
        ].filter((section) => section.items.length);
      }
      if (typeof rawValue === 'object') {
        return Object.entries(rawValue)
          .map(([label, value]) => ({
            section: label || defaultLabel,
            items: normalizeIngredientItems(value)
          }))
          .filter((section) => section.items.length);
      }
      if (typeof rawValue === 'string') {
        return [
          {
            section: defaultLabel,
            items: normalizeIngredientItems([rawValue])
          }
        ];
      }
      return [];
    };

    const normalizeStepEntries = (rawSteps = [], componentName = '', componentIndex = 0) => {
      const steps = Array.isArray(rawSteps) ? rawSteps : rawSteps ? [rawSteps] : [];
      return steps.map((step, stepIndex) => {
        const order = step?.order ?? stepIndex + 1;
        if (typeof step === 'string') {
          const [maybeTitle, ...rest] = step.split(':');
          if (rest.length) {
            return {
              order,
              title: maybeTitle.trim() || `Step ${order}`,
              instructions: [rest.join(':').trim() || step.trim()]
            };
          }
          return {
            order,
            title: `Step ${order}`,
            instructions: [step.trim()]
          };
        }
        if (Array.isArray(step)) {
          return {
            order,
            title: `Step ${order}`,
            instructions: step.map((line) => (line ?? '').toString()).filter(Boolean)
          };
        }
        const instructionsSource =
          Array.isArray(step?.instructions)
            ? step.instructions
            : typeof step?.instructions === 'string'
              ? [step.instructions]
              : Array.isArray(step?.lines)
                ? step.lines
                : step?.body
                  ? [step.body]
                  : step?.description
                    ? [step.description]
                    : step?.details
                      ? [step.details]
                      : step?.detail
                        ? [step.detail]
                        : step?.text
                          ? [step.text]
                          : [];
        const extraLines = [];
        ['details', 'detail'].forEach((key) => {
          if (typeof step?.[key] === 'string' && !instructionsSource.includes(step[key])) {
            extraLines.push(step[key]);
          }
        });
        const instructionLines = instructionsSource
          .concat(extraLines)
          .map((line) => (line ?? '').toString().trim())
          .filter(Boolean);
        return {
          order,
          title: step?.title || step?.name || step?.label || step?.action || `Step ${order}`,
          instructions: instructionLines.length
            ? instructionLines
            : [`Add details for ${componentName || `component ${componentIndex + 1}`}.`]
        };
      });
    };

    const normalizeWorkflowItems = (rawItems = []) => {
      const items = Array.isArray(rawItems) ? rawItems : rawItems ? [rawItems] : [];
      return items
        .map((item) => {
          if (!item) return null;
          if (typeof item === 'string') {
            return {
              component: '',
              step: null,
              description: item.trim()
            };
          }
          if (typeof item === 'object') {
            if (Array.isArray(item.actions)) {
              return item.actions
                .map((action, index) =>
                  typeof action === 'string'
                    ? {
                        component: item.component || '',
                        step: item.step ?? null,
                        description: action
                      }
                    : normalizeWorkflowItems([action])[0]
                )
                .filter(Boolean);
            }
            return {
              component: item.component || item.componentId || item.phaseComponent || '',
              step:
                item.step ?? item.order ?? item.index ?? (typeof item.line === 'number' ? item.line : null),
              description:
                item.description ||
                item.detail ||
                item.details ||
                item.text ||
                item.name ||
                item.task ||
                item.label ||
                item.action ||
                ''
            };
          }
          return null;
        })
        .flat()
        .filter(Boolean);
    };

    const deriveStepsFromWorkflow = (component, workflowPhases = []) => {
      if (!workflowPhases.length) return [];
      const componentSlug = slugify(component.name || component.id || '');
      if (!componentSlug) return [];

      const matchingPhases = workflowPhases.filter((phase) => {
        const labelSlug = slugify(phase.label || '');
        if (slugsShareToken(componentSlug, labelSlug)) {
          return true;
        }
        const descriptionSlug = slugify(phase.description || phase.notes || '');
        return slugsShareToken(componentSlug, descriptionSlug);
      });

      if (!matchingPhases.length) {
        return [];
      }

      let derivedIndex = 1;
      return matchingPhases.map((phase) => {
        const instructions = (phase.items || [])
          .map((item) => item.description || '')
          .filter(Boolean);
        if (!instructions.length && phase.description) {
          instructions.push(phase.description);
        }
        if (!instructions.length && phase.notes) {
          instructions.push(phase.notes);
        }
        if (!instructions.length) {
          instructions.push('Follow the workflow guidance for this phase.');
        }
        return {
          order: derivedIndex++,
          title: phase.label || `Phase ${phase.order ?? derivedIndex - 1}`,
          instructions
        };
      });
    };

    const buildEditableRecipePayload = (recipe) => {
      if (!recipe) return null;
      const { createdAt, updatedAt, ...rest } = recipe;
      try {
        return JSON.parse(JSON.stringify(rest));
      } catch (_error) {
        return rest;
      }
    };

    const resolveComponentSource = (raw = {}) => {
      if (Array.isArray(raw.components) && raw.components.length) {
        return raw.components;
      }
      if (raw.components && typeof raw.components === 'object') {
        const values = Object.values(raw.components).filter(Boolean);
        if (values.length) {
          return values;
        }
      }
      if (Array.isArray(raw.sections) && raw.sections.length) {
        return raw.sections;
      }
      const fallbackIngredients =
        raw.ingredients ||
        raw.ingredientSections ||
        raw.ingredient_sections ||
        raw.ingredientGroups;
      const fallbackSteps = raw.steps || raw.directions || raw.instructions || raw.method;
      if (fallbackIngredients || fallbackSteps) {
        return [
          {
            name: raw.componentName || raw.defaultComponentName || raw.name || raw.title,
            ingredients: fallbackIngredients,
            steps: fallbackSteps
          }
        ];
      }
      return [];
    };
    const refreshRecipeViews = ({ highlightId } = {}) => {
      const previousActiveId = activeRecipe?.id;
      applySearchFilter();

      if (highlightId) {
        const highlighted =
          filteredRecipes.find((recipe) => recipe.id === highlightId) ||
          recipes.find((recipe) => recipe.id === highlightId);
        if (highlighted) {
          activeRecipe = highlighted;
        }
      }

      if (activeRecipe) {
        const stillVisible = filteredRecipes.some((recipe) => recipe.id === activeRecipe.id);
        if (!stillVisible) {
          activeRecipe = null;
        }
      }

      if (activeRecipe?.id !== previousActiveId) {
        activeComponentId = null;
        activeTab = 'ingredients';

      renderRecipeList();
      renderRecipeDetails();

      if (highlightId && activeRecipe?.id === highlightId) {
        pendingScrollComponentId = null;
