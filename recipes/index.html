<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library | stevemwhite.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #1f0505;
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(255, 132, 110, 0.18), transparent 55%), radial-gradient(circle at 80% 0%, rgba(186, 16, 0, 0.15), transparent 45%), linear-gradient(180deg, #170303 0%, #240807 65%, #1f0505 100%);
      --panel: rgba(54, 9, 8, 0.88);
      --panel-border: rgba(255, 168, 150, 0.25);
      --panel-highlight: rgba(255, 106, 89, 0.18);
      --text: #fff2ed;
      --text-muted: rgba(255, 218, 205, 0.82);
      --accent: #ff6f5a;
      --accent-strong: #ff4029;
      --chip-bg: rgba(255, 255, 255, 0.05);
      --chip-border: rgba(255, 168, 150, 0.35);
      --tab-border: rgba(255, 140, 120, 0.4);
      color: var(--text);
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      padding: clamp(1.25rem, 3vw, 2.75rem);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      max-width: 100vw;
    }

    main {
      width: min(1200px, 100%);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: grid;
      gap: 0.35rem;
      width: 100%;
    }

    header .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 3.4rem);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      max-width: 70ch;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
    }

    .search-field {
      flex: 1;
      min-width: 260px;
      display: grid;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    input[type="search"] {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--text);
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: rgba(255, 111, 90, 0.7);
      box-shadow: 0 0 0 3px rgba(255, 111, 90, 0.25);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(250px, 320px) 1fr;
      gap: 1.25rem;
      width: 100%;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.35rem;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 100%;
    }

    .panel h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: calc(100vh - 220px);
      overflow: auto;
      padding-right: 0.5rem;
    }

    .recipe-card {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .recipe-card.active {
      border-color: rgba(255, 111, 90, 0.6);
      background: var(--panel-highlight);
    }

    .recipe-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .recipe-card p {
      margin: 0.3rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }

    .chip {
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--text);
    }

    .component-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }

    .component-chip {
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .component-chip[data-active="true"] {
      border-color: rgba(255, 111, 90, 0.6);
      color: var(--accent);
      background: rgba(255, 111, 90, 0.15);
    }

    .detail-header {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .detail-header h2 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--tab-border);
      margin-bottom: 1rem;
      flex-wrap: wrap;
      overflow-x: visible;
      width: 100%;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
    }

    .tab-button.active {
      color: var(--accent);
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 3px;
      border-radius: 99px 99px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab-panel.active {
      display: block;
    }

    .component-block {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s ease, opacity 0.2s ease;
      width: 100%;
      max-width: 100%;
    }

    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .component-kind {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .component-header h3 {
      margin: 0.15rem 0 0;
      font-size: 1.1rem;
    }

    .component-pill {
      border-radius: 10px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid rgba(255, 111, 90, 0.4);
      color: var(--accent);
      background: rgba(255, 111, 90, 0.1);
      align-self: flex-start;
    }

    .component-block[data-focused="true"] {
      border-color: rgba(255, 111, 90, 0.5);
    }

    [data-component-filtering="true"] .component-block[data-focused="false"] {
      display: none;
    }

    .ingredient-section {
      margin-bottom: 1.4rem;
    }

    .ingredient-section h4 {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ingredient-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .ingredient-item {
      padding: 0.65rem 0.8rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      display: grid;
      gap: 0.55rem;
    }

    .ingredient-item strong {
      display: block;
      font-size: 1rem;
    }

    .ingredient-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .ingredient-main {
      display: grid;
      gap: 0.25rem;
    }

    .sub-toggle {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.35rem 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .sub-toggle .chevron {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .ingredient-item.open .sub-toggle .chevron {
      transform: rotate(180deg);
    }

    .ingredient-substitutions {
      border-left: 2px solid rgba(255, 255, 255, 0.12);
      margin-left: 0.4rem;
      padding-left: 0.8rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .ingredient-substitutions ul {
      margin: 0.4rem 0 0;
      padding-left: 1rem;
    }

    .ingredient-substitutions li {
      margin-bottom: 0.25rem;
    }

    .steps {
      display: grid;
      gap: 1rem;
    }

    .step-card {
      border-radius: 18px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .step-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .step-card ol {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .substitution-search {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .substitution-results {
      display: grid;
      gap: 0.8rem;
    }

    .substitution-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .substitution-card h4 {
      margin: 0 0 0.4rem;
      font-size: 1rem;
    }

    .substitution-card ul {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .summary-grid {
      margin-top: 1.2rem;
      display: grid;
      gap: 0.6rem;
    }

    .summary-grid .chip {
      width: fit-content;
      border-color: rgba(255, 111, 90, 0.4);
      background: rgba(255, 111, 90, 0.1);
      color: var(--text);
    }

    .workflow-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }

    .workflow-phase {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.8rem;
      align-items: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .phase-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255, 111, 90, 0.15);
      border: 1px solid rgba(255, 111, 90, 0.35);
      display: grid;
      place-items: center;
      font-weight: 600;
      color: var(--accent);
    }

    .workflow-phase h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--text);
    }

    .workflow-phase ul {
      margin: 0.35rem 0 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
    }

    @media (max-width: 960px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .recipe-list {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      :root {
        font-size: 15px;
      }

      body {
        padding: 0.6rem;
        display: block;
      }

      main {
        gap: 0.9rem;
        width: 100%;
      }

      header {
        width: 100%;
      }

      header h1 {
        font-size: 1.85rem;
      }

      header p {
        font-size: 0.95rem;
      }

      .controls {
        flex-direction: column;
        width: 100%;
        gap: 0.6rem;
      }

      .search-field {
        width: 100%;
        min-width: 0;
      }

      .content-grid {
        width: 100%;
      }

      .panel {
        padding: 0.85rem;
        border-radius: 18px;
        width: 100%;
      }

      .recipe-list {
        max-height: none;
      }

      .meta-grid {
        flex-direction: column;
        gap: 0.3rem;
      }

      .component-filters {
        margin-top: 0.25rem;
      }

      .component-block {
        padding: 0.75rem;
        border-radius: 16px;
        width: 100%;
      }

      .workflow-phase {
        grid-template-columns: 1fr;
        width: 100%;
      }

      .phase-badge {
        width: 32px;
        height: 32px;
      }

      .recipe-card,
      .tabs {
        width: 100%;
      }

      .tabs {
        gap: 0.35rem;
        padding-bottom: 0.2rem;
      }

      .tab-button {
        padding: 0.5rem 0.65rem;
        font-size: 0.85rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Recipe library</p>
      <h1>Field Notes From the Bonfire Kitchen</h1>
      <p>
        Track the recipes that show up in the tin mug rotation, search them quickly,
        and keep swaps handy for friends with different pantry vibes.
      </p>
    </header>

    <section class="controls">
      <div class="search-field">
        <label for="recipeSearch">Search recipes</label>
        <input type="search" id="recipeSearch" placeholder="Try &ldquo;bonfire soup&rdquo; or &ldquo;vegan&rdquo;">
      </div>
    </section>

    <section class="content-grid">
      <aside class="panel">
        <h2>Recipe index</h2>
        <div id="recipeList" class="recipe-list"></div>
      </aside>

      <section class="panel">
        <div id="recipeDetails"></div>
      </section>
    </section>
  </main>

  <script>
    const recipes = [
      {
        id: 'roasted-musquee-dhiver-bonfire-soup',
        name: 'Roasted Musquée d’Hiver Bonfire Soup',
        version: 1,
        servings: {
          count: 8,
          note: 'Easily stretches to 10 smaller mugs.'
        },
        metadata: {
          style: 'smooth mug-friendly squash soup',
          diet: {
            vegetarian: true,
            vegan: true,
            gluten_free: true,
            contains_dairy: false,
            contains_lentils: false
          },
          context: 'Made for an outdoor bonfire potluck, served in mugs.'
        },
        components: [
          {
            id: 'bonfire-soup-core',
            name: 'Bonfire Soup Base',
            kind: 'soup',
            ingredients: [
              {
                section: 'Roasted squash',
                items: [
                  {
                    name: 'Musquée d’Hiver de Provence squash',
                    amount: 1,
                    unit: 'large',
                    prep: 'cut into wedges, seeds removed',
                    notes: 'Basketball-sized; expect ~7–9 cups roasted flesh.',
                    substitutions: [
                      {
                        name: 'Butternut squash',
                        ratio: '1:1 by weight',
                        notes: 'Flavour slightly less complex, still great.'
                      },
                      {
                        name: 'Kabocha squash',
                        ratio: '1:1 by weight',
                        notes: 'Denser; you may need 1–2 extra cups stock.'
                      }
                    ]
                  },
                  {
                    name: 'Olive oil',
                    amount: 2,
                    unit: 'tbsp',
                    prep: 'for roasting',
                    substitutions: [
                      {
                        name: 'Neutral oil (canola, sunflower, etc.)',
                        ratio: '1:1'
                      },
                      {
                        name: 'Melted butter',
                        ratio: '1:1',
                        notes: 'Adds richness, not vegan.'
                      }
                    ]
                  },
                  {
                    name: 'Salt',
                    amount: 0.5,
                    unit: 'tsp',
                    prep: 'for roasting squash',
                    substitutions: []
                  },
                  {
                    name: 'Black pepper',
                    amount: 0.25,
                    unit: 'tsp',
                    prep: 'for roasting squash',
                    substitutions: []
                  }
                ]
              },
              {
                section: 'Soup base',
                items: [
                  {
                    name: 'Olive oil',
                    amount: 2,
                    unit: 'tbsp',
                    prep: 'for sautéing',
                    substitutions: [
                      {
                        name: 'Butter',
                        ratio: '1:1',
                        notes: 'Richer flavour, not vegan.'
                      },
                      {
                        name: 'Neutral oil',
                        ratio: '1:1'
                      }
                    ]
                  },
                  {
                    name: 'Onions',
                    amount: 2,
                    unit: 'medium',
                    prep: 'roughly chopped',
                    substitutions: [
                      {
                        name: 'Leeks',
                        ratio: '2 medium onions ≈ 3 leeks (white + light green parts)',
                        notes: 'Sweeter, milder flavour.'
                      },
                      {
                        name: 'Shallots',
                        ratio: '2 medium onions ≈ 4–5 large shallots'
                      }
                    ]
                  },
                  {
                    name: 'Garlic cloves',
                    amount: 4,
                    unit: 'cloves',
                    prep: 'sliced or minced',
                    substitutions: [
                      {
                        name: 'Garlic powder',
                        ratio: '1 clove ≈ 1/4 tsp powder'
                      }
                    ]
                  },
                  {
                    name: 'Fresh ginger',
                    amount: 1.5,
                    unit: 'tbsp',
                    prep: 'finely grated or minced',
                    notes: 'Use more (up to 2 tbsp) if you want stronger ginger.',
                    substitutions: [
                      {
                        name: 'Ground ginger',
                        ratio: '1 tbsp fresh ≈ 1 tsp ground'
                      }
                    ]
                  },
                  {
                    name: 'Curry powder',
                    amount: 2,
                    unit: 'tsp',
                    prep: 'added to aromatics',
                    notes: 'Use a mild or medium curry powder.',
                    substitutions: [
                      {
                        name: 'Red or yellow curry paste',
                        ratio: '2 tsp powder ≈ 1 tbsp paste',
                        notes: 'Fry paste with the aromatics.'
                      },
                      {
                        name: 'Garam masala',
                        ratio: '1:1',
                        notes: 'More warming spice, less turmeric.'
                      }
                    ]
                  },
                  {
                    name: 'Vegetable or chicken stock',
                    amount: 6,
                    unit: 'cups',
                    prep: 'added before simmering',
                    notes: 'Start with 6 cups; you may add 1–2 cups more after blending to adjust thickness.',
                    substitutions: [
                      {
                        name: 'Water + bouillon',
                        ratio: 'Use as directed on bouillon packaging.'
                      }
                    ]
                  },
                  {
                    name: 'Coconut milk',
                    amount: 160,
                    unit: 'ml',
                    prep: 'stirred in before blending',
                    notes: 'Small can; adds gentle richness without dominating.',
                    substitutions: [
                      {
                        name: 'Heavy cream',
                        ratio: '160 ml ≈ 2/3 cup',
                        notes: 'Not vegan; richer, more dairy-forward.'
                      },
                      {
                        name: 'Evaporated milk',
                        ratio: '1:1',
                        notes: 'Milder flavour; good pantry option.'
                      },
                      {
                        name: 'Additional stock',
                        ratio: '1:1',
                        notes: 'If you want to keep it low-fat; soup will be lighter.'
                      }
                    ]
                  },
                  {
                    name: 'Maple syrup',
                    amount: 1,
                    unit: 'tbsp',
                    prep: 'added after blending',
                    notes: 'Balances acidity and enhances squash sweetness.',
                    substitutions: [
                      {
                        name: 'Brown sugar',
                        ratio: '1 tbsp maple ≈ 1 tbsp packed brown sugar'
                      },
                      {
                        name: 'Honey',
                        ratio: '1:1',
                        notes: 'Not vegan.'
                      }
                    ]
                  },
                  {
                    name: 'Lime juice',
                    amount: 1,
                    unit: 'lime',
                    prep: 'juiced and added to taste',
                    notes: 'Start with half the lime, then adjust.',
                    substitutions: [
                      {
                        name: 'Apple cider vinegar',
                        ratio: '1 lime ≈ 2–3 tsp vinegar'
                      },
                      {
                        name: 'White wine vinegar',
                        ratio: '1:1 with cider vinegar'
                      }
                    ]
                  },
                  {
                    name: 'Salt',
                    amount: 1.5,
                    unit: 'tsp',
                    prep: 'to taste, added in stages',
                    notes: 'Start with 1 tsp in the pot after blending, then adjust.',
                    substitutions: []
                  },
                  {
                    name: 'Black pepper',
                    amount: 0.5,
                    unit: 'tsp',
                    prep: 'freshly ground, to taste',
                    substitutions: []
                  }
                ]
              },
              {
                section: 'Optional richness and depth',
                items: [
                  {
                    name: 'Butter',
                    amount: 2,
                    unit: 'tbsp',
                    prep: 'stirred in at the end, off heat',
                    optional: true,
                    notes: 'Softens brightness and adds "bass notes".',
                    substitutions: [
                      {
                        name: 'Olive oil',
                        ratio: '1:1',
                        notes: 'Keeps it dairy-free/vegan.'
                      },
                      {
                        name: 'Heavy cream',
                        ratio: '2 tbsp butter ≈ 1/4 cup cream',
                        notes: 'Richer, creamier mouthfeel.'
                      }
                    ]
                  },
                  {
                    name: 'Miso paste',
                    amount: 1,
                    unit: 'tbsp',
                    prep: 'dissolved in a little warm soup, then stirred in',
                    optional: true,
                    notes: 'Adds umami and depth if the soup tastes too bright.',
                    substitutions: [
                      {
                        name: 'Soy sauce',
                        ratio: '1 tbsp miso ≈ 1–2 tsp soy sauce',
                        notes: 'Add gradually to avoid over-salting.'
                      }
                    ]
                  }
                ]
              },

                title: 'Assemble the bowls',
                instructions: [
                  'Bring the finished broth with chicken and kale back to a gentle simmer so it is hot.',
                  'Taste and adjust with lime juice, fish sauce, or maple syrup until the balance feels right.',
                  'Ladle the hot curry broth, chicken, and kale over the noodles.',
                  'Top with a crispy noodle nest, sliced onion or shallot, basil, cilantro, and a lime wedge.',
                  'Serve immediately with chili oil and Swiss chard chutney on the side so everyone can customize heat and intensity.'
                ]
              }
            ]
          }
        ],
        workflow: [
          {
            order: 1,
            label: 'Make curry paste and noodle dough',
            items: [
              { component: 'curry_paste', step: 1 },
              { component: 'curry_paste', step: 2 },
              { component: 'fresh_egg_noodles', step: 1 }
            ]
          },
          {
            order: 2,
            label: 'Roll noodles and start broth',
            items: [
              { component: 'fresh_egg_noodles', step: 2 },
              { component: 'fresh_egg_noodles', step: 3 },
              { component: 'soup_base_and_chicken', step: 1 },
              { component: 'soup_base_and_chicken', step: 2 }
            ]
          },
          {
            order: 3,
            label: 'Finish broth and prepare crispy nests',
            items: [
              { component: 'soup_base_and_chicken', step: 3 },
              { component: 'crispy_noodle_nests', step: 1 },
              { component: 'crispy_noodle_nests', step: 2 },
              { component: 'crispy_noodle_nests', step: 3 }
            ]
          },
          {
            order: 4,
            label: 'Boil noodles, wilt kale, and assemble',
            items: [
              { component: 'soup_base_and_chicken', step: 4 },
              { component: 'noodles_and_assembly', step: 1 },
              { component: 'noodles_and_assembly', step: 2 }
            ]
          }
        ],
        substitution_summary: {
          dairy_free: 'Recipe is naturally dairy-free as written; avoid butter-based garnishes.',
          vegan: 'Swap chicken for tofu or seared mushrooms, use vegetable stock, and replace fish sauce/shrimp paste with soy sauce plus a splash of mushroom or vegan fish sauce.',
          extra_rich: 'Use the full coconut milk, simmer uncovered a bit longer to concentrate, leave bones/skin in while simmering, and finish bowls with a spoon of coconut cream.',
          less_bright: 'Reduce lime juice in the broth to 1 tbsp and let diners adjust individually with lime wedges.',
          spicier: 'Increase dried chilies or chili flakes in the paste, add more paste to the broth, and serve with a bold chili oil or crisp for extra heat.'
        }
      }
    ];

    let filteredRecipes = [...recipes];
    let activeRecipe = recipes[0] || null;
    let activeTab = 'ingredients';
    let activeComponentId = null;
    let pendingScrollComponentId = null;

    const recipeListEl = document.getElementById('recipeList');
    const recipeDetailsEl = document.getElementById('recipeDetails');
    const recipeSearchEl = document.getElementById('recipeSearch');

    const formatComponentKind = (kind = '') =>
      kind
        .replace(/_/g, ' ')
        .replace(/\b\w/g, (char) => char.toUpperCase());

    const formatAmount = (item) => {
      if (item.amount == null) {
        return 'As desired';
      }

      const rounded = Number.isInteger(item.amount) ? item.amount : item.amount.toString();
      return [rounded, item.unit].filter(Boolean).join(' ');
    };

    const renderRecipeList = () => {
      if (!filteredRecipes.length) {
        recipeListEl.innerHTML = '<div class="empty-state">No recipes match that search yet.</div>';
        return;
      }

      recipeListEl.innerHTML = filteredRecipes.map((recipe) => {
        const chips = [];
        if (recipe.metadata?.diet?.vegan) chips.push('Vegan');
        if (recipe.metadata?.diet?.gluten_free) chips.push('Gluten-free');
        if (!recipe.metadata?.diet?.contains_dairy) chips.push('Dairy-free');
        return `
          <article class="recipe-card ${recipe.id === activeRecipe?.id ? 'active' : ''}" data-recipe-id="${recipe.id}">
            <h3>${recipe.name}</h3>
            <p>${recipe.metadata?.context || ''}</p>
            <div class="chip-row">
              ${chips.map((chip) => `<span class="chip">${chip}</span>`).join('')}
            </div>
          </article>
        `;
      }).join('');
    };

    const renderIngredients = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No components added yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          ${(component.ingredients || []).map((section) => `
            <div class="ingredient-section">
              <h4>${section.section}</h4>
              <ul class="ingredient-list">
                ${(section.items || []).map((item, itemIndex) => {
                  const hasSubs = item.substitutions && item.substitutions.length;
                  const substitutionsList = hasSubs ? `
                    <button class="sub-toggle" type="button" aria-expanded="false" data-sub-toggle>
                      Substitutions
                      <span class="chevron">⌄</span>
                    </button>
                    <div class="ingredient-substitutions" data-sub-panel hidden>
                      <ul>
                        ${item.substitutions.map((sub) => `
                          <li><strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}</li>
                        `).join('')}
                      </ul>
                    </div>
                  ` : '';

                  return `
                    <li class="ingredient-item ${hasSubs ? 'has-subs' : ''}" data-ingredient-index="${component.id}-${section.section}-${itemIndex}">
                      <div class="ingredient-main">
                        <strong>${item.name}${item.optional ? ' (optional)' : ''}</strong>
                        <div class="ingredient-meta">
                          ${formatAmount(item)}${item.prep ? ` · ${item.prep}` : ''}
                          ${item.notes ? `<br>${item.notes}` : ''}
                        </div>
                      </div>
                      ${substitutionsList}
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </section>
      `;
      }).join('');
    };

    const renderSteps = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No steps documented yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          <div class="steps">
            ${(component.steps || []).map((step) => `
              <article class="step-card">
                <h3>${step.order.toString().padStart(2, '0')} · ${step.title}</h3>
                <ol>
                  ${step.instructions.map((line) => `<li>${line}</li>`).join('')}
                </ol>
              </article>
            `).join('')}
          </div>
        </section>
      `;
      }).join('');
    };

    const buildSubstitutionResults = (recipe, filter = '') => {
      const normalized = filter.trim().toLowerCase();
      const items = (recipe.components || []).flatMap((component) =>
        (component.ingredients || []).flatMap((section) =>
          (section.items || []).map((item) => ({
            componentName: component.name,
            componentId: component.id,
            name: item.name,
            substitutions: item.substitutions || []
          }))
        )
      ).filter((item) => item.substitutions.length);

      const scopedItems = activeComponentId
        ? items.filter((item) => item.componentId === activeComponentId)
        : items;

      const filteredItems = normalized
        ? scopedItems.filter((item) => {
            const haystack = `${item.name} ${item.substitutions.map((s) => `${s.name} ${s.notes || ''}`).join(' ')}`.toLowerCase();
            return haystack.includes(normalized);
          })
        : scopedItems;

      if (!filteredItems.length) {
        return '<div class="empty-state">No substitutions match that search.</div>';
      }

      return filteredItems.map((item) => `
        <article class="substitution-card">
          <h4>${item.name}${item.componentName ? ` · <span class="ingredient-meta">${item.componentName}</span>` : ''}</h4>
          <ul>
            ${item.substitutions.map((sub) => `
              <li>
                <strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}
              </li>
            `).join('')}
          </ul>
        </article>
      `).join('');
    };
    const renderSubstitutions = (recipe) => {
      const summaryEntries = Object.entries(recipe.substitution_summary || {});
      return `
        <div class="substitution-search">
          <label for="substitutionSearch">Look up ingredient swaps</label>
          <input type="search" id="substitutionSearch" placeholder="Try &ldquo;squash&rdquo;, &ldquo;coconut milk&rdquo;, ...">
        </div>
        <div id="substitutionResults" class="substitution-results">
          ${buildSubstitutionResults(recipe)}
        </div>
        ${summaryEntries.length ? `
          <div class="summary-grid">
            ${summaryEntries.map(([key, value]) => `
              <div>
                <span class="chip">${key.replace(/_/g, ' ')}</span>
                <p class="ingredient-meta">${value}</p>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    };

    const renderWorkflow = (recipe) => {
      if (!recipe.workflow?.length) {
        return '<div class="empty-state">No workflow defined for this recipe.</div>';
      }

      const stepLookup = new Map();
      recipe.components?.forEach((component) => {
        component.steps?.forEach((step) => {
          stepLookup.set(`${component.id}-${step.order}`, { component, step });
        });
      });

      return `
        <ol class="workflow-list">
          ${recipe.workflow.map((phase) => `
            <li class="workflow-phase">
              <div class="phase-badge">${phase.order.toString().padStart(2, '0')}</div>
              <div>
                <h3>${phase.label}</h3>
                <ul>
                  ${(phase.items || []).map((item) => {
                    const reference = stepLookup.get(`${item.component}-${item.step}`);
                    const componentName = reference?.component?.name || item.component;
                    const stepTitle = reference?.step?.title ? ` · Step ${reference.step.order}: ${reference.step.title}` : '';
                    return `<li><strong>${componentName}</strong>${stepTitle}</li>`;
                  }).join('')}
                </ul>
              </div>
            </li>
          `).join('')}
        </ol>
      `;
    };

    const renderRecipeDetails = () => {
      if (!activeRecipe) {
        recipeDetailsEl.innerHTML = '<div class="empty-state">Pick a recipe to see the details.</div>';
        recipeDetailsEl.dataset.componentFiltering = 'false';
        pendingScrollComponentId = null;
        return;
      }

      const componentChips = activeRecipe.components?.length
        ? [
            { id: 'all', label: 'All' },
            ...(activeRecipe.components || []).map((component, index) => ({
              id: component.id,
              label: component.name || `Component ${index + 1}`
            }))
          ]
        : [];

      recipeDetailsEl.innerHTML = `
        <div class="detail-header">
          <h2>${activeRecipe.name}</h2>
          <div class="meta-grid">
            <span>Serves ${activeRecipe.servings?.count || '—'}${activeRecipe.servings?.note ? ` (${activeRecipe.servings.note})` : ''}</span>
            ${activeRecipe.metadata?.style ? `<span>${activeRecipe.metadata.style}</span>` : ''}
            ${activeRecipe.metadata?.context ? `<span>${activeRecipe.metadata.context}</span>` : ''}
          </div>
          ${componentChips.length ? `
            <div class="component-filters" aria-label="Focus on a dish">
              ${componentChips.map((chip) => {
                const isActiveSelection = activeComponentId === chip.id || (!activeComponentId && chip.id === 'all');
                return `
                <button
                  class="component-chip"
                  type="button"
                  data-component-chip="${chip.id}"
                  data-active="${isActiveSelection}"
                  aria-pressed="${isActiveSelection}"
                >
                  ${chip.label}
                </button>
              `;
              }).join('')}
            </div>
          ` : ''}
        </div>
        <div class="tabs">
          <button class="tab-button ${activeTab === 'ingredients' ? 'active' : ''}" data-tab="ingredients">Ingredients</button>
          <button class="tab-button ${activeTab === 'instructions' ? 'active' : ''}" data-tab="instructions">Instructions</button>
          <button class="tab-button ${activeTab === 'substitutions' ? 'active' : ''}" data-tab="substitutions">Substitutions</button>
          <button class="tab-button ${activeTab === 'workflow' ? 'active' : ''}" data-tab="workflow">Workflow</button>
        </div>
        <div class="tab-panel ${activeTab === 'ingredients' ? 'active' : ''}" data-panel="ingredients">
          ${renderIngredients(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'instructions' ? 'active' : ''}" data-panel="instructions">
          ${renderSteps(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'substitutions' ? 'active' : ''}" data-panel="substitutions">
          ${renderSubstitutions(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'workflow' ? 'active' : ''}" data-panel="workflow">
          ${renderWorkflow(activeRecipe)}
        </div>
      `;

      recipeDetailsEl.dataset.componentFiltering = activeComponentId ? 'true' : 'false';

      recipeDetailsEl.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', () => {
          activeTab = button.dataset.tab;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-component-chip]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const componentId = chip.dataset.componentChip;
          activeComponentId = componentId === 'all' ? null : componentId;
          pendingScrollComponentId = activeComponentId || null;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-sub-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.nextElementSibling;
          if (!panel) return;
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          panel.hidden = expanded;
          button.closest('.ingredient-item')?.classList.toggle('open', !expanded);
        });
      });

      const substitutionInput = recipeDetailsEl.querySelector('#substitutionSearch');
      if (substitutionInput) {
        substitutionInput.addEventListener('input', (event) => {
          const container = recipeDetailsEl.querySelector('#substitutionResults');
          container.innerHTML = buildSubstitutionResults(activeRecipe, event.target.value);
        });
      }

      if (pendingScrollComponentId) {
        requestAnimationFrame(() => {
          const activePanel = recipeDetailsEl.querySelector('.tab-panel.active');
          const target = activePanel?.querySelector(`[data-component-block="${pendingScrollComponentId}"]`);
          target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        pendingScrollComponentId = null;
      }
    };

    recipeListEl.addEventListener('click', (event) => {
      const card = event.target.closest('[data-recipe-id]');
      if (!card) return;
      const recipe = recipes.find((entry) => entry.id === card.dataset.recipeId);
      if (!recipe) return;
      activeRecipe = recipe;
      activeTab = 'ingredients';
      activeComponentId = null;
      renderRecipeList();
      renderRecipeDetails();
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });

    recipeSearchEl.addEventListener('input', (event) => {
      const query = event.target.value.toLowerCase();
      filteredRecipes = recipes.filter((recipe) => {
        const haystack = [
          recipe.name,
          recipe.metadata?.style,
          recipe.metadata?.context
        ].join(' ').toLowerCase();
        return haystack.includes(query);
      });
      const nextActive = filteredRecipes.includes(activeRecipe) ? activeRecipe : filteredRecipes[0] || null;
      if (activeRecipe !== nextActive) {
        activeRecipe = nextActive;
        activeComponentId = null;
      } else {
        activeRecipe = nextActive;
      }
      renderRecipeList();
      renderRecipeDetails();
    });

    renderRecipeList();
    renderRecipeDetails();
  </script>
</body>
</html>
