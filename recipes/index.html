<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Library | stevemwhite.com</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322110c'/%3E%3Cpath d='M9 21c3.5-3.5 5.6-5.6 7-10 1.4 4.4 3.5 6.5 7 10-2.1 1.4-5 2-7 2s-4.9-.6-7-2z' fill='%23f6a23a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #140906;
      --bg-gradient: radial-gradient(circle at 20% 20%, rgba(255, 196, 125, 0.18), transparent 55%), radial-gradient(circle at 80% 0%, rgba(207, 115, 31, 0.12), transparent 45%), linear-gradient(180deg, #0d0503 0%, #1b0a05 65%, #140906 100%);
      --panel: rgba(42, 18, 11, 0.88);
      --panel-border: rgba(255, 198, 150, 0.24);
      --panel-highlight: rgba(246, 162, 58, 0.18);
      --text: #fff5eb;
      --text-muted: rgba(255, 230, 207, 0.82);
      --accent: #f6a23a;
      --accent-strong: #ff8a3c;
      --chip-bg: rgba(255, 255, 255, 0.05);
      --chip-border: rgba(255, 198, 150, 0.32);
      --tab-border: rgba(255, 180, 120, 0.4);
      color: var(--text);
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      padding: clamp(1.25rem, 3vw, 2.75rem);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      max-width: 100vw;
    }

    main {
      width: min(1200px, 100%);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: grid;
      gap: 0.35rem;
      width: 100%;
    }

    header .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 3.4rem);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      max-width: 70ch;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
    }

    .search-field {
      flex: 1;
      min-width: 260px;
      display: grid;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    input[type="search"] {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--text);
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: rgba(246, 162, 58, 0.7);
      box-shadow: 0 0 0 3px rgba(246, 162, 58, 0.25);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      align-items: start;
    }

    .content-grid.has-active {
      grid-template-columns: minmax(250px, 320px) 1fr;
    }

    .content-grid:not(.has-active) .recipe-index-panel {
      display: none;
    }

    .recipe-browser {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .recipe-browser-card {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .recipe-browser-card:hover {
      background: var(--panel-highlight);
      border-color: rgba(246, 162, 58, 0.4);
    }

    .recipe-browser-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .recipe-browser-card .style-tag {
      margin: 0 0 0.65rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }


    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.35rem;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 100%;
    }

    .panel h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .recipe-index-panel {
      position: sticky;
      top: 1.25rem;
      max-height: calc(100vh - 2.5rem);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow: visible;
      padding-right: 0.5rem;
    }

    .recipe-card {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .recipe-card.active {
      border-color: rgba(246, 162, 58, 0.6);
      background: var(--panel-highlight);
    }

    .recipe-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .recipe-card p {
      margin: 0.3rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }

    .chip {
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--text);
    }

    .component-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }

    .component-chip {
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .component-chip[data-active="true"] {
      border-color: rgba(246, 162, 58, 0.6);
      color: var(--accent);
      background: rgba(246, 162, 58, 0.15);
    }

    .detail-header {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .detail-header h2 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--tab-border);
      margin-bottom: 1rem;
      flex-wrap: wrap;
      overflow-x: visible;
      width: 100%;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
    }

    .tab-button.active {
      color: var(--accent);
    }

    .tab-button.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 3px;
      border-radius: 99px 99px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab-panel.active {
      display: block;
    }

    .component-block {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s ease, opacity 0.2s ease;
      width: 100%;
      max-width: 100%;
    }

    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .component-kind {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .component-header h3 {
      margin: 0.15rem 0 0;
      font-size: 1.1rem;
    }

    .component-pill {
      border-radius: 10px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
      border: 1px solid rgba(246, 162, 58, 0.4);
      color: var(--accent);
      background: rgba(246, 162, 58, 0.1);
      align-self: flex-start;
    }

    .component-block[data-focused="true"] {
      border-color: rgba(246, 162, 58, 0.5);
    }

    [data-component-filtering="true"] .component-block[data-focused="false"] {
      display: none;
    }

    .ingredient-section {
      margin-bottom: 1.4rem;
    }

    .ingredient-section h4 {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ingredient-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .ingredient-item {
      padding: 0.65rem 0.8rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      display: grid;
      gap: 0.55rem;
    }

    .ingredient-item strong {
      display: block;
      font-size: 1rem;
    }

    .ingredient-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .ingredient-main {
      display: grid;
      gap: 0.25rem;
    }

    .sub-toggle {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.35rem 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .sub-toggle .chevron {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .ingredient-item.open .sub-toggle .chevron {
      transform: rotate(180deg);
    }

    .ingredient-substitutions {
      border-left: 2px solid rgba(255, 255, 255, 0.12);
      margin-left: 0.4rem;
      padding-left: 0.8rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .ingredient-substitutions ul {
      margin: 0.4rem 0 0;
      padding-left: 1rem;
    }

    .ingredient-substitutions li {
      margin-bottom: 0.25rem;
    }

    .steps {
      display: grid;
      gap: 1rem;
    }

    .step-card {
      border-radius: 18px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .step-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .step-card ol {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .substitution-search {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .substitution-results {
      display: grid;
      gap: 0.8rem;
    }

    .substitution-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .substitution-card h4 {
      margin: 0 0 0.4rem;
      font-size: 1rem;
    }

    .substitution-card ul {
      margin: 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .summary-grid {
      margin-top: 1.2rem;
      display: grid;
      gap: 0.6rem;
    }

    .summary-grid .chip {
      width: fit-content;
      border-color: rgba(246, 162, 58, 0.4);
      background: rgba(246, 162, 58, 0.1);
      color: var(--text);
    }

    .workflow-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }

    .workflow-phase {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.8rem;
      align-items: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .phase-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(246, 162, 58, 0.15);
      border: 1px solid rgba(246, 162, 58, 0.35);
      display: grid;
      place-items: center;
      font-weight: 600;
      color: var(--accent);
    }

    .workflow-phase h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--text);
    }

    .workflow-phase ul {
      margin: 0.35rem 0 0;
      padding-left: 1.2rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
    }

    .cuisine-label {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }

    .cuisine-group {
      margin-bottom: 1.25rem;
    }

    .cuisine-group ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .back-to-list {
      display: none;
    }

    @media (max-width: 960px) {
      .content-grid.has-active {
        grid-template-columns: 1fr;
      }

      .recipe-list {
        max-height: none;
      }
    }

    @media (max-width: 768px) {
      :root {
        font-size: 15px;
      }

      body {
        padding: 0.6rem;
        display: block;
      }

      main {
        gap: 0.9rem;
        width: 100%;
      }

      header {
        width: 100%;
      }

      header h1 {
        font-size: 1.85rem;
      }

      header p {
        font-size: 0.95rem;
      }

      .controls {
        flex-direction: column;
        width: 100%;
        gap: 0.6rem;
      }

      .search-field {
        width: 100%;
        min-width: 0;
      }

      /* Mobile layout: block, override desktop grid */
      .content-grid,
      .content-grid.has-active {
        display: block;
        width: 100%;
      }

      /* List state (default): show index, hide detail */
      .content-grid:not(.has-active) .recipe-index-panel,
      .content-grid.has-active .recipe-index-panel,
      .recipe-index-panel {
        display: flex;
        position: static;
        max-height: none;
      }
      .recipe-detail-panel {
        display: none;
      }

      /* Detail state: hide index, show detail */
      .content-grid.mobile-detail-active .recipe-index-panel {
        display: none !important;
      }
      .content-grid.mobile-detail-active .recipe-detail-panel {
        display: block !important;
      }

      .back-to-list {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0;
        margin-bottom: 0.75rem;
      }

      .panel {
        padding: 0.85rem;
        border-radius: 18px;
        width: 100%;
      }

      .recipe-list {
        max-height: none;
      }

      .meta-grid {
        flex-direction: column;
        gap: 0.3rem;
      }

      .component-filters {
        margin-top: 0.25rem;
      }

      .component-block {
        padding: 0.75rem;
        border-radius: 16px;
        width: 100%;
      }

      .workflow-phase {
        grid-template-columns: 1fr;
        width: 100%;
      }

      .phase-badge {
        width: 32px;
        height: 32px;
      }

      .recipe-card,
      .tabs {
        width: 100%;
      }

      .tabs {
        gap: 0.35rem;
        padding-bottom: 0.2rem;
      }

      .tab-button {
        padding: 0.5rem 0.65rem;
        font-size: 0.85rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Recipe library</p>
      <h1>Field Notes From the Bonfire Kitchen</h1>
      <p>
        Keep the cabin pantry organized: search what you’ve already perfected and share easy swaps with whoever is cooking next.
      </p>
    </header>

    <section class="controls">
      <div class="search-field">
        <label for="recipeSearch">Search recipes</label>
        <input type="search" id="recipeSearch" placeholder="Try &ldquo;bonfire soup&rdquo; or &ldquo;vegan&rdquo;">
      </div>
    </section>

    <section class="content-grid">
      <aside class="panel recipe-index-panel" aria-label="Recipe index">
        <h2>Recipe index</h2>
        <div id="recipeList" class="recipe-list"></div>
      </aside>

      <section class="panel recipe-detail-panel">
        <button class="back-to-list" id="backToList" aria-label="Back to recipe list">← Recipes</button>
        <div id="recipeDetails"></div>
      </section>
    </section>
  </main>

  <script src="recipes-data.js"></script>
  <script>

    let recipes = [...defaultRecipes];
    let filteredRecipes = [...recipes];
    let activeRecipe = null;
    let activeTab = 'ingredients';
    let activeComponentId = null;
    let pendingScrollComponentId = null;

    const recipeListEl = document.getElementById('recipeList');
    const recipeDetailsEl = document.getElementById('recipeDetails');
    const recipeSearchEl = document.getElementById('recipeSearch');
    const contentGridEl = document.querySelector('.content-grid');

    const formatComponentKind = (kind = '') =>
      kind
        .replace(/_/g, ' ')
        .replace(/\b\w/g, (char) => char.toUpperCase());

    const formatAmount = (item) => {
      if (item.amount == null) {
        return 'As desired';
      }

      const rounded = Number.isInteger(item.amount) ? item.amount : item.amount.toString();
      return [rounded, item.unit].filter(Boolean).join(' ');
    };

    const matchesSearchQuery = (recipe, normalizedQuery = '') => {
      if (!normalizedQuery) return true;
      const haystack = [
        recipe.name || '',
        recipe.metadata?.style || '',
        recipe.metadata?.context || ''
      ].join(' ').toLowerCase();
      return haystack.includes(normalizedQuery);
    };

    const applySearchFilter = (queryText = recipeSearchEl?.value || '') => {
      const normalizedQuery = (queryText || '').toLowerCase();
      filteredRecipes = normalizedQuery
        ? recipes.filter((recipe) => matchesSearchQuery(recipe, normalizedQuery))
        : [...recipes];
      return filteredRecipes;
    };

    const groupRecipesByCuisine = (recipeList) => {
      const map = {};
      for (const recipe of recipeList) {
        const cuisine = recipe.cuisine || 'Other';
        if (!map[cuisine]) map[cuisine] = [];
        map[cuisine].push(recipe);
      }
      return Object.keys(map)
        .sort((a, b) => {
          if (a === 'Sides') return 1;
          if (b === 'Sides') return -1;
          return a.localeCompare(b);
        })
        .map((cuisine) => ({ cuisine, recipes: map[cuisine] }));
    };

    const refreshRecipeViews = ({ highlightId } = {}) => {
      const previousActiveId = activeRecipe?.id;
      applySearchFilter();

      if (highlightId) {
        const highlighted =
          filteredRecipes.find((recipe) => recipe.id === highlightId) ||
          recipes.find((recipe) => recipe.id === highlightId);
        if (highlighted) {
          activeRecipe = highlighted;
        }
      }

      if (activeRecipe) {
        const stillVisible = filteredRecipes.some((recipe) => recipe.id === activeRecipe.id);
        if (!stillVisible) {
          activeRecipe = null;
        }
      }

      if (activeRecipe?.id !== previousActiveId) {
        activeComponentId = null;
        activeTab = 'ingredients';
      }

      renderRecipeList();
      renderRecipeDetails();

      if (highlightId && activeRecipe?.id === highlightId) {
        pendingScrollComponentId = null;
      }
    };

    const selectRecipe = (recipeId, { scrollToCard = true, updateHash = true } = {}) => {
      const recipe = recipes.find((entry) => entry.id === recipeId);
      if (!recipe) return;
      activeRecipe = recipe;
      activeTab = 'ingredients';
      activeComponentId = null;
      if (updateHash) {
        history.replaceState(null, '', `#${recipeId}`);
      }
      renderRecipeList();
      renderRecipeDetails();
      contentGridEl?.classList.add('mobile-detail-active');
      if (scrollToCard) {
        const targetCard = recipeListEl?.querySelector(`[data-recipe-id="${recipeId}"]`);
        targetCard?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    };

    const renderRecipeList = () => {
      if (!recipeListEl) return;

      if (!filteredRecipes.length) {
        recipeListEl.innerHTML = '<div class="empty-state">No recipes match that search yet.</div>';
        return;
      }

      const recipeCard = (recipe) => {
        const chips = [];
        if (recipe.metadata?.diet?.vegan) chips.push('Vegan');
        if (recipe.metadata?.diet?.gluten_free) chips.push('Gluten-free');
        if (!recipe.metadata?.diet?.contains_dairy) chips.push('Dairy-free');
        return `<li>
          <article class="recipe-card ${recipe.id === activeRecipe?.id ? 'active' : ''}" data-recipe-id="${recipe.id}">
            <h3>${recipe.name}</h3>
            ${chips.length ? `<div class="chip-row">${chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>` : ''}
          </article>
        </li>`;
      };

      recipeListEl.innerHTML = groupRecipesByCuisine(filteredRecipes).map(({ cuisine, recipes: group }) => `
        <section class="cuisine-group">
          <h3 class="cuisine-label">${cuisine}</h3>
          <ul>${group.map(recipeCard).join('')}</ul>
        </section>
      `).join('');
    };

    const renderIngredients = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No components added yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          ${(component.ingredients || []).map((section) => `
            <div class="ingredient-section">
              <h4>${section.section}</h4>
              <ul class="ingredient-list">
                ${(section.items || []).map((item, itemIndex) => {
                  const hasSubs = item.substitutions && item.substitutions.length;
                  const substitutionsList = hasSubs ? `
                    <button class="sub-toggle" type="button" aria-expanded="false" data-sub-toggle>
                      Substitutions
                      <span class="chevron">⌄</span>
                    </button>
                    <div class="ingredient-substitutions" data-sub-panel hidden>
                      <ul>
                        ${item.substitutions.map((sub) => `
                          <li><strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}</li>
                        `).join('')}
                      </ul>
                    </div>
                  ` : '';

                  return `
                    <li class="ingredient-item ${hasSubs ? 'has-subs' : ''}" data-ingredient-index="${component.id}-${section.section}-${itemIndex}">
                      <div class="ingredient-main">
                        <strong>${item.name}${item.optional ? ' (optional)' : ''}</strong>
                        <div class="ingredient-meta">
                          ${formatAmount(item)}${item.prep ? ` · ${item.prep}` : ''}
                          ${item.notes ? `<br>${item.notes}` : ''}
                        </div>
                      </div>
                      ${substitutionsList}
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>
          `).join('')}
        </section>
      `;
      }).join('');
    };

    const renderSteps = (recipe) => {
      if (!recipe.components?.length) {
        return '<div class="empty-state">No steps documented yet.</div>';
      }

      return recipe.components.map((component, componentIndex) => {
        const isFocused = !activeComponentId || activeComponentId === component.id;
        const isActive = activeComponentId === component.id;

        return `
        <section class="component-block" data-component-block="${component.id}" data-focused="${isFocused}">
          <div class="component-header">
            <div>
              ${component.kind ? `<p class="component-kind">${formatComponentKind(component.kind)}</p>` : ''}
              <h3>${component.name || `Component ${componentIndex + 1}`}</h3>
            </div>
            ${isActive ? '<span class="component-pill">Active</span>' : ''}
          </div>
          <div class="steps">
            ${(component.steps || []).map((step) => `
              <article class="step-card">
                <h3>${step.order.toString().padStart(2, '0')} · ${step.title}</h3>
                <ol>
                  ${step.instructions.map((line) => `<li>${line}</li>`).join('')}
                </ol>
              </article>
            `).join('')}
          </div>
        </section>
      `;
      }).join('');
    };

    const buildSubstitutionResults = (recipe, filter = '') => {
      const normalized = filter.trim().toLowerCase();
      const items = (recipe.components || []).flatMap((component) =>
        (component.ingredients || []).flatMap((section) =>
          (section.items || []).map((item) => ({
            componentName: component.name,
            componentId: component.id,
            name: item.name,
            substitutions: item.substitutions || []
          }))
        )
      ).filter((item) => item.substitutions.length);

      const scopedItems = activeComponentId
        ? items.filter((item) => item.componentId === activeComponentId)
        : items;

      const filteredItems = normalized
        ? scopedItems.filter((item) => {
            const haystack = `${item.name} ${item.substitutions.map((s) => `${s.name} ${s.notes || ''}`).join(' ')}`.toLowerCase();
            return haystack.includes(normalized);
          })
        : scopedItems;

      if (!filteredItems.length) {
        return '<div class="empty-state">No substitutions match that search.</div>';
      }

      return filteredItems.map((item) => `
        <article class="substitution-card">
          <h4>${item.name}${item.componentName ? ` · <span class="ingredient-meta">${item.componentName}</span>` : ''}</h4>
          <ul>
            ${item.substitutions.map((sub) => `
              <li>
                <strong>${sub.name}</strong>${sub.ratio ? ` · ${sub.ratio}` : ''}${sub.notes ? ` — ${sub.notes}` : ''}
              </li>
            `).join('')}
          </ul>
        </article>
      `).join('');
    };
    const renderSubstitutions = (recipe) => {
      const summaryEntries = Object.entries(recipe.substitution_summary || {});
      return `
        <div class="substitution-search">
          <label for="substitutionSearch">Look up ingredient swaps</label>
          <input type="search" id="substitutionSearch" placeholder="Try &ldquo;squash&rdquo;, &ldquo;coconut milk&rdquo;, ...">
        </div>
        <div id="substitutionResults" class="substitution-results">
          ${buildSubstitutionResults(recipe)}
        </div>
        ${summaryEntries.length ? `
          <div class="summary-grid">
            ${summaryEntries.map(([key, value]) => `
              <div>
                <span class="chip">${key.replace(/_/g, ' ')}</span>
                <p class="ingredient-meta">${value}</p>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    };

    const renderWorkflow = (recipe) => {
      if (!Array.isArray(recipe.workflow) || !recipe.workflow.length) {
        return '<div class="empty-state">No workflow defined for this recipe.</div>';
      }

      const stepLookup = new Map();
      (recipe.components || []).forEach((component = {}) => {
        const safeSteps = Array.isArray(component.steps) ? component.steps.filter(Boolean) : [];
        safeSteps.forEach((step, index) => {
          const stepOrder = Number.isFinite(step?.order) ? step.order : index + 1;
          const key = `${component.id}-${stepOrder}`;
          stepLookup.set(key, {
            component,
            step: {
              ...step,
              order: stepOrder,
              title: step?.title || `Step ${stepOrder}`
            }
          });
        });
      });

      const workflowMarkup = recipe.workflow
        .map((phase, phaseIndex) => {
          if (!phase) return '';
          const phaseOrder = Number.isFinite(phase.order) ? phase.order : phaseIndex + 1;
          const phaseItems = Array.isArray(phase.items) ? phase.items.filter(Boolean) : [];
          return `
            <li class="workflow-phase">
              <div class="phase-badge">${phaseOrder.toString().padStart(2, '0')}</div>
              <div>
                <h3>${phase.label || `Phase ${phaseOrder}`}</h3>
                ${
                  phaseItems.length
                    ? `
                        <ul>
                          ${phaseItems
                            .map((item, taskIndex) => {
                              const lookupKey = `${item.component}-${item.step}`;
                              const reference = stepLookup.get(lookupKey);
                              const componentName =
                                reference?.component?.name ||
                                item.component ||
                                '';
                              let detail = '';
                              if (reference?.step) {
                                detail = ` · Step ${reference.step.order
                                  .toString()
                                  .padStart(2, '0')}: ${reference.step.title}`;
                              } else if (item.step) {
                                detail = ` · Step ${item.step}`;
                              }
                              const descriptionText = item.description ? item.description.trim() : '';
                              if (componentName) {
                                return `<li><strong>${componentName}</strong>${
                                  detail || (descriptionText ? ` · ${descriptionText}` : '')
                                }</li>`;
                              }
                              const fallbackLabel =
                                descriptionText ||
                                (detail ? detail.replace(/^ · /, '') : '') ||
                                `Task ${taskIndex + 1}`;
                              return `<li>${fallbackLabel}</li>`;
                            })
                            .join('')}
                        </ul>
                      `
                    : '<p class="empty-state">Add items to this workflow phase.</p>'
                }
              </div>
            </li>
          `;
        })
        .filter(Boolean)
        .join('');

      return `
        <ol class="workflow-list">
          ${workflowMarkup || '<li class="workflow-phase"><div class="empty-state">No workflow steps documented yet.</div></li>'}
        </ol>
      `;
    };

    const updateRecipeActionState = () => {
      if (activeRecipe) {
        contentGridEl?.classList.add('has-active');
      } else {
        contentGridEl?.classList.remove('has-active');
      }
    };

    const renderRecipeDetails = () => {
      if (!activeRecipe) {
        recipeDetailsEl.dataset.componentFiltering = 'false';
        pendingScrollComponentId = null;
        updateRecipeActionState();
        const chips = (recipe) => {
          const tags = [];
          if (recipe.metadata?.diet?.vegan) tags.push('Vegan');
          if (recipe.metadata?.diet?.vegetarian && !recipe.metadata?.diet?.vegan) tags.push('Vegetarian');
          if (recipe.metadata?.diet?.gluten_free) tags.push('Gluten-free');
          if (!recipe.metadata?.diet?.contains_dairy) tags.push('Dairy-free');
          return tags.map((t) => `<span class="chip">${t}</span>`).join('');
        };
        recipeDetailsEl.innerHTML = filteredRecipes.length
          ? `<div class="recipe-browser">${filteredRecipes.map((recipe) => `
              <article class="recipe-browser-card" data-recipe-id="${recipe.id}">
                <h3>${recipe.name}</h3>
                ${recipe.metadata?.style ? `<p class="style-tag">${recipe.metadata.style}</p>` : ''}
                <div class="chip-row">${chips(recipe)}</div>
              </article>`).join('')}</div>`
          : '<div class="empty-state">No recipes match that search.</div>';
        return;
      }

      const componentChips = activeRecipe.components?.length
        ? [
            { id: 'all', label: 'All' },
            ...(activeRecipe.components || []).map((component, index) => ({
              id: component.id,
              label: component.name || `Component ${index + 1}`
            }))
          ]
        : [];

      recipeDetailsEl.innerHTML = `
        <div class="detail-header">
          <h2>${activeRecipe.name}</h2>
          <div class="meta-grid">
            <span>Serves ${activeRecipe.servings?.count || '—'}${activeRecipe.servings?.note ? ` (${activeRecipe.servings.note})` : ''}</span>
            ${activeRecipe.metadata?.style ? `<span>${activeRecipe.metadata.style}</span>` : ''}
            ${activeRecipe.metadata?.context ? `<span>${activeRecipe.metadata.context}</span>` : ''}
          </div>
          ${componentChips.length ? `
            <div class="component-filters" aria-label="Focus on a dish">
              ${componentChips.map((chip) => {
                const isActiveSelection = activeComponentId === chip.id || (!activeComponentId && chip.id === 'all');
                return `
                <button
                  class="component-chip"
                  type="button"
                  data-component-chip="${chip.id}"
                  data-active="${isActiveSelection}"
                  aria-pressed="${isActiveSelection}"
                >
                  ${chip.label}
                </button>
              `;
              }).join('')}
            </div>
          ` : ''}
        </div>
        <div class="tabs">
          <button class="tab-button ${activeTab === 'ingredients' ? 'active' : ''}" data-tab="ingredients">Ingredients</button>
          <button class="tab-button ${activeTab === 'instructions' ? 'active' : ''}" data-tab="instructions">Instructions</button>
          <button class="tab-button ${activeTab === 'substitutions' ? 'active' : ''}" data-tab="substitutions">Substitutions</button>
          <button class="tab-button ${activeTab === 'workflow' ? 'active' : ''}" data-tab="workflow">Workflow</button>
        </div>
        <div class="tab-panel ${activeTab === 'ingredients' ? 'active' : ''}" data-panel="ingredients">
          ${renderIngredients(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'instructions' ? 'active' : ''}" data-panel="instructions">
          ${renderSteps(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'substitutions' ? 'active' : ''}" data-panel="substitutions">
          ${renderSubstitutions(activeRecipe)}
        </div>
        <div class="tab-panel ${activeTab === 'workflow' ? 'active' : ''}" data-panel="workflow">
          ${renderWorkflow(activeRecipe)}
        </div>
      `;

      recipeDetailsEl.dataset.componentFiltering = activeComponentId ? 'true' : 'false';

      recipeDetailsEl.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', () => {
          activeTab = button.dataset.tab;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-component-chip]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const componentId = chip.dataset.componentChip;
          activeComponentId = componentId === 'all' ? null : componentId;
          pendingScrollComponentId = activeComponentId || null;
          renderRecipeDetails();
        });
      });

      recipeDetailsEl.querySelectorAll('[data-sub-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.nextElementSibling;
          if (!panel) return;
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          panel.hidden = expanded;
          button.closest('.ingredient-item')?.classList.toggle('open', !expanded);
        });
      });

      const substitutionInput = recipeDetailsEl.querySelector('#substitutionSearch');
      if (substitutionInput) {
        substitutionInput.addEventListener('input', (event) => {
          const container = recipeDetailsEl.querySelector('#substitutionResults');
          container.innerHTML = buildSubstitutionResults(activeRecipe, event.target.value);
        });
      }

      if (pendingScrollComponentId) {
        requestAnimationFrame(() => {
          const activePanel = recipeDetailsEl.querySelector('.tab-panel.active');
          const target = activePanel?.querySelector(`[data-component-block="${pendingScrollComponentId}"]`);
          target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        pendingScrollComponentId = null;
      }
      updateRecipeActionState();
    };

    recipeDetailsEl.addEventListener('click', (event) => {
      const card = event.target.closest('.recipe-browser-card[data-recipe-id]');
      if (!card) return;
      selectRecipe(card.dataset.recipeId);
    });

    recipeListEl.addEventListener('click', (event) => {
      const card = event.target.closest('[data-recipe-id]');
      if (!card) return;
      selectRecipe(card.dataset.recipeId);
    });

    document.getElementById('backToList')?.addEventListener('click', () => {
      contentGridEl?.classList.remove('mobile-detail-active');
    });

    recipeSearchEl.addEventListener('input', () => {
      refreshRecipeViews();
    });

    refreshRecipeViews();

    const initialHash = window.location.hash.slice(1);
    if (initialHash) {
      selectRecipe(initialHash, { scrollToCard: true, updateHash: false });
    }

    window.addEventListener('hashchange', () => {
      const id = window.location.hash.slice(1);
      if (id) selectRecipe(id, { scrollToCard: true, updateHash: false });
    });
  </script>
</body>
</html>
