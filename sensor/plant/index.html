<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plant Sensors</title>
    <meta name="description" content="Live plant sensor readings from Adafruit IO." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #0f172a;
            --muted: rgba(15, 23, 42, 0.7);
            --panel: rgba(255, 255, 255, 0.78);
            --panel-strong: rgba(255, 255, 255, 0.94);
            --shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
            --accent: #16a34a;
            --accent-soft: rgba(22, 163, 74, 0.15);
            --warn: #f97316;
            --cool: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 20% 20%, rgba(22, 163, 74, 0.25), transparent 45%),
                radial-gradient(circle at 80% 10%, rgba(14, 165, 233, 0.2), transparent 40%),
                linear-gradient(160deg, #ecfccb 0%, #e0f2fe 45%, #f0fdf4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(2rem, 4vw, 4rem) 1.5rem;
        }

        .page {
            width: min(1100px, 100%);
            background: var(--panel);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: clamp(1.5rem, 3vw, 3rem);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            display: grid;
            gap: clamp(1.5rem, 2.5vw, 2.5rem);
            position: relative;
            overflow: hidden;
        }

        .page::before {
            content: '';
            position: absolute;
            inset: -40% auto auto -10%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(22, 163, 74, 0.22), transparent 70%);
            z-index: 0;
        }

        .page::after {
            content: '';
            position: absolute;
            inset: auto -15% -30% auto;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.18), transparent 70%);
            z-index: 0;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 1;
        }

        .title-block h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.2rem, 3.5vw, 3rem);
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .title-block p {
            color: var(--muted);
            max-width: 32rem;
        }

        .refresh {
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.6rem;
            background: var(--accent);
            color: #f8fafc;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(22, 163, 74, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .refresh:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px rgba(22, 163, 74, 0.35);
        }

        .refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            color: var(--muted);
            background: var(--panel-strong);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .grid {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            position: relative;
            z-index: 1;
        }

        .metric-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.4rem;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
            display: grid;
            gap: 0.9rem;
            position: relative;
            overflow: hidden;
            animation: rise 0.5s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        .metric-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(22, 163, 74, 0.08), transparent 55%);
            opacity: 0.9;
            pointer-events: none;
        }

        .metric-card__top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: rgba(15, 23, 42, 0.08);
            color: var(--ink);
            text-transform: uppercase;
        }

        .metric-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .metric-unit {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
        }

        .metric-status {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .metric-status span {
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.75rem;
            background: rgba(22, 163, 74, 0.12);
            color: var(--accent);
        }

        .metric-card--alert .metric-status span {
            background: rgba(249, 115, 22, 0.15);
            color: var(--warn);
        }

        .metric-card--cool .metric-status span {
            background: rgba(14, 165, 233, 0.15);
            color: var(--cool);
        }

        .panel {
            background: #ffffff;
            border-radius: 24px;
            padding: clamp(1.2rem, 2vw, 2rem);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            display: grid;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        .panel h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
        }

        .panel p {
            color: var(--muted);
        }

        .chart-wrap {
            height: 320px;
        }

        .summary-row {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .summary-card {
            background: rgba(15, 23, 42, 0.04);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            display: grid;
            gap: 0.4rem;
        }

        .summary-card h3 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(15, 23, 42, 0.6);
        }

        .summary-card strong {
            font-size: 1.4rem;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            header {
                align-items: flex-start;
            }

            .refresh {
                width: 100%;
            }

            .status {
                width: 100%;
                justify-content: center;
            }

            .chart-wrap {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <div class="title-block">
                <h1>Plant Sensor Deck</h1>
                <p>Live health check for the plant corner. Data comes from Adafruit IO feeds.</p>
            </div>
            <button class="refresh" id="refresh" type="button">Refresh data</button>
            <div class="status" id="status"><span class="dot"></span><span>Loading readings...</span></div>
        </header>

        <section class="grid" id="cards" aria-live="polite"></section>

        <section class="panel">
            <div>
                <h2 id="trend-title">Moisture trend</h2>
                <p id="trend-summary">Loading history...</p>
            </div>
            <div class="chart-wrap">
                <canvas id="trend-chart" aria-label="Sensor history chart"></canvas>
            </div>
            <div class="summary-row" id="trend-stats"></div>
        </section>
    </main>

    <script>
        const USERNAME = 'sblackt';
        const DATA_LIMIT = 1;
        const HISTORY_LIMIT = 240;

        const FEEDS = [
            {
                id: 'plant.temperature',
                name: 'Air temperature',
                unit: 'deg C',
                color: '#f97316',
                goodRange: [19, 26],
                icon: 'TMP',
                format: value => value.toFixed(1)
            },
            {
                id: 'plant.humidity',
                name: 'Humidity',
                unit: '%',
                color: '#0ea5e9',
                goodRange: [40, 70],
                icon: 'RH',
                format: value => value.toFixed(0)
            },
            {
                id: 'plant.moisture',
                name: 'Soil moisture',
                unit: '%',
                color: '#16a34a',
                goodRange: [30, 60],
                icon: 'H2O',
                primary: true,
                format: value => value.toFixed(0)
            },
            {
                id: 'plant.light',
                name: 'Light',
                unit: 'lx',
                color: '#eab308',
                preferHigher: true,
                icon: 'LUX',
                format: value => value.toFixed(0)
            }
        ];

        const dom = {
            status: document.getElementById('status'),
            refresh: document.getElementById('refresh'),
            cards: document.getElementById('cards'),
            trendTitle: document.getElementById('trend-title'),
            trendSummary: document.getElementById('trend-summary'),
            trendChart: document.getElementById('trend-chart'),
            trendStats: document.getElementById('trend-stats')
        };

        let chart = null;

        init();

        function init() {
            dom.refresh.addEventListener('click', refreshAll);
            refreshAll();
        }

        async function refreshAll() {
            setLoading(true);
            try {
                const data = await Promise.all(FEEDS.map(fetchLatest));
                renderCards(data);
                updateStatus('Updated ' + formatRelative(new Date()));
                const primary = FEEDS.find(feed => feed.primary) || FEEDS[0];
                if (primary) {
                    await updateTrend(primary);
                }
            } catch (error) {
                updateStatus('Unable to load data');
                console.warn(error);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            dom.refresh.disabled = isLoading;
        }

        async function fetchLatest(feed) {
            const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(USERNAME)}/feeds/${encodeURIComponent(feed.id)}/data?limit=${DATA_LIMIT}`;
            const response = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!response.ok) {
                throw new Error(`Failed to load ${feed.id}`);
            }
            const raw = await response.json();
            const latest = Array.isArray(raw) ? raw[0] : null;
            const value = latest ? Number.parseFloat(latest.value) : null;
            return {
                feed,
                value: Number.isFinite(value) ? value : null,
                timestamp: latest?.created_at ? new Date(latest.created_at) : null
            };
        }

        async function fetchHistory(feed, limit = HISTORY_LIMIT) {
            const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(USERNAME)}/feeds/${encodeURIComponent(feed.id)}/data?limit=${limit}`;
            const response = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!response.ok) {
                throw new Error(`Failed to load history for ${feed.id}`);
            }
            const raw = await response.json();
            if (!Array.isArray(raw)) {
                return [];
            }
            return raw
                .map(entry => {
                    const value = Number.parseFloat(entry.value);
                    const timestamp = entry.created_at ? new Date(entry.created_at) : null;
                    if (!Number.isFinite(value) || !timestamp) {
                        return null;
                    }
                    return { value, timestamp };
                })
                .filter(Boolean)
                .reverse();
        }

        function renderCards(data) {
            dom.cards.innerHTML = '';
            data.forEach((entry, index) => {
                const { feed, value, timestamp } = entry;
                const state = evaluateFeed(feed, value);
                const card = document.createElement('article');
                card.className = `metric-card metric-card--${state.tone}`;
                card.style.setProperty('--delay', `${index * 0.06}s`);
                card.style.animationDelay = `${index * 0.06}s`;

                const valueLabel = value == null ? '--' : feed.format ? feed.format(value) : value;

                card.innerHTML = `
                    <div class="metric-card__top">
                        <div>
                            <div class="metric-title">${feed.name}</div>
                        </div>
                        <div class="metric-icon" style="background:${feed.color}22; color:${feed.color}">${feed.icon}</div>
                    </div>
                    <div class="metric-value">${valueLabel} <span class="metric-unit">${feed.unit || ''}</span></div>
                    <div class="metric-status">
                        <span>${state.label}</span>
                        <span>${timestamp ? formatRelative(timestamp) : 'No time'}</span>
                    </div>
                `;

                dom.cards.appendChild(card);
            });
        }

        function evaluateFeed(feed, value) {
            if (!Number.isFinite(value)) {
                return { tone: 'alert', label: 'No data' };
            }
            if (Array.isArray(feed.goodRange) && feed.goodRange.length === 2) {
                if (value < feed.goodRange[0]) {
                    return { tone: 'cool', label: 'Low' };
                }
                if (value > feed.goodRange[1]) {
                    return { tone: 'alert', label: 'High' };
                }
                return { tone: 'ok', label: 'In range' };
            }
            if (feed.preferHigher) {
                return { tone: value < 1 ? 'cool' : 'ok', label: value < 1 ? 'Dim' : 'Bright' };
            }
            return { tone: 'ok', label: 'Reading' };
        }

        async function updateTrend(feed) {
            dom.trendTitle.textContent = `${feed.name} trend`;
            dom.trendSummary.textContent = 'Loading history...';
            dom.trendStats.innerHTML = '';

            try {
                const history = await fetchHistory(feed);
                if (!history.length) {
                    dom.trendSummary.textContent = 'No history available.';
                    renderStats([]);
                    resetChart();
                    return;
                }

                const values = history.map(point => point.value);
                const min = Math.min(...values);
                const max = Math.max(...values);
                const latest = history[history.length - 1];
                const earliest = history[0];
                const delta = latest.value - earliest.value;

                dom.trendSummary.textContent = `Range ${formatNumber(min, feed)} to ${formatNumber(max, feed)} ${feed.unit} | Delta ${formatNumber(delta, feed)} ${feed.unit}`;
                renderStats([
                    { label: 'Latest', value: `${formatNumber(latest.value, feed)} ${feed.unit}` },
                    { label: 'Min', value: `${formatNumber(min, feed)} ${feed.unit}` },
                    { label: 'Max', value: `${formatNumber(max, feed)} ${feed.unit}` },
                    { label: 'Window', value: `${formatWindow(earliest.timestamp, latest.timestamp)}` }
                ]);
                renderChart(feed, history);
            } catch (error) {
                dom.trendSummary.textContent = 'Unable to load history.';
                resetChart();
                console.warn(error);
            }
        }

        function renderStats(items) {
            dom.trendStats.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'summary-card';
                card.innerHTML = `<h3>${item.label}</h3><strong>${item.value}</strong>`;
                dom.trendStats.appendChild(card);
            });
        }

        function renderChart(feed, history) {
            const ctx = dom.trendChart.getContext('2d');
            const dataset = history.map(point => ({ x: point.timestamp, y: point.value }));

            if (!chart) {
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: [
                            {
                                label: feed.name,
                                data: dataset,
                                borderColor: feed.color,
                                backgroundColor: `${feed.color}33`,
                                fill: true,
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'hour'
                                },
                                grid: {
                                    display: false
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(15, 23, 42, 0.08)'
                                },
                                ticks: {
                                    callback: value => `${value}`
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: context => `${context.parsed.y} ${feed.unit}`
                                }
                            }
                        }
                    }
                });
            } else {
                chart.data.datasets[0].label = feed.name;
                chart.data.datasets[0].data = dataset;
                chart.data.datasets[0].borderColor = feed.color;
                chart.data.datasets[0].backgroundColor = `${feed.color}33`;
                chart.update('none');
            }
        }

        function resetChart() {
            if (chart) {
                chart.destroy();
                chart = null;
            }
        }

        function updateStatus(message) {
            dom.status.querySelector('span:last-child').textContent = message;
        }

        function formatRelative(date) {
            const diffMs = Date.now() - date.getTime();
            const diffMin = Math.round(diffMs / 60000);
            if (diffMin < 1) {
                return 'Just now';
            }
            if (diffMin < 60) {
                return `${diffMin}m ago`;
            }
            const diffHr = Math.round(diffMin / 60);
            if (diffHr < 24) {
                return `${diffHr}h ago`;
            }
            const diffDay = Math.round(diffHr / 24);
            return `${diffDay}d ago`;
        }

        function formatWindow(start, end) {
            const diffMs = end.getTime() - start.getTime();
            const diffHr = Math.round(diffMs / 3600000);
            if (diffHr < 24) {
                return `${diffHr} hours`;
            }
            const diffDay = Math.round(diffHr / 24);
            return `${diffDay} days`;
        }

        function formatNumber(value, feed) {
            if (!Number.isFinite(value)) {
                return '--';
            }
            return feed.format ? feed.format(value) : value.toFixed(1);
        }
    </script>
</body>
</html>
