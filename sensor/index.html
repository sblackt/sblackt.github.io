                : `Pressure is ${direction} ${descriptor} over the sampled window.`;
            const meta = direction === 'falling'
                ? 'Falling pressure can precede stormy outdoor weather.'
                : direction === 'rising'
                    ? 'Rising pressure usually signals clearing conditions.'
                    : 'Expect a calm, consistent feel indoors.';
            return {
                id: `${feed.id}-trend`,
                label: 'Pressure trend',
                value: `${delta >= 0 ? '+' : ''}${formatNumber(delta)}${unitLabel}`,
                summary,
                meta
            };
        }

        function buildAirInsight(feed) {
            if (!feed || !Array.isArray(feed.data) || !feed.data.length) {
                return null;
            }
            const latest = feed.data[0];
            if (!latest || !Number.isFinite(latest.value)) {
                return null;
            }
            const values = feed.data
                .map(entry => entry.value)
                .filter(value => Number.isFinite(value))
                .sort((a, b) => a - b);
            if (!values.length) {
                return null;
            }
            const median = values[Math.floor(values.length / 2)];
            const delta = latest.value - median;
            const interpreter = typeof feed.interpret === 'function' ? feed.interpret(latest.value) : null;
            const label = interpreter?.label || (latest.value >= 200 ? 'Fresh' : latest.value >= 120 ? 'Normal' : 'Stuffy');
            const advice = interpreter?.advice || (latest.value >= 200 ? 'Air is crisp and ventilated.' : latest.value >= 120 ? 'Comfortable baseline.' : 'Consider airing out the room.');
            const meta = Math.abs(delta) < 8
                ? 'Holding close to the typical daily baseline.'
                : delta > 0
                    ? 'Improved compared with today’s median.'
                    : 'More stagnant than today’s baseline.';
            return {
                id: `${feed.id}-air`,
                label: 'Air quality',
                value: `${formatNumber(latest.value)}${feed.unit ? ` ${feed.unit}` : ''}`,
                summary: `${label} · ${advice}`,
                meta
            };
        }

        function buildOutdoorWeatherInsight(weather) {
            if (!weather) {
                return null;
            }
            const unitLabel = '°C';
            const humidityLabel = Number.isFinite(weather.humidity) ? `${formatNumber(weather.humidity)}%` : '—';
            const dewLabel = Number.isFinite(weather.dewPoint) ? `${formatNumber(weather.dewPoint)} ${unitLabel}` : 'n/a';
            const summary = `Outdoor ${formatNumber(weather.temperature)} ${unitLabel} · RH ${humidityLabel} · Dew ${dewLabel}`;
            const meta = weather.fetchedAt
                ? `Synced ${formatDateTime(weather.fetchedAt)} from ${weather.source || 'weather service'}`
                : weather.source || '';
            return {
                id: 'outdoor-weather',
                label: weather.location || 'Outdoor conditions',
                value: `${formatNumber(weather.temperature)} ${unitLabel}`,
                summary,
                meta,
                priority: 4,
                variant: 'weather',
                icon: '🌤️'
            };
        }

        function buildBurnPlaybookReport(analysis, feed, weather) {
            if (!analysis || !feed) {
                return null;
            }
            const unitLabel = feed.unit || '°C';
            const now = new Date();
            const nextAnchor = findNextFireAnchor(now);
            const strings = [];
            if (analysis.avgHoldHours) {
                strings.push(`Large fires hold ${formatDuration(analysis.avgHoldHours * 3600000)} before drifting to ${analysis.targetTemp ?? 18}°.`);
            }
            if (analysis.recentCoolingRate) {
                strings.push(`Current cooling pace is ${formatNumber(analysis.recentCoolingRate)}${unitLabel}/hr.`);
            }
            if (nextAnchor) {
                strings.push(`Plan to feed the box before ${nextAnchor.label.toLowerCase()} (${formatTime(nextAnchor.timestamp)}) so ducts stay warm.`);
            }
            const points = [];
            if (analysis.avgRise) {
                points.push({ label: 'Average boost', detail: `${formatNumber(analysis.avgRise)}${unitLabel}` });
            }
            if (analysis.avgIntervalHours) {
                points.push({ label: 'Spacing target', detail: `${formatNumber(analysis.avgIntervalHours)} hours` });
            }
            if (analysis.firesPerDay) {
                points.push({ label: 'Fires/day', detail: `${formatNumber(analysis.firesPerDay)}` });
            }
            return {
                id: 'burn-playbook',
                label: 'Plan the next fires',
                summary: strings.join(' '),
                points,
                footer: weather?.temperature ? `Outdoor ${formatNumber(weather.temperature)}${unitLabel} influencing the drop.` : '',
                priority: 1,
                variant: 'fire'
            };
        }

        function buildFuelEfficiencySummary(analysis, feed) {
            if (!analysis || !feed) {
                return null;
            }
            const points = [];
            if (analysis.avgHoldHours) {
                points.push({ label: 'Hold to comfort', detail: formatDuration(analysis.avgHoldHours * 3600000) });
            }
            if (analysis.avgCoolingRate) {
                points.push({ label: 'Cooling slope', detail: `${formatNumber(analysis.avgCoolingRate)}${feed.unit || '°C'}/hr` });
            }
            if (analysis.events.length) {
                const bigBurn = analysis.events.reduce((max, event) => event.rise > max.rise ? event : max, analysis.events[0]);
                points.push({ label: 'Best burn', detail: `${formatNumber(bigBurn.rise)}${feed.unit || '°C'} rise holding ${formatDuration(bigBurn.holdHours * 3600000)}` });
            }
            return {
                id: 'fuel-efficiency',
                label: 'Wood efficiency pulse',
                summary: 'Tracking how much heat each burn delivers before the plenum cools back to the comfort floor.',
                points,
                footer: `Last fire ${analysis.lastFireTime ? formatTime(new Date(analysis.lastFireTime)) : 'unknown'} · ${analysis.events.length} burns sampled`,
                priority: 2,
                variant: 'fire'
            };
        }

        function buildDaypartCadenceReport(analysis) {
            if (!analysis || !Array.isArray(analysis.daypartProfiles) || !analysis.daypartProfiles.length) {
                return null;
            }
            const daysOfData = analysis.coverageHours ? Math.max(1, analysis.coverageHours / 24) : 1;
            const anchorParts = analysis.daypartProfiles.filter(part => part.anchor && part.count);
            if (!anchorParts.length) {
                return null;
            }
            const weakest = anchorParts.reduce((acc, part) => {
                const goal = Number.isFinite(part.goalHours) ? part.goalHours : 0;
                const hold = Number.isFinite(part.avgHoldHours) ? part.avgHoldHours : 0;
                const gap = goal - hold;
                if (!acc || gap > acc.gap) {
                    return { part, gap };
                }
                return acc;
            }, null);
            const focus = weakest?.part || anchorParts[0];
            const focusGoal = Number.isFinite(focus.goalHours) ? focus.goalHours : null;
            const focusHold = Number.isFinite(focus.avgHoldHours) ? focus.avgHoldHours : null;
            const closingGap = weakest && weakest.gap > 0.25;
            const summaryParts = [];
            if (focusHold && focusGoal) {
                summaryParts.push(`${focus.label} burns hold ${formatDuration(focusHold * 3600000)} vs ${formatDuration(focusGoal * 3600000)} goal.`);
                if (closingGap) {
                    summaryParts.push('Consider a larger reload or earlier light-off to close the gap.');
                } else {
                    summaryParts.push('Cadence is matching the target window—keep the routine.');
                }
            } else {
                summaryParts.push(`${focus.label} cadence logged ${formatNumber(focus.count / daysOfData)} burns/day.`);
            }
            summaryParts.push(`Averaging ${formatNumber(analysis.firesPerDay || (analysis.events?.length || 0) / daysOfData)} fires/day across ${Math.round(daysOfData)} days of data.`);
            const points = anchorParts.map(part => {
                const firesPerDay = part.count && daysOfData ? `${formatNumber(part.count / daysOfData)} fires/day` : `${part.count} fires`;
                const holdLabel = Number.isFinite(part.avgHoldHours)
                    ? formatDuration(part.avgHoldHours * 3600000)
                    : '—';
                const riseLabel = Number.isFinite(part.avgRise)
                    ? `${formatNumber(part.avgRise)}°C`
                    : '—';
                const goalLabel = Number.isFinite(part.goalHours)
                    ? formatDuration(part.goalHours * 3600000)
                    : '—';
                return {
                    label: part.label,
                    detail: `${firesPerDay} · rise ${riseLabel} · hold ${holdLabel} (goal ${goalLabel})`
                };
            });
            return {
                id: 'daypart-cadence',
                label: 'Anchor cadence',
                badge: 'Cadence',
                summary: summaryParts.join(' '),
                points,
                priority: 3,
                variant: 'fire'
            };
        }

        function buildCoolingTrendReport(analysis, feed, weather) {
            if (!analysis || !feed) {
                return null;
            }
            const unitLabel = feed.unit || '°C';
            const recent = Number.isFinite(analysis.recentCoolingRate) ? analysis.recentCoolingRate : null;
            const baseline = Number.isFinite(analysis.avgCoolingRate)
                ? analysis.avgCoolingRate
                : Number.isFinite(FURNACE_PROFILE.defaultCoolingRate)
                    ? FURNACE_PROFILE.defaultCoolingRate
                    : null;
            if (!recent && !baseline) {
                return null;
            }
            const summaryParts = [];
            if (recent && baseline) {
                const ratio = baseline > 0 ? recent / baseline : null;
                const trendWord = ratio
                    ? ratio > 1.2
                        ? 'accelerating'
                        : ratio < 0.85
                            ? 'coasting slower'
                            : 'running on pace'
                    : 'running on pace';
                summaryParts.push(`Cooling is ${trendWord}: ${formatNumber(recent)}${unitLabel}/hr vs ${formatNumber(baseline)}${unitLabel}/hr typical.`);
            } else if (recent) {
                summaryParts.push(`Dropping ${formatNumber(recent)}${unitLabel}/hr right now.`);
            } else {
                summaryParts.push(`Typical cooling rate ${formatNumber(baseline)}${unitLabel}/hr.`);
            }
            if (Number.isFinite(analysis.predictedHoursToTarget)) {
                const eta = new Date(Date.now() + analysis.predictedHoursToTarget * 3600000);
                summaryParts.push(`Expect to hit ${analysis.targetTemp ?? 18}° near ${formatTime(eta)}.`);
            }
            if (weather?.temperature !== undefined && Number.isFinite(Number(weather.temperature))) {
                summaryParts.push(`Outdoor ${formatNumber(weather.temperature)}${unitLabel} is influencing the drop.`);
            }
            const points = [];
            if (recent) {
                points.push({ label: 'Current slope', detail: `${formatNumber(recent)}${unitLabel}/hr` });
            }
            if (baseline) {
                points.push({ label: 'Normal slope', detail: `${formatNumber(baseline)}${unitLabel}/hr` });
            }
            if (Number.isFinite(analysis.nextFireTime)) {
                points.push({ label: 'Next fire ETA', detail: formatTime(new Date(analysis.nextFireTime)) });
            }
            if (Number.isFinite(analysis.firesPerDay)) {
                points.push({ label: 'Fires / day', detail: formatNumber(analysis.firesPerDay) });
            }
            return {
                id: 'cooling-trend',
                label: 'Cooling pace',
                badge: 'Cooling',
                summary: summaryParts.join(' '),
                points,
                priority: 3.2,
                variant: 'fire'
            };
        }

        function buildFireEffectivenessReport({ fireAnalysis, timeline }) {
            if (!fireAnalysis || !Array.isArray(fireAnalysis.events) || !Array.isArray(timeline) || !timeline.length) {
                return null;
            }
            const { metrics, excluded } = computeFireEffectivenessEvents({
                timeline,
                fireEvents: fireAnalysis.events,
                baselineMinutes: 10,
                analysisHours: 4
            });
            if (!metrics.length) {
                return null;
            }
            const referenceTime = Number.isFinite(timeline[timeline.length - 1]?.timestamp)
                ? timeline[timeline.length - 1].timestamp
                : Date.now();
            const summary = summarizeFireEffectivenessBySize({
                metrics,
                referenceTime,
                lookbackMs: 30 * 24 * 60 * 60 * 1000
            });
            if (!summary.length) {
                return null;
            }
            const summaryParts = [
                `${metrics.length} fires analyzed in the last 30 days.`
            ];
            summaryParts.push(`${excluded} excluded due to missing baseline or outdoor readings.`);
            const points = summary.map(entry => {
                const gainInLabel = Number.isFinite(entry.medianGainIn)
                    ? `+${formatNumber(entry.medianGainIn)}°C`
                    : 'n/a';
                const gainDeltaLabel = Number.isFinite(entry.medianGainDelta)
                    ? `+${formatNumber(entry.medianGainDelta)} ΔT`
                    : 'n/a';
                const timeLabel = Number.isFinite(entry.medianTimeToPeak)
                    ? formatDuration(entry.medianTimeToPeak * 60000)
                    : 'n/a';
                return {
                    label: `${entry.sizeLabel || entry.sizeId || 'Fire'} (${entry.count})`,
                    detail: `${gainInLabel} · ${gainDeltaLabel} · ${timeLabel} to peak`
                };
            });
            return {
                id: 'fire-effectiveness',
                label: 'Outdoor-normalized fire effectiveness',
                badge: 'Effectiveness',
                summary: summaryParts.join(' '),
                points,
                priority: 2.4,
                variant: 'fire'
            };
        }

        function buildHeatingDegreeReport({ timeline, fireAnalysis }) {
            if (!Array.isArray(timeline) || !timeline.length) {
                return null;
            }
            const fireEvents = fireAnalysis?.events || [];
            const { days, excludedFires } = computeHeatingDegreeDailyMetrics({
                timeline,
                fireEvents,
                baseTemp: HEATING_DEGREE_BASE_TEMP,
                dayCount: 14
            });
            if (!Array.isArray(days) || !days.length) {
                return null;
            }
            const latest = days[0];
            const summaryParts = [
                `Base ${HEATING_DEGREE_BASE_TEMP}°C demand profile across ${days.length} days.`
            ];
            if (latest) {
                const latestLabel = formatDayLabel(latest.dayStart);
                const latestHdd = formatNumber(latest.hdd);
                const latestFires = formatNumber(latest.fireCount);
                const latestWeighted = formatNumber(latest.weightedFireCount);
                const latestRatio = Number.isFinite(latest.firesPerHdd) ? formatNumber(latest.firesPerHdd) : 'n/a';
                const latestWeightedRatio = Number.isFinite(latest.weightedFiresPerHdd) ? formatNumber(latest.weightedFiresPerHdd) : 'n/a';
                summaryParts.push(`${latestLabel}: ${latestHdd} HDD · ${latestFires} fires (${latestWeighted} weighted).`);
                summaryParts.push(`${latestRatio} fires/HDD · ${latestWeightedRatio} weighted/HDD.`);
            }
            if (excludedFires) {
                summaryParts.push(`${excludedFires} fires excluded (outside range or missing weight).`);
            }
            const headers = ['Date', 'HDD', 'Fires', 'Weighted Fires', 'Fires/HDD'];
            const rows = days.map(day => [
                formatDayLabel(day.dayStart),
                formatNumber(day.hdd),
                formatNumber(day.fireCount),
                formatNumber(day.weightedFireCount),
                Number.isFinite(day.firesPerHdd) ? formatNumber(day.firesPerHdd) : 'n/a'
            ]);
            const csv = buildHeatingDegreeCsv(days);
            return {
                id: 'heating-degree',
                label: 'Heating degree cadence',
                badge: 'Heating',
                summary: summaryParts.join(' '),
                table: { headers, rows },
                csv: { filename: 'heating-degree.csv', content: csv },
                priority: 2.3,
                variant: 'fire'
            };
        }

        function buildNormalizedCoolingReport({ fireAnalysis, timeline, intervals: providedIntervals }) {
            if (!fireAnalysis || !Array.isArray(fireAnalysis.events)) {
                return null;
            }
            let intervals = Array.isArray(providedIntervals) ? providedIntervals.slice() : null;
            if (!intervals || !intervals.length) {
                if (!Array.isArray(timeline) || !timeline.length) {
                    return null;
                }
                intervals = computeNormalizedCoolingIntervals({
                    timeline,
                    fireEvents: fireAnalysis.events,
                    minDurationMinutes: 60,
                    minDelta: 2
                });
            }
            if (!intervals.length) {
                return null;
            }
            intervals = intervals
                .slice()
                .sort((a, b) => {
                    const aKey = Number.isFinite(a?.end) ? a.end : a?.start ?? 0;
                    const bKey = Number.isFinite(b?.end) ? b.end : b?.start ?? 0;
                    return aKey - bKey;
                });
            const referenceCandidate = Array.isArray(timeline) && timeline.length
                ? timeline[timeline.length - 1]?.timestamp
                : intervals[intervals.length - 1]?.end;
            const referenceTime = Number.isFinite(referenceCandidate) ? referenceCandidate : Date.now();
            const lastInterval = intervals[intervals.length - 1];
            if (!Number.isFinite(lastInterval?.normalized)) {
                return null;
            }
            const windowStart = referenceTime - 7 * 24 * 60 * 60 * 1000;
            const recentIntervals = intervals.filter(interval => Number.isFinite(interval.end) && interval.end >= windowStart);
            const windowValues = recentIntervals
                .map(interval => interval.normalized)
                .filter(Number.isFinite);
            const medianNormalized = windowValues.length ? computeMedian(windowValues) : null;
            const flagWorse = medianNormalized !== null
                ? Math.abs(lastInterval.normalized) > Math.abs(medianNormalized) * 1.2
                : false;
            const summaryParts = [
                `Normalized cooling (last interval): ${formatCoolingRate(lastInterval.normalized)}`
            ];
            summaryParts.push(`7-day median: ${medianNormalized !== null ? formatCoolingRate(medianNormalized) : 'n/a'}`);
            if (flagWorse) {
                summaryParts.push('Cooling faster than target.');
            }
            const dailyRows = summarizeDailyNormalizedCooling({
                intervals,
                days: 7,
                referenceTime
            }).map(row => ({
                label: formatDayLabel(row.dayStart),
                detail: formatCoolingRate(row.median)
            }));
            const points = dailyRows.length
                ? dailyRows
                : [{ label: 'Daily medians', detail: 'Need more intervals.' }];
            return {
                id: 'normalized-cooling',
                label: 'Normalized cooling',
                badge: 'Cooling',
                summary: summaryParts.join(' · '),
                points,
                priority: 2.6,
                variant: flagWorse ? 'fire' : undefined
            };
        }

        function buildCoolingAlertsReport({ anomalies }) {
            if (!Array.isArray(anomalies) || !anomalies.length) {
                return null;
            }
            const ordered = anomalies
                .slice()
                .sort((a, b) => {
                    const aKey = Number.isFinite(a?.end) ? a.end : a?.start ?? 0;
                    const bKey = Number.isFinite(b?.end) ? b.end : b?.start ?? 0;
                    return bKey - aKey;
                });
            const worst = ordered.reduce((acc, interval) => {
                if (!interval || !Number.isFinite(interval.normalized)) {
                    return acc;
                }
                if (!acc || !Number.isFinite(acc.normalized)) {
                    return interval;
                }
                return interval.normalized < acc.normalized ? interval : acc;
            }, null);
            if (!worst || !Number.isFinite(worst.normalized)) {
                return null;
            }
            const latest = ordered[0];
            const windLikelyCount = ordered.filter(interval => interval.windLikely).length;
            const summaryParts = [
                `${ordered.length} cooling alert${ordered.length === 1 ? '' : 's'} flagged this week.`,
                `Worst slope ${formatCoolingRate(worst.normalized)} vs median ${formatCoolingRate(worst.median)}`
            ];
            if (Number.isFinite(worst.threshold)) {
                summaryParts.push(`Trigger line ${formatCoolingRate(worst.threshold)}`);
            }
            if (latest?.start) {
                summaryParts.push(`Latest started ${formatDateTime(latest.start)}`);
            }
            if (windLikelyCount) {
                summaryParts.push(`${windLikelyCount} looked wind-driven`);
            }
            const describeSeverity = ratio => {
                if (!Number.isFinite(ratio)) {
                    return 'Alert';
                }
                const faster = Math.max(0, Math.abs(ratio) - 1);
                if (faster >= 0.5) {
                    return 'Severe';
                }
                if (faster >= 0.3) {
                    return 'High';
                }
                if (faster >= 0.15) {
                    return 'Elevated';
                }
                return 'Alert';
            };
            const formatWindowLabel = (start, end) => {
                const startLabel = formatDateTime(start);
                const endLabel = formatDateTime(end);
                if (startLabel && endLabel && startLabel !== endLabel) {
                    return `${startLabel} → ${endLabel}`;
                }
                return startLabel || endLabel || 'Cooling interval';
            };
            const formatFasterPercent = ratio => {
                if (!Number.isFinite(ratio)) {
                    return null;
                }
                const faster = Math.max(0, Math.abs(ratio) - 1);
                return Math.round(faster * 100);
            };
            const points = ordered.slice(0, 4).map(interval => {
                const fasterPercent = formatFasterPercent(interval.severityRatio);
                const detailParts = [
                    `${describeSeverity(interval.severityRatio)} ${formatCoolingRate(interval.normalized)}`
                ];
                if (Number.isFinite(interval.median)) {
                    detailParts.push(`median ${formatCoolingRate(interval.median)}`);
                }
                if (Number.isFinite(fasterPercent) && fasterPercent > 0) {
                    detailParts.push(`${fasterPercent}% faster`);
                }
                if (interval.windLikely) {
                    detailParts.push('Wind-driven heat loss likely');
                }
                return {
                    label: formatWindowLabel(interval.start, interval.end),
                    detail: detailParts.join(' · ')
                };
            });
            if (!points.length) {
                return null;
            }
            return {
                id: 'cooling-alerts',
                label: 'Cooling alerts',
                badge: 'Alerts',
                summary: summaryParts.join(' · '),
                points,
                priority: 2.7,
                variant: 'risk'
            };
        }

        function buildStretchOptimizationReport(analysis, feed) {
            if (!analysis || !feed || !Array.isArray(analysis.events) || !analysis.events.length) {
                return null;
            }
            const unitLabel = feed.unit || '°C';
            const holdSorted = analysis.events
                .filter(event => Number.isFinite(event.holdHours))
                .sort((a, b) => (b.holdHours ?? 0) - (a.holdHours ?? 0));
            const longest = holdSorted[0] || analysis.events[0];
            const latest = analysis.events[analysis.events.length - 1];
            const summaryParts = [];
            if (longest?.holdHours) {
                const longestStart = new Date(longest.startTime);
                const longestDrop = longest.dropTime ? new Date(longest.dropTime) : null;
                summaryParts.push(`Best stretch held ${formatDuration(longest.holdHours * 3600000)} after a ${formatNumber(longest.rise)}${unitLabel} ramp starting ${formatTime(longestStart)}${longestDrop ? ` → ${formatTime(longestDrop)}` : ''}.`);
            }
            if (analysis.avgHoldHours) {
                summaryParts.push(`Typical burns coast ${formatDuration(analysis.avgHoldHours * 3600000)} before the ducts cool back to ${analysis.targetTemp ?? 18}°.`);
            }
            const points = [];
            if (analysis.avgIntervalHours) {
                points.push({ label: 'Spacing average', detail: `${formatNumber(analysis.avgIntervalHours)} h between burns` });
            }
            if (analysis.avgHoldHours) {
                points.push({ label: 'Typical hold', detail: formatDuration(analysis.avgHoldHours * 3600000) });
            }
            if (longest?.holdHours) {
                points.push({ label: 'Record stretch', detail: formatDuration(longest.holdHours * 3600000) });
            }
            if (latest?.peakTime) {
                points.push({ label: 'Last reload', detail: formatTime(new Date(latest.peakTime)) });
            }
            return {
                id: 'stretch-optimizer',
                label: 'Stretch the burn',
                badge: 'Stretch',
                summary: summaryParts.join(' '),
                points,
                footer: analysis.coverageHours ? `Data window ${formatDuration(analysis.coverageHours * 3600000)}` : '',
                priority: 3.4,
                variant: 'fire'
            };
        }

        function buildFuelEfficiencyReports({ fireAnalysis, temperatureFeed, weather, heatTimeline, normalizedIntervals, coolingAnomalies }) {
            if (!fireAnalysis || !temperatureFeed) {
                return [];
            }
            const sections = [];
            const planning = buildBurnPlaybookReport(fireAnalysis, temperatureFeed, weather);
            if (planning) {
                sections.push(planning);
            }
            const efficiency = buildFuelEfficiencySummary(fireAnalysis, temperatureFeed, weather);
            if (efficiency) {
                sections.push(efficiency);
            }
            const cadence = buildDaypartCadenceReport(fireAnalysis);
            if (cadence) {
                sections.push(cadence);
            }
            const cooling = buildCoolingTrendReport(fireAnalysis, temperatureFeed, weather);
            if (cooling) {
                sections.push(cooling);
            }
            const stretch = buildStretchOptimizationReport(fireAnalysis, temperatureFeed);
            if (stretch) {
                sections.push(stretch);
            }
            const effectiveness = buildFireEffectivenessReport({
                fireAnalysis,
                timeline: heatTimeline
            });
            if (effectiveness) {
                sections.push(effectiveness);
            }
            const heating = buildHeatingDegreeReport({
                timeline: heatTimeline,
                fireAnalysis
            });
            if (heating) {
                sections.push(heating);
            }
            const normalizedCooling = buildNormalizedCoolingReport({
                fireAnalysis,
                timeline: Array.isArray(heatTimeline) ? heatTimeline : null,
                intervals: normalizedIntervals
            });
            if (normalizedCooling) {
                sections.push(normalizedCooling);
            }
            const alerts = buildCoolingAlertsReport({
                anomalies: Array.isArray(coolingAnomalies) ? coolingAnomalies : []
            });
            if (alerts) {
                sections.push(alerts);
            }
            return sections;
        }

        function deriveCoverage(feeds) {
            const timestamps = [];
            feeds.forEach(feed => {
                if (!feed || !Array.isArray(feed.data)) {
                    return;
                }
                feed.data.forEach(entry => {
                    const ts = Date.parse(entry.created_at ?? entry.createdAt);
                    if (!Number.isNaN(ts)) {
                        timestamps.push(ts);
                    }
                });
            });
            if (!timestamps.length) {
                return null;
            }
            const latestTs = Math.max(...timestamps);
            const earliestTs = Math.min(...timestamps);
            return {
                totalMs: Math.max(0, latestTs - earliestTs),
                latest: new Date(latestTs)
            };
        }

        function deriveHistoryCoverage(history) {
            if (!Array.isArray(history) || history.length < 2) {
                return null;
            }
            const timestamps = history
                .map(point => Number(point.timestamp))
                .filter(Number.isFinite);
            if (!timestamps.length) {
                return null;
            }
            const latestTs = Math.max(...timestamps);
            const earliestTs = Math.min(...timestamps);
            return {
                totalMs: Math.max(0, latestTs - earliestTs),
                latest: new Date(latestTs)
            };
        }

        function computeRangeStats(readings, predicate) {
            if (!Array.isArray(readings) || readings.length < 2 || typeof predicate !== 'function') {
                return null;
            }
            const sorted = readings.slice().sort((a, b) => {
                const aTs = Date.parse(a.created_at ?? a.createdAt);
                const bTs = Date.parse(b.created_at ?? b.createdAt);
                if (Number.isNaN(aTs) || Number.isNaN(bTs)) {
                    return 0;
                }
                return aTs - bTs;
            });

            let totalMs = 0;
            let inRangeMs = 0;
            let currentRunMs = 0;
            let longestMs = 0;
            let longestEndTs = null;

            for (let i = 1; i < sorted.length; i++) {
                const prev = sorted[i - 1];
                const curr = sorted[i];
                const prevTs = Date.parse(prev.created_at ?? prev.createdAt);
                const currTs = Date.parse(curr.created_at ?? curr.createdAt);
                if (Number.isNaN(prevTs) || Number.isNaN(currTs) || currTs <= prevTs) {
                    continue;
                }
                const delta = currTs - prevTs;
                totalMs += delta;
                if (predicate(prev.value)) {
                    inRangeMs += delta;
                    currentRunMs += delta;
                    if (currentRunMs > longestMs) {
                        longestMs = currentRunMs;
                        longestEndTs = currTs;
                    }
                } else {
                    currentRunMs = 0;
                }
            }

            const longestEnd = typeof longestEndTs === 'number' ? new Date(longestEndTs) : null;
            return {
                totalMs,
                inRangeMs,
                longestMs,
                longestEnd
            };
        }

        function findDropTimestamp(series, startIndex, targetTemp) {
            if (!Array.isArray(series) || !series.length || !Number.isFinite(targetTemp)) {
                return null;
            }
            const begin = Math.max(0, startIndex || 0);
            for (let i = begin; i < series.length; i++) {
                if (series[i].value <= targetTemp) {
                    return series[i].timestamp;
                }
            }
            return null;
        }

        function computeCoolingTrendRate(series, options = {}) {
            if (!Array.isArray(series) || series.length < 2) {
                return null;
            }
            const {
                windowMs = 3 * 3600000,
                minPoints = 5,
                minDrop = 0.2,
                minSpanMs = 45 * 60 * 1000,
                startTime = null
            } = options;

            const earliest = series[0].timestamp;
            const latest = series[series.length - 1].timestamp;

            let cutoff = earliest;
            if (Number.isFinite(windowMs)) {
                cutoff = Math.max(cutoff, latest - windowMs);
            }
            if (Number.isFinite(startTime)) {
                cutoff = Math.max(cutoff, startTime);
            }

            const window = series.filter(point => point.timestamp >= cutoff && point.timestamp <= latest);
            if (window.length < minPoints) {
                return null;
            }

            const spanMs = window[window.length - 1].timestamp - window[0].timestamp;
            if (!Number.isFinite(spanMs) || spanMs < minSpanMs) {
                return null;
            }

            const totalDrop = window[0].value - window[window.length - 1].value;
            if (!Number.isFinite(totalDrop) || totalDrop < minDrop) {
                return null;
            }

            const meanTime = window.reduce((sum, point) => sum + point.timestamp, 0) / window.length;
            const meanTemp = window.reduce((sum, point) => sum + point.value, 0) / window.length;
            let numerator = 0;
            let denominator = 0;
            window.forEach(point => {
                const timeOffset = point.timestamp - meanTime;
                numerator += timeOffset * (point.value - meanTemp);
                denominator += timeOffset * timeOffset;
            });

            if (denominator === 0) {
                return null;
            }

            const slopePerMs = numerator / denominator;
            const slopePerHour = slopePerMs * 3600000;
            if (!Number.isFinite(slopePerHour) || slopePerHour >= -0.02) {
                return null;
            }

            return Math.abs(slopePerHour);
        }

        function summarizeFireDayparts(events) {
            if (!Array.isArray(events) || !events.length) {
                return FIRE_DAYPARTS.map(part => ({ ...part, count: 0 }));
            }
            const buckets = FIRE_DAYPARTS.map(part => ({ id: part.id, count: 0, totalRise: 0, totalHold: 0, totalDuration: 0 }));
            const lookup = new Map(buckets.map(bucket => [bucket.id, bucket]));
            events.forEach(event => {
                const bucket = lookup.get((inferFireDaypart(event.startTime) || {}).id);
                if (!bucket) {
                    return;
                }
                bucket.count += 1;
                if (Number.isFinite(event.rise)) {
                    bucket.totalRise += event.rise;
                }
                if (Number.isFinite(event.holdHours)) {
                    bucket.totalHold += event.holdHours;
                }
                if (Number.isFinite(event.durationMs)) {
                    bucket.totalDuration += event.durationMs / 3600000;
                }
            });
            return FIRE_DAYPARTS.map(part => {
                const stats = lookup.get(part.id);
                if (!stats || !stats.count) {
                    return { ...part, count: stats?.count || 0 };
                }
                return {
                    ...part,
                    count: stats.count,
                    avgRise: stats.totalRise / stats.count,
                    avgHoldHours: stats.totalHold > 0 ? stats.totalHold / stats.count : null,
                    avgBurnHours: stats.totalDuration > 0 ? stats.totalDuration / stats.count : null
                };
            });
        }

        function inferFireDaypart(input) {
            const date = input instanceof Date ? input : new Date(input);
            if (Number.isNaN(date.getTime())) {
                return FIRE_DAYPARTS[0] || null;
            }
            const hour = date.getHours() + (date.getMinutes() / 60);
            return FIRE_DAYPARTS.find(part => isHourWithinRange(hour, part.startHour, part.endHour)) || FIRE_DAYPARTS[0];
        }

        function isHourWithinRange(hour, start, end) {
            if (!Number.isFinite(hour) || !Number.isFinite(start) || !Number.isFinite(end)) {
                return false;
            }
            if (start <= end) {
                return hour >= start && hour < end;
            }
            return hour >= start || hour < end;
        }

        function findNextFireAnchor(now) {
            const date = now instanceof Date ? now : new Date(now);
            if (Number.isNaN(date.getTime())) {
                return null;
            }
            let candidate = null;
            FIRE_DAYPARTS.filter(part => part.anchor).forEach(part => {
                const anchorHour = Number.isFinite(part.anchorHour) ? part.anchorHour : part.startHour;
                if (!Number.isFinite(anchorHour)) {
                    return;
                }
                const target = new Date(date);
                target.setHours(anchorHour, 0, 0, 0);
                if (target <= date) {
                    target.setDate(target.getDate() + 1);
                }
                if (!candidate || target < candidate.timestamp) {
                    candidate = {
                        ...part,
                        timestamp: target,
                        hoursUntil: (target - date) / 3600000
                    };
                }
            });
            return candidate;
        }

        function classifyFireSizePlan(neededRise, fallbackId) {
            const rise = Number.isFinite(neededRise) ? neededRise : 0;
            const band = FURNACE_PROFILE.sizeBands.find(entry => rise >= entry.minRise && rise < entry.maxRise);
            if (band) {
                return band;
            }
            return FURNACE_PROFILE.sizeBands.find(entry => entry.id === fallbackId) || FURNACE_PROFILE.sizeBands[FURNACE_PROFILE.sizeBands.length - 1];
        }

        function estimateFireStartTime(analysis, nextAnchor) {
            if (!analysis) {
                return null;
            }
            const leadMs = Math.max((FURNACE_PROFILE.leadTimeMinutes || 20) * 60000, 5 * 60 * 1000);
            if (analysis.currentTemp <= (analysis.targetTemp ?? 18)) {
                return new Date();
            }
            if (analysis.nextFireTime) {
                const ts = Math.max(Date.now(), analysis.nextFireTime - leadMs);
                return new Date(ts);
            }
            if (nextAnchor?.timestamp) {
                return new Date(Math.max(Date.now(), nextAnchor.timestamp - leadMs));
            }
            return null;
        }

        function computeDewPoint(tempC, humidity) {
            if (!Number.isFinite(tempC) || !Number.isFinite(humidity) || humidity <= 0 || humidity > 100) {
                return null;
            }
            const a = 17.62;
            const b = 243.12;
            const gamma = Math.log(humidity / 100) + (a * tempC) / (b + tempC);
            const dewPoint = (b * gamma) / (a - gamma);
            return Number.isFinite(dewPoint) ? dewPoint : null;
        }

        function estimateWindowTemperature(indoorTemp, outdoorTemp) {
            if (!Number.isFinite(indoorTemp) || !Number.isFinite(outdoorTemp)) {
                return null;
            }
            const transferFactor = 0.3; // heuristic for double-pane performance
            return outdoorTemp + (indoorTemp - outdoorTemp) * transferFactor;
        }

        function formatHistoryRangeLabel(startDate, endDate) {
            if (!(startDate instanceof Date) || !(endDate instanceof Date) || Number.isNaN(startDate.getTime()) || Number.isNaN(endDate.getTime())) {
                return 'Range unavailable';
            }
            const spanMs = endDate - startDate;
            if (!Number.isFinite(spanMs) || spanMs <= 0) {
                return 'Range unavailable';
            }
            const spanDays = spanMs / (24 * 60 * 60 * 1000);
            if (spanDays <= 1) {
                return 'Last 24 hours';
            }
            if (spanDays <= 7) {
                return `Last ${Math.round(spanDays)} days`;
            }
            const opts = { month: 'short', day: 'numeric' };
            const startLabel = startDate.toLocaleDateString([], startDate.getFullYear() !== endDate.getFullYear() ? { ...opts, year: 'numeric' } : opts);
            const endLabel = endDate.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
            if (spanDays >= 60) {
                return `Since ${startLabel}`;
            }
            return `${startLabel} → ${endLabel}`;
        }

        function formatDuration(ms) {
            if (!Number.isFinite(ms) || ms <= 0) {
                return '0m';
            }
            const minutes = Math.round(ms / 60000);
            if (minutes < 1) {
                return '<1m';
            }
            const hours = Math.floor(minutes / 60);
            const remainingMinutes = minutes % 60;
            const parts = [];
            if (hours) {
                parts.push(`${hours}h`);
            }
            if (remainingMinutes) {
                parts.push(`${remainingMinutes}m`);
            }
            return parts.length ? parts.join(' ') : '0m';
        }

        function buildHeatingDegreeCsv(days) {
            if (!Array.isArray(days) || !days.length) {
                return 'Date,HDD,Fires,Weighted Fires,Fires/HDD,Weighted Fires/HDD';
            }
            const headers = ['Date', 'HDD', 'Fires', 'Weighted Fires', 'Fires/HDD', 'Weighted Fires/HDD'];
            const lines = [headers.join(',')];
            const ordered = days.slice().reverse();
            ordered.forEach(day => {
                const row = [
                    formatDayLabel(day.dayStart),
                    Number.isFinite(day.hdd) ? day.hdd.toFixed(3) : '',
                    Number.isFinite(day.fireCount) ? day.fireCount : '',
                    Number.isFinite(day.weightedFireCount) ? day.weightedFireCount.toFixed(2) : '',
                    Number.isFinite(day.firesPerHdd) ? day.firesPerHdd.toFixed(3) : '',
                    Number.isFinite(day.weightedFiresPerHdd) ? day.weightedFiresPerHdd.toFixed(3) : ''
                ].map(csvEscape).join(',');
                lines.push(row);
            });
            return lines.join('\n');
        }

        function csvEscape(value) {
            const stringValue = value === null || value === undefined ? '' : String(value);
            const safeValue = stringValue.replace(/"/g, '""');
            return `"${safeValue}"`;
        }

        function triggerCsvDownload(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename || 'insight.csv';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function formatCoolingRate(value) {
            if (!Number.isFinite(value)) {
                return 'n/a';
            }
            const formatted = formatNumber(value);
            return `${formatted} /hr`;
        }

        function formatDayLabel(input) {
            const date = new Date(input);
            if (Number.isNaN(date.getTime())) {
                return 'Day';
            }
            return date.toLocaleDateString([], {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }


        function formatNumber(value) {
            if (!Number.isFinite(Number(value))) {
                return '--';
            }
            const numberValue = Number(value);
            const absValue = Math.abs(numberValue);
            const digits = absValue >= 100 ? 1 : absValue >= 10 ? 2 : 2;
            return numberValue.toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: digits
            });
        }

        function formatDateTime(input) {
            const date = input instanceof Date ? input : new Date(input);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatTime(input) {
            const date = new Date(input);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        (function () {
  const q = new URLSearchParams(location.search);
  if (q.has('widget')) {
    // Ensure we build + expose right away for the widget WebView
    try { requestData(true); } catch (e) {}
  }
})();
    </script>
