<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonehedge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hepta+Slab:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="./heat-timeline-utils.js"></script>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.65) 60%, rgba(15, 23, 42, 0.75) 100%);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('https://2338566ace915f8ce11c.cdn6.editmysite.com/uploads/b/2338566ace915f8ce11c36f2d1f1fe4ce369a03028f314bd74f1b5602b799014/aboutus_1676333736.png?width=2400&optimize=medium');
            background-size: cover;
            background-position: center;
            filter: saturate(1.1) contrast(0.95) brightness(0.8);
            z-index: -2;
        }

        .layout {
            width: min(1100px, 100%);
            background: rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 25px 60px -20px rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            padding: 3rem clamp(1.5rem, 2vw, 3rem);
            display: grid;
            gap: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .view-tabs {
            display: inline-flex;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.35rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            width: fit-content;
        }

        .view-tab {
            border: none;
            background: transparent;
            color: rgba(248, 250, 252, 0.85);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.5rem 1.35rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-tab:hover {
            color: #fff;
        }

        .view-tab--active {
            background: rgba(248, 250, 252, 0.22);
            color: #0f172a;
            box-shadow: 0 10px 20px -15px rgba(15, 23, 42, 0.8);
        }

        .page-header__text {
            display: grid;
            gap: 0.5rem;
        }

        .page-header h1 {
            font-family: 'Hepta Slab', 'Inter', serif;
            font-size: clamp(2.2rem, 4.2vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #f8fafc;
            text-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
        }

        .status-message {
            font-size: 0.95rem;
            color: rgba(226, 232, 240, 0.85);
        }

        .refresh-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(248, 250, 252, 0.15);
            color: #e0e7ff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.9);
        }

        .refresh-button:hover:not(:disabled) {
            transform: translateY(-2px) rotate(10deg);
            background: rgba(99, 102, 241, 0.25);
            box-shadow: 0 12px 30px -12px rgba(99, 102, 241, 0.4);
        }

        .refresh-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
        }

        .metric-card {
            border-radius: 22px;
            padding: 1.5rem;
            color: #f8fafc;
            display: grid;
            gap: 1.25rem;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            box-shadow: 0 15px 35px -20px rgba(15, 23, 42, 0.7);
            position: relative;
            overflow: hidden;
        }

        .metric-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.12), transparent 55%);
            opacity: 0.85;
            pointer-events: none;
        }

        .metric-emoji {
            position: absolute;
            font-size: clamp(8.5rem, 9vw, 5.5rem);
            opacity: 0.4;
            top: -0.4rem;
            right: -0.2rem;
            z-index: 0;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.35));
            user-select: none;
            pointer-events: none;
        }

        .metric-card > *:not(.metric-emoji) {
            position: relative;
            z-index: 1;
        }

        .metric-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
            font-family: 'Hepta Slab', 'Inter', serif;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .metric-value {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 600;
        }

        .metric-value span:last-child {
            font-size: clamp(1.3rem, 1.7vw, 2rem);
            opacity: 0.85;
            font-weight: 500;
        }

        .view {
            display: grid;
            gap: 2rem;
        }

        .view[hidden] {
            display: none !important;
        }

        .metric-extrema {
            display: flex;
            justify-content: space-between;
            gap: 1.25rem;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .metric-timestamp {
            font-size: 0.85rem;
            color: rgba(248, 250, 252, 0.85);
            letter-spacing: 0.02em;
        }

        .metric-extrema__item {
            display: grid;
            gap: 0.25rem;
        }

        .metric-extrema__label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.85;
        }

        .metric-extrema__value {
            font-weight: 600;
            font-size: clamp(1.1rem, 1.4vw, 1.6rem);
        }

        .metric-extrema__time {
            font-size: clamp(0.85rem, 1vw, 1.05rem);
            opacity: 0.85;
        }

        .metric-error {
            font-size: 0.85rem;
            color: #fca5a5;
            font-weight: 500;
        }

        .metric-card.metric-card--cold {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.97) 0%, rgba(37, 99, 235, 0.95) 45%, rgba(14, 165, 233, 0.92) 100%);
        }

        .metric-card.metric-card--supercold {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 64, 175, 0.96) 45%, rgba(8, 47, 73, 0.94) 100%);
        }

        .metric-card.metric-card--warm {
            background: linear-gradient(135deg, rgba(124, 45, 18, 0.98) 0%, rgba(194, 65, 12, 0.95) 50%, rgba(245, 158, 11, 0.9) 100%);
        }

        .metric-card.metric-card--ok {
            background: linear-gradient(135deg, rgba(7, 89, 133, 0.96) 0%, rgba(6, 95, 70, 0.94) 50%, rgba(22, 163, 74, 0.9) 100%);
        }

        .metric-card.metric-card--temperature-ok {
            background: linear-gradient(135deg, rgba(146, 64, 14, 0.9) 0%, rgba(234, 178, 80, 0.9) 45%, rgba(253, 224, 71, 0.85) 100%);
        }

        .metric-card.metric-card--temperature-superwarm {
            background: linear-gradient(135deg, rgba(148, 44, 22, 0.98) 0%, rgba(220, 38, 38, 0.94) 45%, rgba(245, 158, 11, 0.92) 100%);
        }

        .metric-card.metric-card--alert {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.95) 0%, rgba(249, 115, 22, 0.92) 50%, rgba(255, 195, 113, 0.9) 100%);
        }

        .metric-card.metric-card--humidity-ok {
            background: linear-gradient(135deg, rgba(8, 145, 178, 0.96) 0%, rgba(6, 182, 212, 0.94) 40%, rgba(16, 185, 129, 0.92) 100%);
        }

        .metric-card.metric-card--humidity-alert {
            background: linear-gradient(135deg, rgba(219, 176, 85, 0.96) 0%, rgba(203, 143, 32, 0.94) 45%, rgba(181, 124, 27, 0.9) 100%);
        }

        .metric-card.metric-card--pressure-ok {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.96) 0%, rgba(59, 130, 246, 0.94) 55%, rgba(129, 140, 248, 0.92) 100%);
        }

        .metric-card.metric-card--pressure-alert {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.95) 50%, rgba(71, 85, 105, 0.9) 100%);
        }

        .metric-card.metric-card--error {
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.95) 0%, rgba(185, 28, 28, 0.95) 100%);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.75rem;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            padding: 1.75rem;
            border: 1px solid rgba(203, 213, 225, 0.8);
            display: grid;
            gap: 1.5rem;
            box-shadow: 0 20px 35px -30px rgba(15, 23, 42, 0.6);
        }

        .detail-card.temperature-detail,
        .detail-card.humidity-detail,
        .detail-card.pressure-detail,
        .detail-card.air-detail {
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .detail-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: inherit;
            font-family: 'Hepta Slab', 'Inter', serif;
        }

        .detail-summary {
            color: inherit;
            opacity: 0.85;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .detail-chart {
            height: clamp(220px, 40vh, 320px);
        }

        .detail-chart canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .detail-list {
            list-style: none;
            display: grid;
            gap: 0.6rem;
            font-size: 0.95rem;
            color: #1f2937;
        }

        .detail-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.4);
            font-variant-numeric: tabular-nums;
        }

        .detail-list li:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-error {
            color: #b91c1c;
            font-weight: 500;
        }

        .insight-hero {
            background: rgba(15, 23, 42, 0.75);
            border-radius: 24px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 35px -25px rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            color: #f1f5f9;
        }

        .insight-hero h2 {
            font-size: 2rem;
            margin-bottom: 0.35rem;
            font-family: 'Hepta Slab', 'Inter', serif;
        }

        .insight-hero p {
            color: rgba(248, 250, 252, 0.8);
            font-size: 1rem;
        }

        .heat-history {
            background: rgba(15, 23, 42, 0.68);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            margin-top: 1.25rem;
            box-shadow: 0 16px 30px -25px rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .heat-history__header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.25rem;
            color: rgba(248, 250, 252, 0.9);
        }

        .heat-history__header h3 {
            margin: 0;
            font-size: 1.35rem;
            font-family: 'Hepta Slab', 'Inter', serif;
        }

        .heat-history__header p {
            margin: 0.35rem 0 0;
            color: rgba(248, 250, 252, 0.7);
        }

        .heat-history__range {
            align-self: flex-start;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(248, 250, 252, 0.25);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(248, 250, 252, 0.7);
        }

        .heat-history__delta {
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 999px;
            padding: 0.3rem 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.12);
            color: rgba(248, 250, 252, 0.85);
            min-width: 78px;
            text-align: center;
        }

        .heat-history__actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
        }

        .history-range {
            display: inline-flex;
            gap: 0.4rem;
            padding: 0.2rem;
            border-radius: 999px;
            border: 1px solid rgba(248, 250, 252, 0.2);
            background: rgba(15, 23, 42, 0.5);
        }

        .history-range__btn {
            border: none;
            background: transparent;
            color: rgba(248, 250, 252, 0.8);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .history-range__btn:hover:not(:disabled) {
            background: rgba(248, 250, 252, 0.15);
            color: #fff;
        }

        .history-range__btn--active {
            background: rgba(248, 250, 252, 0.22);
            color: #0f172a;
            cursor: default;
        }

        .heat-history__chart {
            width: 100%;
            height: clamp(220px, 32vh, 360px);
        }

        .heat-history__chart canvas {
            width: 100% !important;
            height: 100% !important;
        }

.fire-journal {
    background: rgba(15, 23, 42, 0.7);
    border-radius: 24px;
    padding: 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-top: 1.25rem;
    display: grid;
    gap: 1rem;
}

.fire-journal__header h3 {
    margin: 0;
    font-size: 1.25rem;
    font-family: 'Hepta Slab', 'Inter', serif;
    color: #f8fafc;
}

.fire-journal__header p {
    margin: 0.3rem 0 0;
    color: rgba(248, 250, 252, 0.7);
}

.fire-size-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.fire-size-picker--error {
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.5);
}

.fire-size__btn {
    border: 1px solid rgba(248, 250, 252, 0.25);
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.4);
    color: rgba(248, 250, 252, 0.85);
    padding: 0.55rem 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border 0.2s ease, color 0.2s ease;
}

.fire-size__btn--selected {
    background: rgba(248, 250, 252, 0.9);
    color: #0f172a;
}

.fire-journal__note {
    width: 100%;
    border-radius: 12px;
    border: 1px solid rgba(248, 250, 252, 0.2);
    background: rgba(15, 23, 42, 0.35);
    color: #f8fafc;
    padding: 0.75rem;
    font-size: 0.95rem;
    resize: vertical;
}

.fire-journal__actions {
    display: flex;
    justify-content: flex-end;
}

.fire-journal__submit {
    border: none;
    border-radius: 12px;
    padding: 0.65rem 1.1rem;
    background: linear-gradient(135deg, #fb923c, #f97316);
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 12px 24px -16px rgba(251, 146, 60, 0.8);
}

.fire-journal__submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
}

.fire-journal__entries {
    display: grid;
    gap: 0.75rem;
}

.fire-journal__entry {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.95rem;
    color: rgba(248, 250, 252, 0.9);
}

.fire-journal__entry span {
    font-size: 0.85rem;
    color: rgba(248, 250, 252, 0.65);
}

.fire-journal__empty {
    color: rgba(248, 250, 252, 0.6);
    font-size: 0.9rem;
}

.insights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 1.5rem;
    width: 100%;
}

.insight-report {
    background: rgba(15, 23, 42, 0.78);
    border-radius: 28px;
    padding: clamp(1.4rem, 2.5vw, 2.4rem);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: grid;
    gap: 0.85rem;
    box-shadow: 0 28px 45px -30px rgba(15, 23, 42, 0.85);
    color: #f8fafc;
    width: 100%;
}

.insight-report__badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.9rem;
    border-radius: 999px;
    background: rgba(248, 250, 252, 0.1);
    border: 1px solid rgba(248, 250, 252, 0.25);
    color: rgba(248, 250, 252, 0.8);
    width: fit-content;
}

.insight-report__title {
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    margin: 0.25rem 0 0;
    font-family: 'Hepta Slab', 'Inter', serif;
    color: #f8fafc;
}

.insight-report__lede {
    color: rgba(248, 250, 252, 0.8);
    font-size: 1rem;
    line-height: 1.5;
}

.insight-report__bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.4rem;
    color: rgba(248, 250, 252, 0.9);
}

.insight-report__bullets li {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.35rem 0;
    border-bottom: 1px dashed rgba(248, 250, 252, 0.12);
    font-variant-numeric: tabular-nums;
}

.insight-report__bullets li:last-child {
    border-bottom: none;
}

.insight-report__bullets span {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.75rem;
    color: rgba(248, 250, 252, 0.65);
}

.insight-report__footer {
    font-size: 0.9rem;
    color: rgba(248, 250, 252, 0.7);
    margin-top: 0.5rem;
}

.insight-table {
    margin-top: 1rem;
    overflow-x: auto;
}

.insight-table table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
}

.insight-table th,
.insight-table td {
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid rgba(248, 250, 252, 0.15);
    text-align: left;
    white-space: nowrap;
}

.insight-table th {
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.75rem;
    color: rgba(248, 250, 252, 0.65);
}

.insight-download {
    margin-top: 0.75rem;
    border: 1px solid rgba(99, 102, 241, 0.6);
    background: transparent;
    color: rgba(15, 23, 42, 0.85);
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    width: fit-content;
}

.insight-download:hover {
    background: rgba(99, 102, 241, 0.1);
}

        .insight-card--fire {
            border-color: rgba(248, 113, 113, 0.5);
        }

        .insight-card__icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.18);
            font-size: 1.4rem;
        }

        .insight-card__header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .insight-card__label {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.85rem;
            color: #475569;
        }

        .insight-card__value {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 600;
            color: #fbbf24;
        }

        .insight-card__summary {
            color: rgba(248, 250, 252, 0.88);
            font-size: 1rem;
        }

        .insight-card__meta {
            font-size: 0.9rem;
            color: rgba(248, 250, 252, 0.65);
        }

        .insight-empty {
            color: rgba(248, 250, 252, 0.9);
            font-size: 1rem;
        }

        .insight-card__progress {
            display: grid;

        function resolveHistoryStart(range = selectedHistoryRange) {
            const baseStart = TEMPERATURE_HISTORY_START instanceof Date && !Number.isNaN(TEMPERATURE_HISTORY_START.getTime())
                ? new Date(TEMPERATURE_HISTORY_START)
                : null;
            if (range?.start instanceof Date && !Number.isNaN(range.start.getTime())) {
                return baseStart
                    ? new Date(Math.max(baseStart.getTime(), range.start.getTime()))
                    : new Date(range.start);
            }
            if (Number.isFinite(range?.days)) {
                const date = new Date(Date.now() - range.days * 24 * 60 * 60 * 1000);
                return baseStart
                    ? new Date(Math.max(baseStart.getTime(), date.getTime()))
                    : date;
            }
            return baseStart;

            const startDate = new Date(history[0].timestamp);
            const endDate = new Date(history[history.length - 1].timestamp);

                const outdoorSamples = await loadOutdoorSamplesForRange({
                    startDate,
                    endDate,
                    rangeId: selectedHistoryRange?.id || 'custom'

            const requestStart = startDate.getTime();
            const requestEnd = endDate.getTime();
            const cacheKey = buildOutdoorCacheKey(rangeId);
            const cached = readOutdoorCache(cacheKey, requestStart, requestEnd);
            if (cached) {
                return cached.samples || [];
            }
            const samples = await fetchOutdoorSamples({
                startDate,
                endDate
            });
            writeOutdoorCache(cacheKey, {
                samples,
                rangeStart: requestStart,
                rangeEnd: requestEnd
            });
            return samples;
        }

        function buildOutdoorCacheKey(rangeId) {
            return `${OUTDOOR_CACHE_KEY_PREFIX}:${rangeId || 'custom'}:${OUTDOOR_TIMELINE_VERSION}`;
        }

        function readOutdoorCache(key, requestStart, requestEnd) {
            if (typeof window === 'undefined' || !window.localStorage) {
                return null;
            }
            try {
                const raw = window.localStorage.getItem(key);
                if (!raw) {
                    return null;
                }
                const payload = JSON.parse(raw);
                if (!payload || Date.now() - Number(payload.cachedAt) > OUTDOOR_CACHE_TTL_MS) {
                    return null;
                }
                const cacheStart = Number(payload.rangeStart);
                const cacheEnd = Number(payload.rangeEnd);
                if (Number.isFinite(requestStart) && (!Number.isFinite(cacheStart) || cacheStart > requestStart + OUTDOOR_ALIGNMENT_TOLERANCE_MS)) {
                    return null;
                }
                if (Number.isFinite(requestEnd) && (!Number.isFinite(cacheEnd) || cacheEnd < requestEnd - OUTDOOR_ALIGNMENT_TOLERANCE_MS)) {
                    return null;
                }
                return payload;
            } catch (error) {
                console.warn('Unable to read outdoor cache', error);
                return null;
            }
        }

        function writeOutdoorCache(key, payload) {
            if (typeof window === 'undefined' || !window.localStorage) {
                return;
            }
            try {
                window.localStorage.setItem(key, JSON.stringify({
                    ...payload,
                    cachedAt: Date.now()
                }));
            } catch (error) {
                console.warn('Unable to cache outdoor samples', error);
            }
        }

        async function fetchOutdoorSamples({ startDate, endDate }) {
            if (!startDate || !endDate) {
                return [];
            }
            const startIso = startDate.toISOString();
            const endIso = endDate.toISOString();
            if (typeof window !== 'undefined' && typeof window.getOutdoorSamples === 'function') {
                try {
                    const payload = await window.getOutdoorSamples(startIso, endIso);
                    return normalizeOutdoorSamples(payload);
                } catch (error) {
                    console.warn('getOutdoorSamples failed', error);
                }
            }
            if (!OUTDOOR_HISTORY_ENDPOINT) {
                return [];
            }
            const params = new URLSearchParams();
            params.set('start', startIso);
            params.set('end', endIso);
            try {
                const response = await fetch(`${OUTDOOR_HISTORY_ENDPOINT}?${params.toString()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Outdoor history unavailable');
                }
                const payload = await response.json();
                const points = Array.isArray(payload?.points)
                    ? payload.points
                    : Array.isArray(payload)
                        ? payload
                        : [];
                return normalizeOutdoorSamples(points);
            } catch (error) {
                console.warn('Outdoor history fetch failed', error);
                return [];
            }
        }

        function normalizeOutdoorSamples(samples) {
            if (!Array.isArray(samples)) {
                return [];
            }
            return samples
                .map(entry => {
                    const timestamp = typeof entry.timestamp === 'number'
                        ? entry.timestamp
                        : typeof entry.ts === 'number'
                            ? entry.ts
                            : Date.parse(entry.ts || entry.timestamp || entry.created_at);
                    const value = Number(entry.temp_out_c ?? entry.temp ?? entry.temperature ?? entry.value);
                    if (!Number.isFinite(value) || Number.isNaN(timestamp)) {
                        return null;
                    }
                    const wind = Number(entry.wind_kph ?? entry.wind ?? entry.wind_speed ?? entry.windSpeed);
                    return {
                        value,
                        timestamp,
                        wind_kph: Number.isFinite(wind) ? wind : null
                    };
                })
                .filter(Boolean)
                .sort((a, b) => a.timestamp - b.timestamp);
        }

        function buildHeatHistoryTimeline(history, outdoorSamples, bounds = {}) {
            if (!Array.isArray(history) || !history.length) {
                return [];
            }
            const startBoundary = bounds.startDate instanceof Date && !Number.isNaN(bounds.startDate.getTime())
                ? bounds.startDate.getTime()
                : history[0].timestamp;
            const endBoundary = bounds.endDate instanceof Date && !Number.isNaN(bounds.endDate.getTime())
                ? bounds.endDate.getTime()
                : history[history.length - 1].timestamp;
            if (!Number.isFinite(startBoundary) || !Number.isFinite(endBoundary)) {
                return [];
            }
            return buildUnifiedTimeline({
                start: startBoundary,
                end: endBoundary,
                stepMinutes: TIMELINE_RESOLUTION_MINUTES,
                indoorSamples: history,
                outdoorSamples: outdoorSamples || [],
                indoorToleranceMs: INDOOR_ALIGNMENT_TOLERANCE_MS,
                outdoorToleranceMs: OUTDOOR_ALIGNMENT_TOLERANCE_MS
            });
        }

        async function handleFireJournalSubmit(event) {
            event.preventDefault();
            if (fireJournalSubmitting) {
                return;
            }
            if (!selectedFireSize) {
                flagFireSizeError();
                return;
            }
            const meta = getFireSizeMeta(selectedFireSize);
            if (!meta) {
                flagFireSizeError();
                return;
            }
            const note = dom.fireJournalNote?.value?.trim().slice(0, 240) || '';
            try {
                setFireJournalSubmitting(true);
                const entry = await postFireJournalEntry({ sizeId: meta.id, note });
                addFireJournalEntry(entry);
                if (dom.fireJournalNote) {
                    dom.fireJournalNote.value = '';

                selectedFireSize = null;
                updateFireSizeButtons();
            } catch (error) {
                console.warn('Unable to log fire', error);
                alert('Unable to log fire right now. Please try again.');
            } finally {
                setFireJournalSubmitting(false);
            }

        function loadFireJournalEntries() {
            if (typeof window === 'undefined' || !window.localStorage) {
                return [];

            try {
                const raw = window.localStorage.getItem(FIRE_JOURNAL_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(parsed)) {
                    return [];
                }
                return parsed
                    .map(entry => ({

                    }))

                return;

                window.localStorage.setItem(FIRE_JOURNAL_STORAGE_KEY, JSON.stringify(fireJournalEntries));

                console.warn('Unable to save fire journal', error);

        function addFireJournalEntry(entry) {
            if (!entry || !Number.isFinite(entry.timestamp)) {
                return;
            }
            fireJournalEntries = fireJournalEntries.filter(item => item.id !== entry.id);
            fireJournalEntries.push(entry);
            if (fireJournalEntries.length > FIRE_JOURNAL_MAX_ENTRIES) {
                fireJournalEntries = fireJournalEntries
                    .sort((a, b) => a.timestamp - b.timestamp)
                    .slice(fireJournalEntries.length - FIRE_JOURNAL_MAX_ENTRIES);
            }
            saveFireJournalEntries();
            renderFireJournalEntries();
            refreshInsights();

            if (!sizeId) {

            if (band) {
                return { id: band.id, label: band.title, detail: band.detail };

        async function syncFireJournalFromServer() {
            if (!FIRE_JOURNAL_ENDPOINT) {
                return;

                const entries = await fetchFireJournalEntriesFromServer(FIRE_JOURNAL_MAX_ENTRIES);
                if (Array.isArray(entries)) {

                    saveFireJournalEntries();
                    renderFireJournalEntries();
                    refreshInsights();

        async function fetchFireJournalEntriesFromServer(limit = FIRE_JOURNAL_MAX_ENTRIES) {
            if (!FIRE_JOURNAL_ENDPOINT) {
                return null;
            }
            const params = new URLSearchParams();
            params.set('limit', String(Math.max(1, Math.min(limit, FIRE_JOURNAL_MAX_ENTRIES))));
            const response = await fetch(`${FIRE_JOURNAL_ENDPOINT}?${params.toString()}`, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Fire journal fetch failed (${response.status})`);
            }
            const payload = await response.json();
            const entries = Array.isArray(payload.entries) ? payload.entries : [];
            return entries
                .map(entry => ({
                    id: entry.id || `fire-${entry.timestamp}`,
                    timestamp: Number(entry.timestamp),
                    sizeId: entry.sizeId,
                    sizeLabel: entry.sizeLabel || entry.sizeId,
                    detail: entry.detail || '',
                    note: entry.note || ''
                }))
                .filter(entry => Number.isFinite(entry.timestamp));
        }

        async function postFireJournalEntry({ sizeId, note }) {
            if (!FIRE_JOURNAL_ENDPOINT) {
                throw new Error('Fire journal endpoint unavailable');
            }
            const response = await fetch(FIRE_JOURNAL_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sizeId, note })
            });
            if (!response.ok) {
                let message = 'Unable to log fire';
                try {
                    const payload = await response.json();
                    if (payload?.error) {
                        message = payload.error;
                    }
                } catch (error) {
                    message = await response.text();
                }
                throw new Error(message || 'Unable to log fire');
            }
            const payload = await response.json();
            const entry = payload.entry;
            if (!entry) {
                throw new Error('Invalid response');
            }
            return {
                id: entry.id || `fire-${entry.timestamp}`,
                timestamp: Number(entry.timestamp),
                sizeId: entry.sizeId,
                sizeLabel: entry.sizeLabel || entry.sizeId,
                detail: entry.detail || '',
                note: entry.note || ''
            };
        }


        async function requestData(manualTrigger = false) {
            if (manualTrigger) {
                dom.status.textContent = 'Refreshing…';
            }
            dom.refresh.disabled = true;

            try {
                const [feeds, weather, temperatureHistory] = await Promise.all([
                    Promise.all(FEEDS.map(feed => fetchFeedData(feed))),
                    fetchWeatherData(),
                    fetchTemperatureHistory({
                        limit: TEMPERATURE_HISTORY_LIMIT,
                        startDate: resolveHistoryStart()
                    })
                ]);
                latestFeeds = feeds;
                latestWeather = weather;
                latestHistory = temperatureHistory;
                const { timeline } = await refreshHeatHistoryContext(temperatureHistory);
                updateDashboard(feeds, weather, temperatureHistory);
                updateHeatHistory(feeds.find(feed => feed.id === 'home.temperature'), temperatureHistory, timeline);
                dom.status.textContent = `Updated ${formatDateTime(new Date())} · ${USERNAME} · Last ${DATA_LIMIT} points`;
            } catch (error) {
                console.error(error);
                dom.status.textContent = `Unable to load sensor data: ${error.message}`;
            } finally {
                dom.refresh.disabled = false;
            }
        }

        async function fetchFeedData(feed) {
            const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(USERNAME)}/feeds/${encodeURIComponent(feed.id)}/data?limit=${DATA_LIMIT}`;
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.status === 404) {
                    throw new Error('Feed not found or not public');
                }
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status})`);
                }

                const raw = await response.json();
                const adjustValue = typeof feed.adjust === 'function'
                    ? feed.adjust
                    : (value => value + (typeof feed.offset === 'number' ? feed.offset : 0));

                const data = Array.isArray(raw)
                    ? raw.map(entry => {
                        const rawValue = Number.parseFloat(entry.value);
                        if (!Number.isFinite(rawValue)) {
                            return null;
                        }
                        const adjusted = adjustValue(rawValue);
                        return Number.isFinite(adjusted)
                            ? { value: adjusted, createdAt: entry.created_at }
                            : null;
                    }).filter(Boolean)
                    : [];

                return { ...feed, data };
            } catch (error) {
                return { ...feed, data: [], error: error.message };
            }
        }

        async function fetchWeatherData() {
            if (!WEATHER_LOCATION || !Number.isFinite(WEATHER_LOCATION.latitude) || !Number.isFinite(WEATHER_LOCATION.longitude)) {
                return null;
            }
            const params = new URLSearchParams({
                latitude: WEATHER_LOCATION.latitude,
                longitude: WEATHER_LOCATION.longitude,
                current: 'temperature_2m,relative_humidity_2m,dew_point_2m',
                timezone: 'auto'
            });
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('weather unavailable');
                }
                const payload = await response.json();
                const current = payload?.current || {};
                const temperature = Number(current.temperature_2m);
                const humidity = Number(current.relative_humidity_2m);
                const dewPoint = Number.isFinite(Number(current.dew_point_2m))
                    ? Number(current.dew_point_2m)
                    : computeDewPoint(temperature, humidity);
                const fetchedAt = current.time ? new Date(current.time) : new Date();
                if (!Number.isFinite(temperature)) {
                    return null;
                }
                return {
                    location: WEATHER_LOCATION.name,
                    temperature,
                    humidity: Number.isFinite(humidity) ? humidity : null,
                    dewPoint: Number.isFinite(dewPoint) ? dewPoint : null,
                    fetchedAt,
                    source: 'Open-Meteo'
                };
            } catch (error) {
                console.warn('Weather fetch failed', error);
                return null;
            }
        }

        async function fetchTemperatureHistory({ limit = TEMPERATURE_HISTORY_LIMIT, startDate } = {}) {
            const feed = FEEDS.find(item => item.id === 'home.temperature');
            if (!feed) {
                return [];
            }
            const baseStart = TEMPERATURE_HISTORY_START instanceof Date && !Number.isNaN(TEMPERATURE_HISTORY_START.getTime())
                ? new Date(TEMPERATURE_HISTORY_START)
                : null;
            let rangeStart = baseStart;
            if (startDate instanceof Date && !Number.isNaN(startDate.getTime())) {
                rangeStart = baseStart
                    ? new Date(Math.max(baseStart.getTime(), startDate.getTime()))
                    : new Date(startDate);
            }
            const adjustValue = typeof feed.adjust === 'function'
                ? feed.adjust
                : (value => value + (typeof feed.offset === 'number' ? feed.offset : 0));
            const baseLimit = Number.isFinite(limit) ? Math.max(DATA_LIMIT, Math.floor(limit)) : TEMPERATURE_HISTORY_LIMIT;
            const now = Date.now();
            const samplesPerDay = DATA_LIMIT;
            const spanMs = rangeStart ? Math.max(0, now - rangeStart.getTime()) : 0;
            const spanDays = rangeStart ? Math.max(1, Math.ceil(spanMs / (24 * 60 * 60 * 1000))) : 0;
            const targetSamples = rangeStart
                ? Math.max(baseLimit, Math.min(TEMPERATURE_HISTORY_MAX_POINTS, spanDays * samplesPerDay))
                : Math.min(baseLimit, TEMPERATURE_HISTORY_MAX_POINTS);

            const serverHistory = await fetchServerSideHistory({
                limit: targetSamples,
                startDate: rangeStart,
                adjustValue
            });
            if (Array.isArray(serverHistory) && serverHistory.length) {
                return serverHistory;
            }

            const entries = [];
            let nextEndTime = Date.now();
            let guard = 0;

            while (entries.length < targetSamples && guard < 500) {
                const remaining = targetSamples - entries.length;
                if (remaining <= 0) {
                    break;
                }
                const chunkLimit = Math.min(TEMPERATURE_HISTORY_CHUNK, remaining);
                const params = new URLSearchParams({ limit: chunkLimit });
                if (nextEndTime) {
                    params.set('end_time', new Date(nextEndTime).toISOString());
                }
                const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(USERNAME)}/feeds/${encodeURIComponent(feed.id)}/data?${params.toString()}`;
                let response;
                try {
                    response = await fetch(url, { cache: 'no-store' });
                } catch (networkError) {
                    console.warn('Temperature history request failed', networkError);
                    break;
                }
                if (response.status === 404) {
                    console.warn('Temperature feed not found for history fetch');
                    break;
                }
                if (!response.ok) {
                    console.warn(`Temperature history chunk failed (${response.status})`);
                    break;
                }
                const raw = await response.json();
                if (!Array.isArray(raw) || !raw.length) {
                    break;
                }
                const chunk = raw
                    .map(entry => {
                        const rawValue = Number.parseFloat(entry.value);
                        const timestamp = Date.parse(entry.created_at ?? entry.createdAt);
                        if (!Number.isFinite(rawValue) || Number.isNaN(timestamp)) {
                            return null;
                        }
                        const adjusted = adjustValue(rawValue);
                        return Number.isFinite(adjusted)
                            ? { value: adjusted, timestamp }
                            : null;
                    })
                    .filter(Boolean);
                if (!chunk.length) {
                    break;
                }
                entries.push(...chunk);
                const oldestTs = chunk.reduce((acc, entry) => Math.min(acc, entry.timestamp), Number.POSITIVE_INFINITY);
                if (!Number.isFinite(oldestTs)) {
                    break;
                }
                nextEndTime = oldestTs - 1000;
                if (rangeStart && oldestTs <= rangeStart.getTime()) {
                    break;
                }
                guard += 1;
            }

            if (!entries.length) {
                return [];
            }

            const filtered = entries
                .filter(entry => !rangeStart || entry.timestamp >= rangeStart.getTime())
                .sort((a, b) => a.timestamp - b.timestamp);
            const maxReturn = Math.min(targetSamples, TEMPERATURE_HISTORY_MAX_POINTS);
            if (filtered.length > maxReturn) {
                return filtered.slice(filtered.length - maxReturn);
            }
            return filtered;
        }

        async function fetchServerSideHistory({ limit, startDate, adjustValue }) {
            if (!HISTORY_API_ENDPOINT) {
                return null;
            }
            const params = new URLSearchParams();
            if (Number.isFinite(limit)) {
                params.set('limit', String(limit));
            }
            if (startDate instanceof Date && !Number.isNaN(startDate.getTime())) {
                params.set('start', startDate.toISOString());
            }
            const url = `${HISTORY_API_ENDPOINT}${params.toString() ? `?${params.toString()}` : ''}`;
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('History endpoint unavailable');
                }
                const payload = await response.json();
                const points = Array.isArray(payload?.points)
                    ? payload.points
                    : Array.isArray(payload)
                        ? payload
                        : [];
                if (!points.length) {
                    return null;
                }
                return points
                    .map(point => {
                        const rawValue = Number(point.value);
                        const timestamp = typeof point.timestamp === 'number'
                            ? point.timestamp
                            : Date.parse(point.timestamp);
                        if (!Number.isFinite(rawValue) || Number.isNaN(timestamp)) {
                            return null;
                        }
                        const adjusted = adjustValue(rawValue);
                        return Number.isFinite(adjusted)
                            ? { value: adjusted, timestamp }
                            : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.timestamp - b.timestamp);
            } catch (error) {
                console.warn('History API failed; falling back to Adafruit public data.', error);
                return null;
            }
        }

        function updateDashboard(feeds, weather, temperatureHistory) {
            const latestPayload = buildLatestPayload(feeds);
            if (latestPayload) {
                exposeLatestJson(latestPayload);
            }
            const seen = new Set();

            feeds.forEach(feed => {
                if (!feed || !feed.id) {
                    return;
                }
                seen.add(feed.id);
                if (feed.showCard !== false) {
                    renderMetricCard(feed);
                }
                if (feed.showDetail !== false) {
                    renderDetailCard(feed);
                }
            });

            removeStaleCards(dom.metricGrid, seen, 'card');
            removeStaleCards(dom.detailGrid, seen, 'detail');
            updateInsights(feeds, weather, temperatureHistory);
        }

        function refreshInsights() {
            if (!latestFeeds || !latestFeeds.length) {
                return;
            }
            updateInsights(latestFeeds, latestWeather, latestHistory);
        }

        function updateHeatHistory(feed, history, timeline = latestHeatTimeline) {
            if (!dom.heatHistoryCanvas || !dom.heatHistorySummary) {
                return;
            }
            if (!feed || !Array.isArray(history) || !history.length) {
                dom.heatHistorySummary.textContent = 'Need more readings to render heat history.';
                if (dom.heatHistoryRange) {
                    dom.heatHistoryRange.textContent = 'Range unavailable';
                }
                updateHeatDeltaChip(null);
                resetHeatHistoryChart();
                return;
            }
            const points = history
                .filter(entry => Number.isFinite(entry.value) && Number.isFinite(entry.timestamp))
                .map(entry => ({ x: entry.timestamp, y: entry.value }));
            if (!points.length) {
                dom.heatHistorySummary.textContent = 'Waiting for valid readings.';
                resetHeatHistoryChart();
                return;
            }
            points.sort((a, b) => a.x - b.x);
            const values = points.map(point => point.y);
            const min = Math.min(...values);
            const max = Math.max(...values);
            const unitLabel = feed.unit || '°C';
            const startDate = new Date(points[0].x);
            const endDate = new Date(points[points.length - 1].x);
            const startLabel = formatDateTime(startDate);
            const endLabel = formatDateTime(endDate);
            dom.heatHistorySummary.textContent = `High ${formatNumber(max)}${unitLabel} / Low ${formatNumber(min)}${unitLabel} · ${startLabel} → ${endLabel}`;
            if (dom.heatHistoryRange) {
                dom.heatHistoryRange.textContent = formatHistoryRangeLabel(startDate, endDate);
            }

            let timelineSeries = Array.isArray(timeline) && timeline.length
                ? timeline
                : buildHeatHistoryTimeline(history, latestOutdoorSamples, { startDate, endDate });
            if (!Array.isArray(timelineSeries)) {
                timelineSeries = [];
            }
            latestHeatTimeline = timelineSeries;
            const indoorTimeline = timelineSeries.length
                ? timelineSeries
                    .filter(entry => Number.isFinite(entry.temp_in_c))
                    .map(entry => ({ x: entry.timestamp, y: entry.temp_in_c }))
                : points.slice();
            const outdoorTimeline = timelineSeries.length
                ? timelineSeries
                    .filter(entry => Number.isFinite(entry.temp_out_c))
                    .map(entry => ({ x: entry.timestamp, y: entry.temp_out_c }))
                : [];
            updateHeatDeltaChip(timelineSeries);

        function updateHeatDeltaChip(timeline) {
            if (!dom.heatHistoryDelta) {
                return;
            }
            if (!Array.isArray(timeline) || !timeline.length) {
                dom.heatHistoryDelta.textContent = 'ΔT —';
                dom.heatHistoryDelta.title = 'Need indoor & outdoor data to compute delta';
                return;
            }
            for (let i = timeline.length - 1; i >= 0; i--) {
                const entry = timeline[i];
                if (Number.isFinite(entry?.temp_in_c) && Number.isFinite(entry?.temp_out_c)) {
                    const delta = entry.temp_in_c - entry.temp_out_c;
                    dom.heatHistoryDelta.textContent = `ΔT ${formatNumber(delta)}°C`;
                    dom.heatHistoryDelta.title = `Indoor ${formatNumber(entry.temp_in_c)}°C vs Outdoor ${formatNumber(entry.temp_out_c)}°C`;
                    return;
                }
            }
            dom.heatHistoryDelta.textContent = 'ΔT —';
            dom.heatHistoryDelta.title = 'Need indoor & outdoor data to compute delta';
        }

        function updateInsights(feeds, weather, temperatureHistory) {
            if (!dom.insightsGrid) {
                return;
            }

            const temperatureFeed = feeds.find(feed => feed.id === 'home.temperature');
            const humidityFeed = feeds.find(feed => feed.id === 'home.humidity');
            const pressureFeed = feeds.find(feed => feed.id === 'home.pressure');
            const airFeed = feeds.find(feed => feed.id === 'home.gas');
            const historicalSeries = Array.isArray(temperatureHistory) && temperatureHistory.length
                ? temperatureHistory
                    .slice()
                    .sort((a, b) => (a.timestamp ?? 0) - (b.timestamp ?? 0))
                    .map(point => ({
                        value: point.value,
                        created_at: new Date(point.timestamp).toISOString()
                    }))
                : null;
            const primaryTempFeed = temperatureFeed || { id: 'home.temperature', name: 'Indoor temperature', unit: '°C', data: [] };
            const analysisSource = historicalSeries
                ? { ...primaryTempFeed, data: historicalSeries }
                : primaryTempFeed;
            const fireAnalysis = analyzeFireCycles(analysisSource, { fireJournalEntries });
            const normalizedIntervals = Array.isArray(latestHeatTimeline) && latestHeatTimeline.length
                ? computeNormalizedCoolingIntervals({
                    timeline: latestHeatTimeline,
                    fireEvents: fireAnalysis?.events
                })
                : [];
            const coolingAnomalies = normalizedIntervals.length
                ? computeCoolingAnomalies({
                    intervals: normalizedIntervals,
                    timeline: latestHeatTimeline
                })
                : [];

            const coverage = deriveHistoryCoverage(temperatureHistory)
                || deriveCoverage([temperatureFeed, humidityFeed, pressureFeed, airFeed]);
            if (dom.insightsSummary) {
                const parts = [];
                if (coverage) {
                    parts.push(`Based on ${coverage.totalMs ? formatDuration(coverage.totalMs) : 'recent'} indoor readings`);
                    if (weather?.fetchedAt) {
                        parts.push(`Weather synced ${formatTime(weather.fetchedAt)}`);
                    }
                    dom.insightsSummary.textContent = `${parts.join(' · ')}`;
                } else {
                    dom.insightsSummary.textContent = 'Waiting for enough readings to build insights.';
                }
            }

            renderInsightReports(buildFuelEfficiencyReports({
                fireAnalysis,
                temperatureFeed,
                weather,
                heatTimeline: latestHeatTimeline,
                normalizedIntervals,
                coolingAnomalies
            }));
        }

        function renderInsightReports(items) {
            if (!dom.insightsGrid) {
                return;
            }
            if (!items.length) {
                dom.insightsGrid.innerHTML = '<p class="insight-empty">Need more data to surface insights.</p>';
                return;
            }
            const sortedItems = items.slice().sort((a, b) => {
                const priorityA = Number.isFinite(a.priority) ? a.priority : 99;
                const priorityB = Number.isFinite(b.priority) ? b.priority : 99;
                if (priorityA === priorityB) {
                    return (a.label || '').localeCompare(b.label || '');
                }
                return priorityA - priorityB;
            });
            dom.insightsGrid.innerHTML = '';
            sortedItems.forEach(item => {
                const report = document.createElement('article');
                report.className = `insight-report${item.variant ? ` insight-card--${item.variant}` : ''}`;
                report.dataset.insightId = item.id;

                const header = document.createElement('div');
                const badge = document.createElement('p');
                badge.className = 'insight-report__badge';
                badge.textContent = item.badge || 'Fuel Tuning';
                const title = document.createElement('h3');
                title.className = 'insight-report__title';
                title.textContent = item.label || 'Insight';
                header.appendChild(badge);
                header.appendChild(title);
                report.appendChild(header);

                const summary = document.createElement('p');
                summary.className = 'insight-report__lede';
                summary.textContent = item.summary || '';
                report.appendChild(summary);

                if (Array.isArray(item.points) && item.points.length) {
                    const list = document.createElement('ul');
                    list.className = 'insight-report__bullets';
                    item.points.forEach(point => {
                        const li = document.createElement('li');
                        const label = document.createElement('span');
                        label.textContent = point.label ? `${point.label}:` : '';
                        const detail = document.createElement('span');
                        detail.textContent = point.detail || '';
                        li.appendChild(label);
                        li.appendChild(detail);
                        list.appendChild(li);
                    });
                    report.appendChild(list);
                }

                if (item.table && Array.isArray(item.table.headers) && Array.isArray(item.table.rows)) {
                    report.appendChild(buildInsightTable(item.table));

                    button.addEventListener('click', () => {

                    });
                    report.appendChild(button);
                }

                dom.insightsGrid.appendChild(report);
            });

        function buildInsightTable(tableData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'insight-table';
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            tableData.headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            tableData.rows.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrapper.appendChild(table);

        function downsampleHistoryPoints(points, limit = 2000) {
            if (!Array.isArray(points) || points.length <= limit) {
                return points || [];
            }
            const stride = Math.ceil(points.length / limit);
            const sample = [];
            for (let i = 0; i < points.length; i += stride) {
                sample.push(points[i]);
            }
            const lastPoint = points[points.length - 1];
            if (sample[sample.length - 1] !== lastPoint) {
                sample.push(lastPoint);
            }
            return sample;
        }

        function removeStaleCards(container, seenSet, type) {
            Array.from(container.children).forEach(child => {
                if (!seenSet.has(child.dataset.feedId)) {
                    const chart = charts.get(child.dataset.feedId);
                    if (chart) {
                        chart.destroy();
                        charts.delete(child.dataset.feedId);
                    }
                    child.remove();
                } else if (type === 'card') {
                    const feed = FEEDS.find(item => item.id === child.dataset.feedId);
                    if (feed && feed.showCard === false) {
                        const chart = charts.get(child.dataset.feedId);
                        if (chart) {
                            chart.destroy();
                            charts.delete(child.dataset.feedId);
                        }
                        child.remove();
                    }
                } else if (type === 'detail') {
                    const feed = FEEDS.find(item => item.id === child.dataset.feedId);
                    if (feed && feed.showDetail === false) {
                        const chart = charts.get(child.dataset.feedId);
                        if (chart) {
                            chart.destroy();
                            charts.delete(child.dataset.feedId);
                        }
                        child.remove();
                    }
                }

            });
        }

        function setCardVisualState(card, state, feedId) {
            CARD_STATE_CLASS_VALUES.forEach(cls => card.classList.remove(cls));
            const nextClass = resolveStateClass(state, feedId);
            card.classList.add(nextClass);
        }

        function determineCardState(feed, readings) {
            if (!readings.length) {
                return 'alert';
            }
            const latest = readings[0];

            if (typeof feed.coldBelow === 'number') {
                const coldThreshold = feed.coldBelow;
                const superColdThreshold = typeof feed.superColdBelow === 'number' ? feed.superColdBelow : null;
                const warmThreshold = typeof feed.warmAbove === 'number' ? feed.warmAbove : null;
                const warmMidThreshold = typeof feed.warmMidAbove === 'number' ? feed.warmMidAbove : null;

                if (warmThreshold !== null && latest.value >= warmThreshold) {
                    return 'warm';
                }
                if (warmMidThreshold !== null && latest.value >= warmMidThreshold) {
                    return 'superwarm';
                }
                if (superColdThreshold !== null && latest.value < superColdThreshold) {
                    return 'supercold';
                }
                if (latest.value < coldThreshold) {
                    return 'cold';
                }
                return 'ok';
            }

            if (Array.isArray(feed.goodRange) && feed.goodRange.length === 2) {
                const [min, max] = feed.goodRange;
                if (latest.value >= min && latest.value <= max) {
                    return 'ok';
                }
                return 'alert';
            }

            if (feed.preferLower) {
                const average = readings.reduce((sum, entry) => sum + entry.value, 0) / readings.length;
                return latest.value <= average ? 'ok' : 'alert';
            }

            if (feed.preferHigher) {
                const average = readings.reduce((sum, entry) => sum + entry.value, 0) / readings.length;
                return latest.value >= average ? 'ok' : 'alert';
            }

            return 'ok';
        }

        function resolveStateClass(state, feedId) {
            if (feedId === 'home.temperature') {
                if (state === 'ok') {
                    return 'metric-card--temperature-ok';
                }
                if (state === 'supercold') {
                    return 'metric-card--supercold';
                }
                if (state === 'superwarm') {
                    return 'metric-card--temperature-superwarm';
                }
                return CARD_STATE_CLASSES[state] || CARD_STATE_CLASSES.ok;
            }
            if (feedId === 'home.humidity') {
                return state === 'alert' ? 'metric-card--humidity-alert' : 'metric-card--humidity-ok';
            }
            if (feedId === 'home.pressure') {
                return state === 'alert' ? 'metric-card--pressure-alert' : 'metric-card--pressure-ok';
            }
            return CARD_STATE_CLASSES[state] || CARD_STATE_CLASSES.ok;
        }

            if (feedId === 'home.temperature') {

                detailEl.classList.add('humidity-detail');
            } else if (feedId === 'home.pressure') {

        function getEmojiForFeed(feed, state) {
            if (!feed || !feed.emoji) {
                return '✨';
            }
            return feed.emoji[state] || feed.emoji.default || '✨';
        }

        function buildDetailSummary(feed, latestValue, average, unit, sampleCount) {
            const base = `Latest ${formatNumber(latestValue)} ${unit || ''} · Avg ${formatNumber(average)} ${unit || ''} (${sampleCount} points)`;

            if (!feed) {
                return base;
            }

            let mood = 'ok';
            let extra = '';

            if (feed.id === 'home.temperature') {
                if (latestValue >= 24) {
                    mood = 'hot';
                } else if (latestValue >= 21) {
                    mood = 'warm';
                } else if (latestValue < 16) {
                    mood = 'supercold';
                } else if (latestValue < 19) {
                    mood = 'cold';
                }
            } else if (feed.id === 'home.humidity') {
                if (latestValue < 35) {
                    mood = 'low';
                } else if (latestValue > 65) {
                    mood = 'high';
                }
            } else if (feed.id === 'home.pressure') {
                if (latestValue < 1000) {
                    mood = 'low';
                } else if (latestValue > 1020) {
                    mood = 'high';
                }
            } else if (feed.id === 'home.gas') {
                const insight = typeof feed.interpret === 'function' ? feed.interpret(latestValue) : null;
                if (insight && insight.label && insight.advice) {
                    extra = `${insight.label}: ${insight.advice}`;
                    if (insight.alert) {
                        mood = 'alert';
                    }
                } else if (latestValue > 200) {
                    mood = 'alert';
                }
            }

            const humor = pickHumorLine(feed.id, mood);
            const parts = [base];
            if (extra) {
                parts.push(extra);
            }
            if (humor) {
                parts.push(humor);
            }
            return parts.join(' · ');
        }

        function pickHumorLine(feedId, mood) {

        function normalizeFireJournalEntries(entries, series) {
            if (!Array.isArray(entries) || !entries.length) {

            const normalized = entries
                .map(entry => ({
                    id: entry.id,
                    timestamp: Number(entry.timestamp),
                    sizeId: entry.sizeId || '',
                    sizeLabel: entry.sizeLabel || entry.sizeId || 'Logged fire',
                    detail: entry.detail || '',
                    note: entry.note || ''
                }))
                .filter(entry => Number.isFinite(entry.timestamp));
            if (!normalized.length) {
                return [];
            }
            const sorted = normalized.sort((a, b) => a.timestamp - b.timestamp);
            if (!Array.isArray(series) || !series.length) {
                return sorted;
            }
            const earliest = series[0].timestamp;
            const latest = series[series.length - 1].timestamp;
            return sorted.filter(entry => {
                if (Number.isFinite(earliest) && entry.timestamp < earliest - FIRE_JOURNAL_SYNTH_WINDOW_MS) {
                    return false;
                }
                if (Number.isFinite(latest) && entry.timestamp > latest + FIRE_JOURNAL_SYNTH_WINDOW_MS) {

                    match.startTime = entry.timestamp;
                    const sample = estimateSeriesSample(series, entry.timestamp);
                    if (sample) {

                        if (Number.isFinite(match.peakValue)) {

                        }
                    }
                    if (Number.isFinite(match.peakTime)) {

                    }
                } else {

                        synthetic.fireJournal = entry;
                        events.push(synthetic);
                    }
                }
            });
            events.sort((a, b) => {

                const tsB = b.startTime ?? b.peakTime ?? 0;

            events.forEach(event => {

                    ? event.startTime

                        ? event.peakTime
                        : null;

                    return;
                }

        function synthesizeJournalDrivenEvent(series, entry) {

            const startIndex = findSeriesIndexAtOrBefore(series, sample.timestamp);

                    continue;

            const summary = direction === 'steady'
