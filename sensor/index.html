<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonehedge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hepta+Slab:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.65) 60%, rgba(15, 23, 42, 0.75) 100%);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('https://2338566ace915f8ce11c.cdn6.editmysite.com/uploads/b/2338566ace915f8ce11c36f2d1f1fe4ce369a03028f314bd74f1b5602b799014/aboutus_1676333736.png?width=2400&optimize=medium');
            background-size: cover;
            background-position: center;
            filter: saturate(1.1) contrast(0.95) brightness(0.8);
            z-index: -2;
        }

        .layout {
            width: min(1100px, 100%);
            background: rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 25px 60px -20px rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            padding: 3rem clamp(1.5rem, 2vw, 3rem);
            display: grid;
            gap: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .view-tabs {
            display: inline-flex;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.35rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            width: fit-content;
        }

        .view-tab {
            border: none;
            background: transparent;
            color: rgba(248, 250, 252, 0.85);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.5rem 1.35rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-tab:hover {
            color: #fff;
        }

        .view-tab--active {
            background: rgba(248, 250, 252, 0.22);
            color: #0f172a;
            box-shadow: 0 10px 20px -15px rgba(15, 23, 42, 0.8);
        }

        .page-header__text {
            display: grid;
            gap: 0.5rem;
        }

        .page-header h1 {
            font-family: 'Hepta Slab', 'Inter', serif;
            font-size: clamp(2.2rem, 4.2vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #f8fafc;
            text-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
        }

        .status-message {
            font-size: 0.95rem;
            color: rgba(226, 232, 240, 0.85);
        }

        .refresh-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(248, 250, 252, 0.15);
            color: #e0e7ff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 12px 30px -18px rgba(15, 23, 42, 0.9);
        }

        .refresh-button:hover:not(:disabled) {
            transform: translateY(-2px) rotate(10deg);
            background: rgba(99, 102, 241, 0.25);
            box-shadow: 0 12px 30px -12px rgba(99, 102, 241, 0.4);
        }

        .refresh-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
        }

        .metric-card {
            border-radius: 22px;
            padding: 1.5rem;
            color: #f8fafc;
            display: grid;
            gap: 1.25rem;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            box-shadow: 0 15px 35px -20px rgba(15, 23, 42, 0.7);
            position: relative;
            overflow: hidden;
        }

        .metric-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.12), transparent 55%);
            opacity: 0.85;
            pointer-events: none;
        }

        .metric-emoji {
            position: absolute;
            font-size: clamp(8.5rem, 9vw, 5.5rem);
            opacity: 0.4;
            top: -0.4rem;
            right: -0.2rem;
            z-index: 0;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.35));
            user-select: none;
            pointer-events: none;
        }

        .metric-card > *:not(.metric-emoji) {
            position: relative;
            z-index: 1;
        }

        .metric-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
            font-family: 'Hepta Slab', 'Inter', serif;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .metric-value {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 600;
        }

        .metric-value span:last-child {
            font-size: clamp(1.3rem, 1.7vw, 2rem);
            opacity: 0.85;
            font-weight: 500;
        }

        .view {
            display: grid;
            gap: 2rem;
        }

        .view[hidden] {
            display: none !important;
        }

        .metric-extrema {
            display: flex;
            justify-content: space-between;
            gap: 1.25rem;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .metric-timestamp {
            font-size: 0.85rem;
            color: rgba(248, 250, 252, 0.85);
            letter-spacing: 0.02em;
        }

        .metric-extrema__item {
            display: grid;
            gap: 0.25rem;
        }

        .metric-extrema__label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.85;
        }

        .metric-extrema__value {
            font-weight: 600;
            font-size: clamp(1.1rem, 1.4vw, 1.6rem);
        }

        .metric-extrema__time {
            font-size: clamp(0.85rem, 1vw, 1.05rem);
            opacity: 0.85;
        }

        .metric-error {
            font-size: 0.85rem;
            color: #fca5a5;
            font-weight: 500;
        }

        .metric-card.metric-card--cold {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.97) 0%, rgba(37, 99, 235, 0.95) 45%, rgba(14, 165, 233, 0.92) 100%);
        }

        .metric-card.metric-card--supercold {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 64, 175, 0.96) 45%, rgba(8, 47, 73, 0.94) 100%);
        }

        .metric-card.metric-card--warm {
            background: linear-gradient(135deg, rgba(124, 45, 18, 0.98) 0%, rgba(194, 65, 12, 0.95) 50%, rgba(245, 158, 11, 0.9) 100%);
        }

        .metric-card.metric-card--ok {
            background: linear-gradient(135deg, rgba(7, 89, 133, 0.96) 0%, rgba(6, 95, 70, 0.94) 50%, rgba(22, 163, 74, 0.9) 100%);
        }

        .metric-card.metric-card--temperature-ok {
            background: linear-gradient(135deg, rgba(146, 64, 14, 0.9) 0%, rgba(234, 178, 80, 0.9) 45%, rgba(253, 224, 71, 0.85) 100%);
        }

        .metric-card.metric-card--temperature-superwarm {
            background: linear-gradient(135deg, rgba(148, 44, 22, 0.98) 0%, rgba(220, 38, 38, 0.94) 45%, rgba(245, 158, 11, 0.92) 100%);
        }

        .metric-card.metric-card--alert {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.95) 0%, rgba(249, 115, 22, 0.92) 50%, rgba(255, 195, 113, 0.9) 100%);
        }

        .metric-card.metric-card--humidity-ok {
            background: linear-gradient(135deg, rgba(8, 145, 178, 0.96) 0%, rgba(6, 182, 212, 0.94) 40%, rgba(16, 185, 129, 0.92) 100%);
        }

        .metric-card.metric-card--humidity-alert {
            background: linear-gradient(135deg, rgba(219, 176, 85, 0.96) 0%, rgba(203, 143, 32, 0.94) 45%, rgba(181, 124, 27, 0.9) 100%);
        }

        .metric-card.metric-card--pressure-ok {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.96) 0%, rgba(59, 130, 246, 0.94) 55%, rgba(129, 140, 248, 0.92) 100%);
        }

        .metric-card.metric-card--pressure-alert {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.95) 50%, rgba(71, 85, 105, 0.9) 100%);
        }

        .metric-card.metric-card--error {
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.95) 0%, rgba(185, 28, 28, 0.95) 100%);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.75rem;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            padding: 1.75rem;
            border: 1px solid rgba(203, 213, 225, 0.8);
            display: grid;
            gap: 1.5rem;
            box-shadow: 0 20px 35px -30px rgba(15, 23, 42, 0.6);
        }

        .detail-card.temperature-detail,
        .detail-card.humidity-detail,
        .detail-card.pressure-detail,
        .detail-card.air-detail {
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .detail-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: inherit;
            font-family: 'Hepta Slab', 'Inter', serif;
        }

        .detail-summary {
            color: inherit;
            opacity: 0.85;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .detail-chart {
            height: clamp(220px, 40vh, 320px);
        }

        .detail-chart canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .detail-list {
            list-style: none;
            display: grid;
            gap: 0.6rem;
            font-size: 0.95rem;
            color: #1f2937;
        }

        .detail-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.4);
            font-variant-numeric: tabular-nums;
        }

        .detail-list li:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-error {
            color: #b91c1c;
            font-weight: 500;
        }

        .insight-hero {
            background: rgba(15, 23, 42, 0.75);
            border-radius: 24px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 35px -25px rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            color: #f1f5f9;
        }

        .insight-hero h2 {
            font-size: 2rem;
            margin-bottom: 0.35rem;
            font-family: 'Hepta Slab', 'Inter', serif;
        }

        .insight-hero p {
            color: rgba(248, 250, 252, 0.8);
            font-size: 1rem;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.1rem;
        }

        .insight-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 1.5rem;
            border: 1px solid rgba(203, 213, 225, 0.6);
            display: grid;
            gap: 0.75rem;
            box-shadow: 0 15px 30px -20px rgba(15, 23, 42, 0.5);
        }

        .insight-card--fire {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.8), rgba(255, 244, 215, 0.8));
            border-color: rgba(248, 113, 113, 0.6);
        }

        .insight-card--risk {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(180, 212, 201, 0.8));
            border-color: rgba(59, 130, 246, 0.55);
        }

        .insight-card--weather {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.8), rgba(200, 201, 239, 0.8));
            border-color: rgba(14, 165, 233, 0.55);
        }

        .insight-card__icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.08);
            font-size: 1.4rem;
        }

        .insight-card__header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .insight-card__label {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.85rem;
            color: #475569;
        }

        .insight-card__value {
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 600;
            color: #0f172a;
        }

        .insight-card__summary {
            color: #334155;
            font-size: 0.95rem;
        }

        .insight-card__meta {
            font-size: 0.85rem;
            color: #64748b;
        }

        .insight-empty {
            color: rgba(248, 250, 252, 0.9);
            font-size: 1rem;
        }

        .insight-card__progress {
            display: grid;
            gap: 0.3rem;
        }

        .insight-progress-bar {
            width: 100%;
            height: 0.45rem;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.4);
            overflow: hidden;
            position: relative;
        }

        .insight-progress-bar span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #f87171, #fb923c);
            border-radius: inherit;
        }

        .insight-progress-label {
            font-size: 0.8rem;
            color: #475569;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .layout {
                padding: 2.25rem 1.5rem;
                border-radius: 0px;
            }

            .view-tabs {
                width: 100%;
                justify-content: center;
            }

            .refresh-button {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
                margin-left: auto;
            }

            .metric-extrema {
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        @media (max-width: 640px) {
            .layout {
                padding: 0.5rem;
                gap: 0.8rem;
            }

            .page-header {
                align-items: center;
                gap: 1rem;
            }

            .page-header__text {
                width: 100%;
            }

            .refresh-button {
                width: 34px;
                height: 34px;
                font-size: 1rem;
                margin-left: auto;
            }

            .metric-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.5rem;
            }

            .metric-card {
                padding: 0.9rem 0.5rem;
                border-radius: 16px;
                min-height: 132px;
            }

            .metric-title {
                font-size: 0.75rem;
            }

            .metric-value {
                font-size: 1.2rem;
            }

            .metric-extrema {
                gap: 0.5rem;
            }

            .metric-extrema__label {
                font-size: 0.65rem;
            }

            .metric-extrema__value {
                font-size: 0.95rem;
            }

            .metric-extrema__time {
                font-size: 0.7rem;
            }

            .metric-timestamp {
                font-size: 0.75rem;
            }

            .detail-card {
                padding: 1rem;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
            .metric-card {
                gap: 0.1rem;
            }
            .metric-value span:last-child {
                font-size: 1rem;
            }
            .insights-grid {
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            }
        }
    </style>
</head>
<body>
    <main class="layout">
        <header class="page-header">
            <div class="page-header__text">
                <h1>Stonehedge</h1>
                <p id="status-message" class="status-message">Loading sensor data…</p>
            </div>
            <button id="refresh-btn" type="button" class="refresh-button" aria-label="Refresh">
                <span aria-hidden="true">⟳</span>
            </button>
        </header>

        <nav id="view-tabs" class="view-tabs" role="tablist" aria-label="Sensor views">
            <button id="tab-dashboard" type="button" role="tab" aria-selected="true" class="view-tab view-tab--active" data-view-tab="dashboard">
                Live dashboard
            </button>
            <button id="tab-insights" type="button" role="tab" aria-selected="false" class="view-tab" data-view-tab="insights" tabindex="-1">
                Insights
            </button>
        </nav>

        <section id="dashboard-view" class="view view--active" role="tabpanel" aria-labelledby="tab-dashboard">
            <section id="metric-cards" class="metric-grid" aria-live="polite"></section>
            <section id="feed-details" class="detail-grid"></section>
        </section>

        <section id="insights-view" class="view" role="tabpanel" aria-labelledby="tab-insights" hidden>
            <div class="insight-hero">
                <div>
                    <h2>Insights</h2>
                    <p id="insights-summary">Waiting for enough readings to build insights.</p>
                </div>
            </div>
            <section id="insights-grid" class="insights-grid" aria-live="polite"></section>
        </section>

        <script id="stonehedge-latest-json" type="application/json" data-status="pending"></script>
    </main>

    <script>
        const REFRESH_INTERVAL = 60000;
        const USERNAME = 'sblackt';
        const DATA_LIMIT = 288;
        const HUMOR_LINES = {

        const humorCursor = new Map();
        const WEATHER_LOCATION = {

        };

        // Adjust thresholds/behaviour per feed as needed.
        const FEEDS = [
            {
                id: 'home.temperature',
                name: 'Temperature',
                unit: '°C',
                color: '#6366f1',
                coldBelow: 19,
                superColdBelow: 17,
                warmAbove: 22,
                warmMidAbove: 20,
                showCard: true,
                showDetail: true,
                offset: -3.3,
                emoji: { warm: '🔥', superwarm: '😅', supercold: '🧊', cold: '🥶', ok: '😌', default: '😌' }
            },
            {
                id: 'home.humidity',
                name: 'Humidity',
                unit: '%',
                color: '#22c55e',
                goodRange: [40, 60],
                showCard: true,
                showDetail: true,
                emoji: { ok: '💧', alert: '🌵', default: '💧' }
            },
            {
                id: 'home.pressure',
                name: 'Pressure',
                unit: 'hPa',
                color: '#f97316',
                goodRange: [980, 1025],
                showCard: true,
                showDetail: true,
                emoji: { ok: '☁️', alert: '🌪️', default: '🌤️' }
            },
            {
                id: 'home.gas',
                name: 'Air Quality',
                unit: 'IAQ',
                color: '#facc15',
                preferLower: true,
                showCard: false,
                showDetail: true,
                emoji: { ok: '🌿', alert: '🏭', default: '🌿' },
                interpret(value) {
                    if (value >= 200) return { label: 'Fresh', advice: 'Air smells great. Keep it up!' };
                    if (value >= 120) return { label: 'Normal', advice: 'Comfortable. Crack a window occasionally.' };
                    return { label: 'Stuffy', advice: 'VOC buildup detected. Ventilate the room.' };
                }
            },
            {
                id: 'home.altitude',
                name: 'Altitude',
                unit: 'm',
                color: '#0ea5e9',
                preferLower: true,
                showCard: false,
                showDetail: false
            }
        ];

        const CARD_STATE_CLASSES = {
            cold: 'metric-card--cold',
            warm: 'metric-card--warm',
            ok: 'metric-card--ok',
            alert: 'metric-card--alert',
            error: 'metric-card--error'
        };

        const CARD_STATE_CLASS_VALUES = [
            ...Object.values(CARD_STATE_CLASSES),
            'metric-card--humidity-ok',
            'metric-card--humidity-alert',
            'metric-card--pressure-ok',
            'metric-card--pressure-alert',
            'metric-card--temperature-ok',
            'metric-card--supercold'
        ];

        const dom = {
            status: document.getElementById('status-message'),
            refresh: document.getElementById('refresh-btn'),
            metricGrid: document.getElementById('metric-cards'),
            detailGrid: document.getElementById('feed-details'),
            viewTabs: document.getElementById('view-tabs'),
            dashboardView: document.getElementById('dashboard-view'),
            insightsView: document.getElementById('insights-view'),
            insightsGrid: document.getElementById('insights-grid'),
            insightsSummary: document.getElementById('insights-summary')
        };

        const charts = new Map();
        let refreshTimer = null;
        let activeView = 'dashboard';
        let latestWeather = null;

        init();

        function init() {
            initViewTabs();
            if (dom.refresh) {
                dom.refresh.addEventListener('click', () => requestData(true));
            }
            requestData(true);
            scheduleRefresh();
            document.addEventListener('visibilitychange', handleVisibilityChange);
        }

        function initViewTabs() {
            if (!dom.viewTabs) {
                return;
            }
            const buttons = dom.viewTabs.querySelectorAll('[data-view-tab]');
            buttons.forEach(button => {
                button.addEventListener('click', () => switchView(button.dataset.viewTab));
            });
        }

        function switchView(nextView) {
            if (!nextView || nextView === activeView) {
                return;
            }
            activeView = nextView;

            if (dom.viewTabs) {
                const buttons = dom.viewTabs.querySelectorAll('[data-view-tab]');
                buttons.forEach(button => {
                    const isTarget = button.dataset.viewTab === nextView;
                    button.classList.toggle('view-tab--active', isTarget);
                    button.setAttribute('aria-selected', isTarget ? 'true' : 'false');
                    button.tabIndex = isTarget ? 0 : -1;
                });
            }

            const views = [
                { id: 'dashboard', node: dom.dashboardView },
                { id: 'insights', node: dom.insightsView }
            ];

            views.forEach(view => {
                if (!view.node) {
                    return;
                }
                const shouldShow = view.id === nextView;
                view.node.classList.toggle('view--active', shouldShow);
                view.node.hidden = !shouldShow;
            });
        }

        function scheduleRefresh() {
            clearInterval(refreshTimer);
            refreshTimer = setInterval(() => requestData(false), REFRESH_INTERVAL);
        }

        function handleVisibilityChange() {
            if (document.hidden) {
                clearInterval(refreshTimer);
            } else {
                requestData(false);
                scheduleRefresh();
            }
        }

        async function requestData(manualTrigger = false) {
            if (manualTrigger) {
                dom.status.textContent = 'Refreshing…';
            }
            dom.refresh.disabled = true;

            try {
                const [feeds, weather] = await Promise.all([
                    Promise.all(FEEDS.map(feed => fetchFeedData(feed))),
                    fetchWeatherData()
                ]);
                latestWeather = weather;
                updateDashboard(feeds, weather);
                dom.status.textContent = `Updated ${formatDateTime(new Date())} · ${USERNAME} · Last ${DATA_LIMIT} points`;
            } catch (error) {
                console.error(error);
                dom.status.textContent = `Unable to load sensor data: ${error.message}`;
            } finally {
                dom.refresh.disabled = false;
            }
        }

        async function fetchFeedData(feed) {
            const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(USERNAME)}/feeds/${encodeURIComponent(feed.id)}/data?limit=${DATA_LIMIT}`;
            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.status === 404) {
                    throw new Error('Feed not found or not public');
                }
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status})`);
                }

                const raw = await response.json();
                const adjustValue = typeof feed.adjust === 'function'
                    ? feed.adjust
                    : (value => value + (typeof feed.offset === 'number' ? feed.offset : 0));

                const data = Array.isArray(raw)
                    ? raw.map(entry => {
                        const rawValue = Number.parseFloat(entry.value);
                        if (!Number.isFinite(rawValue)) {
                            return null;
                        }
                        const adjusted = adjustValue(rawValue);
                        return Number.isFinite(adjusted)
                            ? { value: adjusted, createdAt: entry.created_at }
                            : null;
                    }).filter(Boolean)
                    : [];

                return { ...feed, data };
            } catch (error) {
                return { ...feed, data: [], error: error.message };
            }
        }

        async function fetchWeatherData() {
            if (!WEATHER_LOCATION || !Number.isFinite(WEATHER_LOCATION.latitude) || !Number.isFinite(WEATHER_LOCATION.longitude)) {
                return null;
            }
            const params = new URLSearchParams({
                latitude: WEATHER_LOCATION.latitude,
                longitude: WEATHER_LOCATION.longitude,
                current: 'temperature_2m,relative_humidity_2m,dew_point_2m',
                timezone: 'auto'
            });
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('weather unavailable');
                }
                const payload = await response.json();
                const current = payload?.current || {};
                const temperature = Number(current.temperature_2m);
                const humidity = Number(current.relative_humidity_2m);
                const dewPoint = Number.isFinite(Number(current.dew_point_2m))
                    ? Number(current.dew_point_2m)
                    : computeDewPoint(temperature, humidity);
                const fetchedAt = current.time ? new Date(current.time) : new Date();
                if (!Number.isFinite(temperature)) {
                    return null;
                }
                return {
                    location: WEATHER_LOCATION.name,
                    temperature,
                    humidity: Number.isFinite(humidity) ? humidity : null,
                    dewPoint: Number.isFinite(dewPoint) ? dewPoint : null,
                    fetchedAt,
                    source: 'Open-Meteo'
                };
            } catch (error) {
                console.warn('Weather fetch failed', error);
                return null;
            }
        }

        function updateDashboard(feeds, weather) {
            const latestPayload = buildLatestPayload(feeds);
            if (latestPayload) {
                exposeLatestJson(latestPayload);
            }
            const seen = new Set();

            feeds.forEach(feed => {
                if (!feed || !feed.id) {
                    return;
                }
                seen.add(feed.id);
                if (feed.showCard !== false) {
                    renderMetricCard(feed);
                }
                if (feed.showDetail !== false) {
                    renderDetailCard(feed);
                }
            });

            removeStaleCards(dom.metricGrid, seen, 'card');
            removeStaleCards(dom.detailGrid, seen, 'detail');
            updateInsights(feeds, weather);
        }

        function updateInsights(feeds, weather) {
            if (!dom.insightsGrid) {
                return;
            }

            const temperatureFeed = feeds.find(feed => feed.id === 'home.temperature');
            const humidityFeed = feeds.find(feed => feed.id === 'home.humidity');
            const pressureFeed = feeds.find(feed => feed.id === 'home.pressure');
            const airFeed = feeds.find(feed => feed.id === 'home.gas');
            const fireAnalysis = analyzeFireCycles(temperatureFeed);

            const coverage = deriveCoverage([temperatureFeed, humidityFeed, pressureFeed, airFeed]);
            if (dom.insightsSummary) {
                const parts = [];
                if (coverage) {
                    parts.push(`Based on ${coverage.totalMs ? formatDuration(coverage.totalMs) : 'recent'} indoor readings`);
                    if (weather?.fetchedAt) {
                        parts.push(`Weather synced ${formatTime(weather.fetchedAt)}`);
                    }
                    dom.insightsSummary.textContent = `${parts.join(' · ')}`;
                } else {
                    dom.insightsSummary.textContent = 'Waiting for enough readings to build insights.';
                }
            }

            const cards = [];
            const tempComfort = buildComfortInsight(temperatureFeed, { min: 19, max: 22, label: 'Temperature comfort' });
            if (tempComfort) {
                cards.push(tempComfort);
            }

            const tempSwing = buildTemperatureSwingInsight(temperatureFeed);
            if (tempSwing) {
                cards.push(tempSwing);
            }

            const tempMicro = buildTemperatureMicroSwingInsight(temperatureFeed);
            if (tempMicro) {
                cards.push(tempMicro);
            }

            const fireCadence = buildFireCadenceInsight(fireAnalysis, temperatureFeed);
            if (fireCadence) {
                cards.push(fireCadence);
            }

            const fireTiming = buildFireTimingInsight(fireAnalysis, temperatureFeed);
            if (fireTiming) {
                cards.push(fireTiming);
            }

            const humidityComfort = buildComfortInsight(humidityFeed, { min: 40, max: 60, label: 'Humidity sweet spot' });
            if (humidityComfort) {
                cards.push(humidityComfort);
            }

            const condensation = buildCondensationInsight(temperatureFeed, humidityFeed);
            if (condensation) {
                cards.push(condensation);
            }

            const windowRisk = buildWindowCondensationInsight(temperatureFeed, humidityFeed, weather);
            if (windowRisk) {
                cards.push(windowRisk);
            }

            const pressureTrend = buildPressureTrendInsight(pressureFeed);
            if (pressureTrend) {
                cards.push(pressureTrend);
            }

            const airInsight = buildAirInsight(airFeed);
            if (airInsight) {
                cards.push(airInsight);
            }

            const outdoor = buildOutdoorWeatherInsight(weather);
            if (outdoor) {
                cards.push(outdoor);
            }

            renderInsightCards(cards);
        }

        function renderInsightCards(items) {
            if (!dom.insightsGrid) {
                return;
            }
            if (!items.length) {
                dom.insightsGrid.innerHTML = '<p class="insight-empty">Need more data to surface insights.</p>';
                return;
            }
            const sortedItems = items.slice().sort((a, b) => {
                const priorityA = Number.isFinite(a.priority) ? a.priority : 99;
                const priorityB = Number.isFinite(b.priority) ? b.priority : 99;
                if (priorityA === priorityB) {
                    return (a.label || '').localeCompare(b.label || '');
                }
                return priorityA - priorityB;
            });
            dom.insightsGrid.innerHTML = '';
            sortedItems.forEach(item => {
                const card = document.createElement('article');
                const variantClass = item.variant ? ` insight-card--${item.variant}` : '';
                card.className = `insight-card${variantClass}`;
                card.dataset.insightId = item.id;
                const progressMarkup = typeof item.progress === 'number'
                    ? `
                        <div class="insight-card__progress">
                            <p class="insight-progress-label">${escapeHtml(item.progressLabel || 'Progress')}</p>
                            <div class="insight-progress-bar">
                                <span style="width:${Math.min(Math.max(item.progress, 0), 1) * 100}%"></span>
                            </div>
                        </div>
                    `
                    : '';
                card.innerHTML = `
                    <div class="insight-card__header">
                        ${item.icon ? `<span class="insight-card__icon" aria-hidden="true">${escapeHtml(item.icon)}</span>` : ''}
                        <p class="insight-card__label">${escapeHtml(item.label)}</p>
                    </div>
                    <p class="insight-card__value">${escapeHtml(item.value)}</p>
                    <p class="insight-card__summary">${escapeHtml(item.summary)}</p>
                    ${progressMarkup}
                    ${item.meta ? `<p class="insight-card__meta">${escapeHtml(item.meta)}</p>` : ''}
                `;
                dom.insightsGrid.appendChild(card);
            });
        }

        function renderMetricCard(feed) {
            const { id, name, unit, data = [], error } = feed;
            let card = dom.metricGrid.querySelector(`[data-feed-id="${id}"]`);

            if (!card) {
                card = document.createElement('article');
                card.className = 'metric-card';
                card.dataset.feedId = id;
                card.innerHTML = `
                    <span class="metric-emoji" aria-hidden="true"></span>
                    <div class="metric-title">
                        <span class="metric-name">${escapeHtml(name || id)}</span>
                    </div>
                    <div class="metric-value">
                        <span class="metric-number">--</span>
                        <span class="metric-unit">${unit ? escapeHtml(unit) : ''}</span>
                    </div>
                    <span class="metric-timestamp"></span>
                    <div class="metric-extrema">
                        <div class="metric-extrema__item">
                            <span class="metric-extrema__label">High</span>
                            <span class="metric-extrema__value metric-high">--</span>
                            <span class="metric-extrema__time metric-high-time"></span>
                        </div>
                        <div class="metric-extrema__item">
                            <span class="metric-extrema__label">Low</span>
                            <span class="metric-extrema__value metric-low">--</span>
                            <span class="metric-extrema__time metric-low-time"></span>
                        </div>
                    </div>
                    <span class="metric-error"></span>
                `;
                dom.metricGrid.appendChild(card);
            }

            const emojiEl = card.querySelector('.metric-emoji');
            const numberEl = card.querySelector('.metric-number');
            const unitEl = card.querySelector('.metric-unit');
            const timestampEl = card.querySelector('.metric-timestamp');
            const highEl = card.querySelector('.metric-high');
            const highTimeEl = card.querySelector('.metric-high-time');
            const lowEl = card.querySelector('.metric-low');
            const lowTimeEl = card.querySelector('.metric-low-time');
            const errorEl = card.querySelector('.metric-error');

            unitEl.textContent = unit || '';

            if (error) {
                setCardVisualState(card, 'error');
                if (emojiEl) emojiEl.textContent = getEmojiForFeed(feed, 'error');
                numberEl.textContent = '--';
                highEl.textContent = '--';
                lowEl.textContent = '--';
                highTimeEl.textContent = '';
                lowTimeEl.textContent = '';
                errorEl.textContent = error;
                if (timestampEl) timestampEl.textContent = '';
                return;
            }

            errorEl.textContent = '';

            if (!data.length) {
                setCardVisualState(card, 'alert');
                if (emojiEl) emojiEl.textContent = getEmojiForFeed(feed, 'alert');
                numberEl.textContent = '--';
                highEl.textContent = '--';
                lowEl.textContent = '--';
                highTimeEl.textContent = '';
                lowTimeEl.textContent = '';
                if (timestampEl) timestampEl.textContent = '';
                return;
            }

            const state = determineCardState(feed, data);
            setCardVisualState(card, state, feed.id);
            if (emojiEl) emojiEl.textContent = getEmojiForFeed(feed, state);

            const latest = data[0];
            numberEl.textContent = formatNumber(latest.value);
            if (timestampEl) {
                timestampEl.textContent = formatTime(latest.createdAt);
            }

            if (data.length > 1) {
                const high = data.reduce((acc, entry) => entry.value > acc.value ? entry : acc, data[0]);
                const low = data.reduce((acc, entry) => entry.value < acc.value ? entry : acc, data[0]);
                highEl.textContent = formatNumber(high.value);
                highTimeEl.textContent = formatTime(high.createdAt);
                lowEl.textContent = formatNumber(low.value);
                lowTimeEl.textContent = formatTime(low.createdAt);
            } else {
                highEl.textContent = formatNumber(latest.value);
                lowEl.textContent = formatNumber(latest.value);
                highTimeEl.textContent = '';
                lowTimeEl.textContent = '';
            }
        }

        function renderDetailCard(feed) {
            const { id, name, unit, data = [], error } = feed;
            let detail = dom.detailGrid.querySelector(`[data-feed-id="${id}"]`);

            if (!detail) {
                detail = document.createElement('section');
                detail.className = 'detail-card';
                detail.dataset.feedId = id;
                detail.innerHTML = `
                    <div class="detail-header">
                        <h3 class="detail-title">${escapeHtml(name || id)}</h3>
                        <p class="detail-summary"></p>
                    </div>
                    <div class="detail-chart">
                        <canvas aria-label="${escapeHtml(name || id)} trend chart"></canvas>
                    </div>
                    <ul class="detail-list"></ul>
                    <p class="detail-error"></p>
                `;
                dom.detailGrid.appendChild(detail);
            }

            setDetailCardTheme(detail, feed.id);

            const summaryEl = detail.querySelector('.detail-summary');
            const listEl = detail.querySelector('.detail-list');
            const errorEl = detail.querySelector('.detail-error');
            const canvas = detail.querySelector('canvas');

            if (error) {
                summaryEl.textContent = '';
                listEl.innerHTML = '';
                errorEl.textContent = error;
                resetChart(id);
                return;
            }

            errorEl.textContent = '';

            if (!data.length) {
                summaryEl.textContent = 'No readings available.';
                listEl.innerHTML = '';
                resetChart(id);
                return;
            }

            const latest = data[0];
            const average = data.reduce((sum, entry) => sum + entry.value, 0) / data.length;
            summaryEl.textContent = buildDetailSummary(feed, latest.value, average, unit, data.length);

            const listEntries = data.slice(0, 1);
            listEl.innerHTML = listEntries
                .map(entry => `<li><span>${formatNumber(entry.value)} ${unit || ''}</span><time>${formatDateTime(entry.createdAt)}</time></li>`)
                .join('');

            renderChart(feed, canvas, data);
        }

        function renderChart(feed, canvas, data) {
            const chartColour = feed.color || '#0ea5e9';
            const points = data.slice().reverse().map(item => ({
                x: new Date(item.createdAt),
                y: item.value
            }));

            if (!charts.has(feed.id)) {
                const chart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        datasets: [{
                            label: feed.unit || 'Value',
                            data: points,
                            borderColor: chartColour,
                            backgroundColor: chartColour,
                            fill: false,
                            tension: 0.3,
                            borderWidth: 2,
                            pointRadius: 0,
                            parsing: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    tooltipFormat: 'MMM d, h:mm a',
                                    displayFormats: {
                                        hour: 'MMM d, h a',
                                        minute: 'h:mm a'
                                    }
                                },
                                ticks: {
                                    color: '#475569'
                                },
                                grid: {
                                    color: 'rgba(226, 232, 240, 0.6)'
                                }
                            },
                            y: {
                                ticks: {
                                    color: '#475569'
                                },
                                grid: {
                                    color: 'rgba(226, 232, 240, 0.6)'
                                }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label(context) {
                                        return ` ${formatNumber(context.parsed.y)}${feed.unit ? ` ${feed.unit}` : ''}`;
                                    }
                                }
                            }
                        }
                    }
                });
                charts.set(feed.id, chart);
            } else {
                const chart = charts.get(feed.id);
                chart.data.datasets[0].data = points;
                chart.update('none');
            }
        }

        function resetChart(feedId) {
            if (!charts.has(feedId)) {
                return;
            }
            const chart = charts.get(feedId);
            chart.data.datasets[0].data = [];
            chart.update('none');
        }

        function removeStaleCards(container, seenSet, type) {
            Array.from(container.children).forEach(child => {
                if (!seenSet.has(child.dataset.feedId)) {
                    const chart = charts.get(child.dataset.feedId);
                    if (chart) {
                        chart.destroy();
                        charts.delete(child.dataset.feedId);
                    }
                    child.remove();
                } else if (type === 'card') {
                    const feed = FEEDS.find(item => item.id === child.dataset.feedId);
                    if (feed && feed.showCard === false) {
                        const chart = charts.get(child.dataset.feedId);
                        if (chart) {
                            chart.destroy();
                            charts.delete(child.dataset.feedId);
                        }
                        child.remove();
                    }
                } else if (type === 'detail') {
                    const feed = FEEDS.find(item => item.id === child.dataset.feedId);
                    if (feed && feed.showDetail === false) {
                        const chart = charts.get(child.dataset.feedId);
                        if (chart) {
                            chart.destroy();
                            charts.delete(child.dataset.feedId);
                        }
                        child.remove();
                    }
                }

            });
        }

        function setCardVisualState(card, state, feedId) {
            CARD_STATE_CLASS_VALUES.forEach(cls => card.classList.remove(cls));
            const nextClass = resolveStateClass(state, feedId);
            card.classList.add(nextClass);
        }

        function determineCardState(feed, readings) {
            if (!readings.length) {
                return 'alert';
            }
            const latest = readings[0];

            if (typeof feed.coldBelow === 'number') {
                const coldThreshold = feed.coldBelow;
                const superColdThreshold = typeof feed.superColdBelow === 'number' ? feed.superColdBelow : null;
                const warmThreshold = typeof feed.warmAbove === 'number' ? feed.warmAbove : null;
                const warmMidThreshold = typeof feed.warmMidAbove === 'number' ? feed.warmMidAbove : null;

                if (warmThreshold !== null && latest.value >= warmThreshold) {
                    return 'warm';
                }
                if (warmMidThreshold !== null && latest.value >= warmMidThreshold) {
                    return 'superwarm';
                }
                if (superColdThreshold !== null && latest.value < superColdThreshold) {
                    return 'supercold';
                }
                if (latest.value < coldThreshold) {
                    return 'cold';
                }
                return 'ok';
            }

            if (Array.isArray(feed.goodRange) && feed.goodRange.length === 2) {
                const [min, max] = feed.goodRange;
                if (latest.value >= min && latest.value <= max) {
                    return 'ok';
                }
                return 'alert';
            }

            if (feed.preferLower) {
                const average = readings.reduce((sum, entry) => sum + entry.value, 0) / readings.length;
                return latest.value <= average ? 'ok' : 'alert';
            }

            if (feed.preferHigher) {
                const average = readings.reduce((sum, entry) => sum + entry.value, 0) / readings.length;
                return latest.value >= average ? 'ok' : 'alert';
            }

            return 'ok';
        }

        function resolveStateClass(state, feedId) {
            if (feedId === 'home.temperature') {
                if (state === 'ok') {
                    return 'metric-card--temperature-ok';
                }
                if (state === 'supercold') {
                    return 'metric-card--supercold';
                }
                if (state === 'superwarm') {
                    return 'metric-card--temperature-superwarm';
                }
                return CARD_STATE_CLASSES[state] || CARD_STATE_CLASSES.ok;
            }
            if (feedId === 'home.humidity') {
                return state === 'alert' ? 'metric-card--humidity-alert' : 'metric-card--humidity-ok';
            }
            if (feedId === 'home.pressure') {
                return state === 'alert' ? 'metric-card--pressure-alert' : 'metric-card--pressure-ok';
            }
            return CARD_STATE_CLASSES[state] || CARD_STATE_CLASSES.ok;
        }

        function setDetailCardTheme(detailEl, feedId) {
            detailEl.classList.remove('temperature-detail', 'humidity-detail', 'pressure-detail', 'air-detail');
            if (feedId === 'home.temperature') {
                detailEl.classList.add('temperature-detail');
            } else if (feedId === 'home.humidity') {
                detailEl.classList.add('humidity-detail');
            } else if (feedId === 'home.pressure') {
                detailEl.classList.add('pressure-detail');
            } else if (feedId === 'home.gas') {
                detailEl.classList.add('air-detail');
            }
        }

        function getEmojiForFeed(feed, state) {
            if (!feed || !feed.emoji) {
                return '✨';
            }
            return feed.emoji[state] || feed.emoji.default || '✨';
        }

        function buildDetailSummary(feed, latestValue, average, unit, sampleCount) {
            const base = `Latest ${formatNumber(latestValue)} ${unit || ''} · Avg ${formatNumber(average)} ${unit || ''} (${sampleCount} points)`;

            if (!feed) {
                return base;
            }

            let mood = 'ok';
            let extra = '';

            if (feed.id === 'home.temperature') {
                if (latestValue >= 24) {
                    mood = 'hot';
                } else if (latestValue >= 21) {
                    mood = 'warm';
                } else if (latestValue < 16) {
                    mood = 'supercold';
                } else if (latestValue < 19) {
                    mood = 'cold';
                }
            } else if (feed.id === 'home.humidity') {
                if (latestValue < 35) {
                    mood = 'low';

        function analyzeFireCycles(feed) {
            if (!feed || !Array.isArray(feed.data) || feed.data.length < 3) {
                return null;
            }
            const series = feed.data
                .map(entry => {
                    const timestamp = Date.parse(entry.created_at ?? entry.createdAt);
                    const value = Number(entry.value);
                    if (!Number.isFinite(value) || Number.isNaN(timestamp)) {
                        return null;
                    }
                    return { value, timestamp };
                })
                .filter(Boolean)
                .sort((a, b) => a.timestamp - b.timestamp);

            if (series.length < 3) {
                return null;
            }

            const events = [];
            const MIN_HEAT_DELTA = 0.15;
            const MIN_FIRE_RISE = 1;
            const TARGET_TEMP = 18;
            let heating = null;

            for (let i = 1; i < series.length; i++) {
                const prev = series[i - 1];
                const curr = series[i];
                const deltaTemp = curr.value - prev.value;
                const deltaMs = curr.timestamp - prev.timestamp;
                if (deltaMs <= 0) {
                    continue;
                }

                if (deltaTemp > MIN_HEAT_DELTA) {
                    if (!heating) {
                        heating = {
                            startTime: prev.timestamp,
                            startValue: prev.value,
                            startIndex: i - 1,
                            rise: 0,
                            peakValue: prev.value,
                            peakTime: prev.timestamp,
                            peakIndex: i - 1,
                            endTime: curr.timestamp,
                            endValue: curr.value
                        };
                    }
                    heating.rise += deltaTemp;
                    if (curr.value >= heating.peakValue) {
                        heating.peakValue = curr.value;
                        heating.peakTime = curr.timestamp;
                        heating.peakIndex = i;
                    }
                    heating.endTime = curr.timestamp;
                    heating.endValue = curr.value;
                } else if (deltaTemp <= 0) {
                    if (heating) {
                        const endTime = heating.endTime ?? prev.timestamp;
                        const durationMs = endTime - heating.startTime;
                        if (heating.rise >= MIN_FIRE_RISE && durationMs >= 15 * 60 * 1000) {
                            events.push({
                                startTime: heating.startTime,
                                startValue: heating.startValue,
                                peakTime: heating.peakTime,
                                peakValue: heating.peakValue,
                                peakIndex: heating.peakIndex ?? i - 1,
                                rise: heating.rise,
                                durationMs
                            });
                        }
                        heating = null;
                    }
                }
            }

            if (heating) {
                const durationMs = (heating.endTime ?? heating.peakTime) - heating.startTime;
                if (heating.rise >= MIN_FIRE_RISE && durationMs >= 15 * 60 * 1000) {
                    events.push({
                        startTime: heating.startTime,
                        startValue: heating.startValue,
                        peakTime: heating.peakTime,
                        peakValue: heating.peakValue,
                        peakIndex: heating.peakIndex ?? series.length - 1,
                        rise: heating.rise,
                        durationMs
                    });
                }
            }

            const coverageHours = (series[series.length - 1].timestamp - series[0].timestamp) / 3600000;
            const avgRise = events.length
                ? events.reduce((sum, event) => sum + event.rise, 0) / events.length
                : null;
            let avgIntervalHours = null;
            if (events.length > 1) {
                let totalInterval = 0;
                for (let i = 1; i < events.length; i++) {
                    totalInterval += (events[i].startTime - events[i - 1].startTime) / 3600000;
                }
                avgIntervalHours = totalInterval / (events.length - 1);
            }

            const dropDurations = [];
            const dropRateStats = [];
            events.forEach(event => {
                const dropTs = findDropTimestamp(series, event.peakIndex ?? 0, TARGET_TEMP);
                if (Number.isFinite(dropTs)) {
                    const durationHours = (dropTs - event.peakTime) / 3600000;
                    if (durationHours > 0) {
                        dropDurations.push(durationHours);
                        const dropAmount = Math.max(event.peakValue - TARGET_TEMP, 0);
                        if (dropAmount > 0.1) {

                                durationHours
                            });

                if (totalWeight > 0) {

                }
            }

            const lastEvent = events.length ? events[events.length - 1] : null;
            const coverageWindowHours = coverageHours

                minPoints: 4,
                minDrop: 0.2,
                minSpanMs: 45 * 60 * 1000,
                startTime: lastEvent?.peakTime ?? null

                recentCoolingRate,

                nextFireTime,

                priority: 4,
                variant: 'weather',
                icon: '🌤️'
            };
        }

        function deriveCoverage(feeds) {
            const timestamps = [];
            feeds.forEach(feed => {
                if (!feed || !Array.isArray(feed.data)) {
                    return;
                }
                feed.data.forEach(entry => {
                    const ts = Date.parse(entry.created_at ?? entry.createdAt);
                    if (!Number.isNaN(ts)) {
                        timestamps.push(ts);
                    }
                });
            });
            if (!timestamps.length) {
                return null;
            }
            const latestTs = Math.max(...timestamps);
            const earliestTs = Math.min(...timestamps);
            return {
                totalMs: Math.max(0, latestTs - earliestTs),
                latest: new Date(latestTs)
            };
        }

        function computeRangeStats(readings, predicate) {
            if (!Array.isArray(readings) || readings.length < 2 || typeof predicate !== 'function') {
                return null;
            }
            const sorted = readings.slice().sort((a, b) => {
                const aTs = Date.parse(a.created_at ?? a.createdAt);
                const bTs = Date.parse(b.created_at ?? b.createdAt);
                if (Number.isNaN(aTs) || Number.isNaN(bTs)) {
                    return 0;
                }
                return aTs - bTs;
            });

            let totalMs = 0;
            let inRangeMs = 0;
            let currentRunMs = 0;
            let longestMs = 0;
            let longestEndTs = null;

            for (let i = 1; i < sorted.length; i++) {
                const prev = sorted[i - 1];
                const curr = sorted[i];
                const prevTs = Date.parse(prev.created_at ?? prev.createdAt);
                const currTs = Date.parse(curr.created_at ?? curr.createdAt);
                if (Number.isNaN(prevTs) || Number.isNaN(currTs) || currTs <= prevTs) {
                    continue;
                }
                const delta = currTs - prevTs;
                totalMs += delta;
                if (predicate(prev.value)) {
                    inRangeMs += delta;
                    currentRunMs += delta;
                    if (currentRunMs > longestMs) {
                        longestMs = currentRunMs;
                        longestEndTs = currTs;
                    }
                } else {
                    currentRunMs = 0;
                }
            }

            const longestEnd = typeof longestEndTs === 'number' ? new Date(longestEndTs) : null;
            return {
                totalMs,
                inRangeMs,
                longestMs,
                longestEnd
            };
        }

        function findDropTimestamp(series, startIndex, targetTemp) {
            if (!Array.isArray(series) || !series.length || !Number.isFinite(targetTemp)) {
                return null;
            }
            const begin = Math.max(0, startIndex || 0);
            for (let i = begin; i < series.length; i++) {
                if (series[i].value <= targetTemp) {
                    return series[i].timestamp;
                }
            }
            return null;
        }

        function computeCoolingTrendRate(series, options = {}) {
            if (!Array.isArray(series) || series.length < 2) {
                return null;
            }
            const {
                windowMs = 3 * 3600000,
                minPoints = 5,
                minDrop = 0.2,
                minSpanMs = 45 * 60 * 1000,
                startTime = null
            } = options;

            const earliest = series[0].timestamp;
            const latest = series[series.length - 1].timestamp;

            let cutoff = earliest;
            if (Number.isFinite(windowMs)) {
                cutoff = Math.max(cutoff, latest - windowMs);
            }
            if (Number.isFinite(startTime)) {
                cutoff = Math.max(cutoff, startTime);
            }

            const window = series.filter(point => point.timestamp >= cutoff && point.timestamp <= latest);
            if (window.length < minPoints) {
                return null;
            }

            const spanMs = window[window.length - 1].timestamp - window[0].timestamp;
            if (!Number.isFinite(spanMs) || spanMs < minSpanMs) {
                return null;
            }

            const totalDrop = window[0].value - window[window.length - 1].value;
            if (!Number.isFinite(totalDrop) || totalDrop < minDrop) {
                return null;
            }

            const meanTime = window.reduce((sum, point) => sum + point.timestamp, 0) / window.length;
            const meanTemp = window.reduce((sum, point) => sum + point.value, 0) / window.length;
            let numerator = 0;
            let denominator = 0;
            window.forEach(point => {
                const timeOffset = point.timestamp - meanTime;
                numerator += timeOffset * (point.value - meanTemp);
                denominator += timeOffset * timeOffset;
            });

            if (denominator === 0) {
                return null;
            }

            const slopePerMs = numerator / denominator;
            const slopePerHour = slopePerMs * 3600000;
            if (!Number.isFinite(slopePerHour) || slopePerHour >= -0.02) {
                return null;
            }

            return Math.abs(slopePerHour);
        }

        function computeDewPoint(tempC, humidity) {
            if (!Number.isFinite(tempC) || !Number.isFinite(humidity) || humidity <= 0 || humidity > 100) {
                return null;
            }
            const a = 17.62;
            const b = 243.12;
            const gamma = Math.log(humidity / 100) + (a * tempC) / (b + tempC);
            const dewPoint = (b * gamma) / (a - gamma);
            return Number.isFinite(dewPoint) ? dewPoint : null;
        }

        function estimateWindowTemperature(indoorTemp, outdoorTemp) {
            if (!Number.isFinite(indoorTemp) || !Number.isFinite(outdoorTemp)) {
                return null;
            }
            const transferFactor = 0.3; // heuristic for double-pane performance
            return outdoorTemp + (indoorTemp - outdoorTemp) * transferFactor;
        }

        function formatDuration(ms) {
            if (!Number.isFinite(ms) || ms <= 0) {
                return '0m';
            }
            const minutes = Math.round(ms / 60000);
            if (minutes < 1) {
                return '<1m';
            }
            const hours = Math.floor(minutes / 60);
            const remainingMinutes = minutes % 60;
            const parts = [];
            if (hours) {
                parts.push(`${hours}h`);
            }
            if (remainingMinutes) {
                parts.push(`${remainingMinutes}m`);
            }
            return parts.length ? parts.join(' ') : '0m';
        }


        function formatNumber(value) {
            if (!Number.isFinite(Number(value))) {
                return '--';
            }
            const numberValue = Number(value);
            const absValue = Math.abs(numberValue);
            const digits = absValue >= 100 ? 1 : absValue >= 10 ? 2 : 2;
            return numberValue.toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: digits
            });
        }

        function formatDateTime(input) {
            const date = input instanceof Date ? input : new Date(input);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatTime(input) {
            const date = new Date(input);
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        (function () {
  const q = new URLSearchParams(location.search);
  if (q.has('widget')) {
    // Ensure we build + expose right away for the widget WebView
    try { requestData(true); } catch (e) {}
  }
})();
    </script>
